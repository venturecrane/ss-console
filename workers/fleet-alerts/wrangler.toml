# ss-fleet-alerts — heartbeat-red / HARD_STOP alerter (#1709).
#
# Closes ADR 0064's honesty-banner gap: a down Machine was dashboard-visible
# but paged no one. Every 2 minutes this Worker evaluates fleet_status and
# emails team@smd.services on condition TRANSITIONS (edge-triggered via
# fleet_alert_state, migration 0085): one alert when a seat goes red, one
# recovery notice when it comes back. Deployed by deploy.yml alongside the
# cost workers; RESEND_API_KEY + FLEET_ALERTS_BEARER staged via
# `wrangler secret put` (secrets persist across deploys on Workers).
name = "ss-fleet-alerts"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Enable the workers.dev route so GET /health and the bearer-gated POST /run are
# reachable for live verification (WP-0 found the route disabled — error 1042).
# /run stays bearer-gated (FLEET_ALERTS_BEARER); /health returns {ok:true} only.
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "ss-console-db"
database_id = "65171b23-d615-42a7-84e7-a4fac20d063c"

[triggers]
crons = ["*/2 * * * *"]

[vars]
ALERT_FROM_EMAIL = "SMD Services Ops <team@smd.services>"
ALERT_TO_EMAIL = "team@smd.services"
# A seat is red when its last heartbeat is older than this. Matches the
# customer.yaml observability defaults (period 60s + grace 5m).
HEARTBEAT_RED_SECONDS = "300"
# A job overdue past its next_run_at by more than this fires work_overdue.
# MUST match src/lib/admin/fleet-status.ts WORK_OVERDUE_RED_SECONDS (the admin
# roster and this worker are separate packages; the shared 900 default is a
# documented contract, not a cross-package import).
WORK_OVERDUE_RED_SECONDS = "900"
# ss#2488 part 2: seconds the gateway loop heartbeat may be stale before
# gateway_loop_wedged fires. MUST stay BELOW the seat supervisor's kill point --
# SMD_GATEWAY_LIVENESS_STALE_SECONDS x 2 samples + the dump and TERM graces,
# ~270s at defaults (operator/templates/entrypoint.sh) -- or the page lands after
# the restart it was meant to precede. With a 60s heartbeat period and up to 120s
# of cron lag, the D1 row must be red by ~T+150 for the worst-case sample to land
# in time; 120 does that. Floor 60 in the parser. Same sentence lives in
# entrypoint.sh; nothing enforces the pair across the two repos.
GATEWAY_LOOP_RED_SECONDS = "120"
# Minimum writer-side failure-run age before the conn-class connector_down
# path fires (ADR 0080). MUST match src/lib/admin/fleet-status.ts
# CONNECTOR_DOWN_RUN_AGE_SECONDS (same documented-contract shape as above).
CONNECTOR_DOWN_RUN_AGE_SECONDS = "300"
# ss#2148 pre-expiry alerting. This is the CURRENT vendor lifetime, not a
# universal one: Smokeball raised refresh-token validity from 30 to 180 days
# effective 2026-08-24, keyed to the token's ISSUE date, so a token minted
# before that cutover still dies at 30. src/token-expiry.ts dates each token
# from its reported age and applies the older lifetime to pre-cutover ones —
# do NOT collapse that back into this single number.
# Verified 2026-09-02 (vfy_01M1HBKA7DMVT108T6621WRG6P) against
# docs.smokeball.com/docs/api-docs/2t26gcuuqf1wk-authorization-code-grant:
# "The 180-day expiry took effect on 24 August 2026 and applies to refresh
#  tokens issued on or after that date."
# History: this said "30 days (vendor-confirmed)" from 2026-08-09 while
# operator/verticals/law-firm/smokeball-surface.md still listed the lifetime as
# ASSUMED. The figure was in fact read from vendor docs only during the
# 2026-08-02 outage, six weeks after ADR 0054 first asserted it.
# connector_token_expiring:smokeball opens when the seat-reported token-file age
# reaches (lifetime - warn) days. NOTE it auto-resolves only when the token file
# is REWRITTEN — Smokeball does not rotate on refresh, so in practice only a
# re-consent resolves it, never ordinary traffic.
SMOKEBALL_REFRESH_TOKEN_LIFETIME_DAYS = "180"
TOKEN_EXPIRY_WARN_DAYS = "5"
ADMIN_BASE_URL = "https://admin.smd.services"

# Secret (optional), staged via `wrangler secret put ALERTER_HEALTHCHECKS_PING_URL`:
# the alerter's own healthchecks.io check, pinged at the end of every successful
# run so this Worker's own death pages independently. Unset = self-ping skipped.

