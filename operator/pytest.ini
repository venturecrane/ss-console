[pytest]
# importlib mode keeps per-skill `pre_run.py` modules from colliding
# at import time. Without it, the first `pre_run.py` to be imported
# claims the bare `pre_run` module name and subsequent skill tests
# get the wrong module's symbols. See ADR 0021 Stream B (#1062, #1070).
addopts = --import-mode=importlib
# The tree root on sys.path, so `bin.lib.*`, `adapter.*`, `workspace_broker.*`
# and `rehearsal.*` resolve under a bare local `pytest` exactly as they do
# under CI's editable install. Scripts that used to put the root there
# themselves (the sys.path shims, removed from 2026-09-14) no longer do.
pythonpath = .
# Must stay identical to the pytest invocation in
# .github/workflows/operator-substrate.yml ("Run pytest suites"). A narrower
# list here means a bare local `pytest` silently skips suites CI runs, and the
# first time you learn that is on a red PR. connectors/ is deliberately absent
# from both: it runs in its own per-connector venv conformance step.
testpaths =
    adapter/tests
    adapter/evidence/tests
    adapter/voice/tests
    safety-substrate/tests
    bin/tests
    rehearsal/tests
    workspace_broker/tests
    templates/tests
    templates/drafting/tests
    tests
    skills
