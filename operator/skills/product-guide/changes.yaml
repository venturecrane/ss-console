# What changed in the product library, in the words each listed person is sent.
#
# Read by code only (operator/hermes-smd-overlay/shared/library_notice.py): the
# product-guide skill's daily pre_run sends each person on the guide seat one
# email with the lines of every entry newer than the one they were last sent
# (the newest only, for a person never sent one). The model composes nothing.
#
# RULES (pinned by operator/hermes-smd-overlay/tests/test_library_notice.py):
# - Append only. Never edit or remove a sent entry; say a correction in a new one.
# - `id` is an integer, strictly greater than the entry above it.
# - `lines` are rep-facing: what we now say, plain sentences. No dates, clock
#   times, amounts, exclamation marks or em dashes (every rendered entry is run
#   through the seat's reply checks).
# - `library_sha256` is a hash over every file in references/. The newest entry
#   must match the library as committed. After changing references/, add an
#   entry and regenerate its hash:
#       cd operator/hermes-smd-overlay && uv run python -m shared.library_notice rehash
entries:
  - id: 1
    lines:
      - You can send the guide a post, deck text, a one-pager or a proposal draft, pasted or forwarded, and it checks the wording against the house rules and the library, then returns a revised draft. Paste the text of a deck; attached files are not read.
      - Ask the guide to prep you for a meeting with a kind of business. It brings the matching industry pack, the objections that buyer raises with answers, discovery questions to ask, and the demo acts to show.
      - Ask for a proposal sketch for a lead on your desk. The guide lists the jobs from the library that fit, each with where it comes from, for SMD to scope. SMD sets scope, price and timing.
      - A new lesson, the demo meeting, walks through the acts to show a prospect and how to describe everything else as what SMD configures. The quiz has new questions on it.
      - The guide describes the Operator by what SMD sets up for a client, and labels each job as running for a client today; built, set up per client; or configured per engagement.
      - When the product library changes, the guide emails you a short note like this one saying what we now say.
    library_sha256: 0862188fd28e807906da4914e10edc5346241d97ece6bfe14586db669b3755d9
  - id: 2
    lines:
      - The library now covers real estate brokerages in depth, with how a brokerage works, where its coordinators' time goes, what the Operator takes on for the brokerage, its agents and their clients, the line it holds on MLS data and fair housing, and questions to explore.
      - The library now covers law firms and personal injury practices in depth, from records and the chronology through deadlines, drafts and settled cases, with the line that keeps the lawyer's work the lawyer's.
      - A new document, making the case, answers the questions an owner asks before saying yes, covering risk, control, what the people affected see, how a pilot is shaped and how it is stopped, each with where the library says it.
    library_sha256: 52e9242c47765b8db7252108a0ab24391297ba06ffc7031ef201fadeefe8d46c
  - id: 3
    lines:
      - A new document lists real estate use ideas by role, for the broker, agents, transaction coordinators and office staff, and buyers and sellers, each with where it comes from in the library, to brainstorm with a brokerage. It covers open-house follow-up, contract deadlines, missing documents, listing launches, coaching and recruiting, showing feedback, status updates and a weekly broker summary, and what stays with licensed people.
    library_sha256: b90029a89e878dc2a1289359a77d5e341f8a060c9c4da78260d04b06fd0cadcb
  - id: 4
    lines:
      - The hourly health check now covers all seven kinds of queued job, matter records included. A job waiting in its queue behind another kind of job that must finish first is described as waiting, not stalled.
    library_sha256: 8c65c385bce65bde001b9a76ac9b8f8428cd697cf5762b162afd5462e4f50939
  - id: 5
    lines:
      - The Operator can now copy or move documents already on a matter into one of the matter's folders, so a request like create a folder and put these documents in it is done start to finish.
    library_sha256: 77ebf84d34ca0c787f75c224441c858416b90c4a533bbcd5427cb6617e3c1fb9
