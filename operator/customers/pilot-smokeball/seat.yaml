# Seat inventory entry. CONSOLE-SIDE ONLY: read by scripts/lib/seat-inventory.ts,
# never published to R2 and never read by the seat, so nothing here can fail a
# seat at boot. After editing run `npm run gen:seat-registries`;
# tests/seat-inventory.test.ts fails while a generated registry is stale.
#
# SMD's demo seat (ADR 0107): the real Operator working for the fictional firm
# Brannock & Ferreira LLP on SMD's own Smokeball staging tenant, driven by a
# sales representative in front of a prospect (docs/handbook/demo-seat.md). Its
# customer.yaml authors the matching seat.kind: demo (tests/demo-seat.test.ts).
# It gates no release: client seats are gated by their release twin, not by
# this seat.

# What this seat is for (ADR 0107): client | release-twin | demo | internal.
purpose: demo
# The seat's Fly app (ADR 0036). Authored, never derived: confirm with
# `fly apps list`. null = no app yet, and then unprovisioned_reason is required.
fly_app: hermes-pilot-smokeball
# Release ring (operator/bin/fleet release walks rings in order).
ring: 2
# The day this seat's customer.yaml first landed on main. Orders seats in a ring.
authored: '2026-06-15'
# The client this seat's obligations roll up to (scripts/lib/seat-clients.mjs).
# Absent means the seat is its own client.
client: smd-services
