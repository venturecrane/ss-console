        body: |
          Date of service: 12/18/2025   Priya Raghunathan, MD, Orthopedic Spine Surgery
          Payment: third-party medical funding (MedFin Capital LLC, account W-2211).

          HISTORY
          Mr Whitfield presents on referral for right lower extremity radicular pain following
          a rear-end motor vehicle collision on November 2, 2025 in which his stopped vehicle
          was struck by a tractor-trailer. Prior lumbar strain in 2019 resolved with therapy,
          with no symptoms in the years before this collision.

          IMAGING
          MRI of December 8, 2025 demonstrates a right paracentral disc extrusion at L4-L5
          displacing the traversing right L5 nerve root. Findings correlate with the
          clinical examination.
      - id: ragh-c2
        title: Consultation (continued)
        date: '2025-12-18'
        body: |
          EXAMINATION
          Positive straight-leg raise on the right at 40 degrees, sensory diminishment in the
          right L5 distribution, and 5/5 motor strength throughout. No cauda equina signs.

          ASSESSMENT
          Right L4-L5 disc extrusion with right L5 radiculopathy.

          RECOMMENDATION
          Transforaminal epidural steroid injection at right L4-L5, followed by a structured
          physical therapy course. Surgical intervention is not indicated at this time and
          would be considered only on progression or failure of conservative care. Risks,
          benefits and alternatives discussed.

          WORK STATUS
          Remain off work.
          Priya Raghunathan, MD
