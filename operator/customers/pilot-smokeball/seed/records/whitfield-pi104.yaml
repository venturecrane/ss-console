        title: Procedure Note
        date: '2026-01-06'
        body: |
          Date of service: 01/06/2026   Surgeon: Priya Raghunathan, MD
          Procedure: right L4-L5 transforaminal epidural steroid injection under fluoroscopic
          guidance.
          Medications: methylprednisolone 80 mg and lidocaine 1% 2 mL.

          TECHNIQUE
          Prone position, sterile preparation. Under fluoroscopic guidance a 22-gauge spinal
          needle was advanced to the right L4-L5 neural foramen. Contrast confirmed
          appropriate epidural spread without vascular uptake. Medication injected.
          No immediate complication. Patient discharged in stable condition and referred to
          physical therapy.
