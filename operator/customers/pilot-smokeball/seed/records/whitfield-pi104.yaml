        title: Final Treating Report
        date: '2026-03-12'
        body: |
          Date: 03/12/2026   Injury: November 2, 2025, motor vehicle collision

          STATUS
          Mr Whitfield completed twenty sessions of physical therapy following the January 6,
          2026 injection and was discharged from therapy on March 8, 2026. Radicular pain has
          improved from 6/10 to an intermittent 2/10. Straight-leg raise is negative. Sensory
          diminishment in the right L5 distribution persists.

          MAXIMUM MEDICAL IMPROVEMENT
          Reached March 8, 2026.

          WORK STATUS
          Held off work entirely from November 3, 2025 through January 25, 2026, and released
          to light duty limited to 20 hours per week from January 26, 2026 through March 8,
          2026. Released to full duty without restriction effective March 9, 2026.
