      - id: pcps-0520-a
        title: Consultation
        date: '2026-05-20'
        body: |
          Date of service: 05/20/2026   Surgeon: Ines Abernathy, MD

          HISTORY
          Sofia is a 10-year-old girl seen with her mother for a scar of the left forearm after a
          dog bite on 03/04/2026, treated at Valley Pediatric with irrigation and adhesive
          strips. A consult was offered in March and the family chose to wait. Since then the
          larger scar has become thicker, itchy and more noticeable. Sofia is self-conscious
          about it and has stopped wearing short sleeves. No prior scars or keloids.

          EXAMINATION
          Left volar forearm: raised, erythematous scar 2.1 cm x 0.6 cm, firm, consistent in
          appearance with a hypertrophic scar, confined to the original wound. Second scar
          0.7 cm, flat and pale. No contracture. Full wrist and finger motion.
          Vancouver Scar Scale 7 at the larger scar.
          Photographs taken with parental consent.
      - id: pcps-0520-b
        title: Consultation (continued)
        date: '2026-05-20'
        body: |
          IMPRESSION
          1. Hypertrophic scar, left forearm, after dog bite
          2. Second scar flat and mature

          PLAN
          Silicone gel sheeting 12 to 23 hours a day for at least 3 months.
          Daily scar massage. Broad-spectrum sunscreen on the scar when outdoors.
          Re-evaluate in 3 months. If the scar remains raised after 6 to 12 months of
          conservative care, options include intralesional steroid injection and, later,
          surgical scar revision. Surgical revision is not recommended before the scar
          matures. Risks and expectations discussed with mother.

          Ines Abernathy, MD
      - { kind: education, count: 16, topic: 'Silicone Gel Sheeting and Scar Massage' }
      - {
