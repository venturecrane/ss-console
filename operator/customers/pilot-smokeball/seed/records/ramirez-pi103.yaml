      - id: vpa-0304-a
        title: Sick Visit Note
        date: '2026-03-04'
        body: |
          Date of service: 03/04/2026   Time: 11:20   Provider: Lauren Hollings, MD
          Accompanied by: mother, Elena Ramirez

          HISTORY OF PRESENT ILLNESS
          10-year-old girl bitten on the left forearm by a neighbor's dog at about 9:30 this
          morning. The dog, a medium-sized mixed breed, got out of its yard and bit her once as
          she walked past. Mother washed the wound with soap and water at home. No other
          injuries. The owner reports the dog's rabies vaccination is current; animal control
          has been notified by the family. No prior injury to this arm.

          REVIEW OF SYSTEMS
          No fever. No numbness or tingling in the hand. Able to move all fingers.

          PHYSICAL EXAMINATION
          Weight 33.1 kg. Temp 98.4 F. HR 92. BP 104/66.
          Left volar forearm, mid-shaft: two puncture wounds, 1.5 cm and 0.8 cm, with
          surrounding ecchymosis about 3 cm. No active bleeding. No exposed tendon. Full
          active range of motion of wrist and fingers. Sensation intact in median, ulnar and
          radial distributions. Capillary refill under 2 seconds.
      - id: vpa-0304-b
        title: Sick Visit Note (continued)
        date: '2026-03-04'
        body: |
          PROCEDURE
          Wounds irrigated with 500 mL normal saline under pressure. Wound culture obtained
          from the larger puncture. Wound edges approximated with adhesive strips; the
          punctures were not sutured, given the infection risk of a bite wound. Sterile
          dressing applied. Patient tolerated well.

          ASSESSMENT
          1. Dog bite, left forearm, two puncture wounds
          2. Tetanus immunization current (Tdap given at age 10 well visit)

          PLAN
          Ceftriaxone 50 mg/kg IM given once in clinic.
          Amoxicillin-clavulanate 875 mg by mouth twice daily for 5 days, sent to pharmacy.
          Keep dressing dry for 24 hours, then daily dressing change.
          Nurse wound check in 3 days. Return sooner for spreading redness, fever or pus.
          Rabies post-exposure prophylaxis not indicated if the dog remains healthy during the
          10-day observation period; family to confirm with animal control.

          Lauren Hollings, MD
          Electronically signed 03/04/2026 12:48
      - { kind: vitals, count: 1, date: '2026-03-04', start: '11:05' }
      - { kind: orders, count: 1, date: '2026-03-04', start: '11:30' }
      - { kind: education, count: 18, topic: 'Animal Bites: Caring for the Wound at Home' }
      - id: vpa-0305
        title: Telephone Encounter
        date: '2026-03-05'
        body: |
          Date: 03/05/2026   Time: 16:10   Call taken by: Grace Tanaka, RN

          Mother called. Reports mild pinkness around the larger wound, no streaking, no fever.
          Child taking amoxicillin-clavulanate as prescribed, one dose missed this morning.
          Advised to give the next dose on schedule, do not double. Warm compress 3 times a day.
          Mark the edge of the redness with a pen and call back if it spreads past the line.
          Keep the nurse visit on 03/07. Mother verbalized understanding.

          Grace Tanaka, RN
      - id: vpa-0307
        title: Nurse Visit, Wound Check
        date: '2026-03-07'
        body: |
          Date of service: 03/07/2026   Nurse: Grace Tanaka, RN   Supervising: Lauren Hollings, MD

          Wound check, left forearm. Adhesive strips intact on the smaller wound and lifting on
          the larger wound; removed and replaced. Pinkness reduced from 03/05, no drainage, no
          warmth. Temp 98.2 F. Wound culture from 03/04: Pasteurella multocida, sensitive to
          amoxicillin-clavulanate. Continue the antibiotic to complete 5 days.
          Follow up with Dr. Hollings in 11 days.
      - id: vpa-0318
        title: Follow-Up Visit
        date: '2026-03-18'
        body: |
          Date of service: 03/18/2026   Provider: Lauren Hollings, MD

          INTERVAL HISTORY
          Completed the antibiotic course. No fever. Sofia says the arm itches but does not hurt.
          Mother reports she is shy about the marks and keeps her sleeve down at school.

          EXAMINATION
          Left forearm: both wounds closed and healing well with no sign of infection. The
          larger site is raised and pink, 1.8 cm. The smaller site is flat, 0.7 cm.
          Full range of motion. Neurovascularly intact.

          ASSESSMENT
          Healing dog bite, left forearm. Scarring noted at the larger site.

          PLAN
          Scar massage and sun protection discussed. Plastic surgery consult offered for scar
          management; declined at this time by mother, who would like to wait and see.
          Return as needed.

          Lauren Hollings, MD
      - { kind: education, count: 3, topic: 'Scar Care After a Wound Heals' }
