      - id: vor-op1
        title: Operative Report
        date: '2026-01-21'
        body: |
          Date of surgery: 01/21/2026   Surgeon: Amara Okonkwo, MD, Orthopedic Surgery
          Anesthesia: regional block with sedation

          PREOPERATIVE DIAGNOSIS
          Comminuted intra-articular fracture, left distal radius, with dorsal angulation and
          articular step-off, failed closed management.
          POSTOPERATIVE DIAGNOSIS
          Same.
          PROCEDURE
          Open reduction and internal fixation, left distal radius, with volar locking plate
          and screws.
          INDICATIONS
          Post-reduction imaging demonstrated persistent dorsal angulation of 18 degrees and a
          2 mm articular step-off. Operative fixation was recommended to restore articular
          congruity. Consent obtained.
      - id: vor-op2
        title: Operative Report (continued)
        date: '2026-01-21'
        body: |
          FINDINGS AND TECHNIQUE
          Standard volar Henry approach. The fracture was comminuted with three principal
          fragments and a depressed articular fragment. The articular surface was elevated and
          held with K-wires. A volar locking plate was applied with locking screws distally and
          cortical screws proximally. Fluoroscopy confirmed restoration of radial height, volar
          tilt and articular congruity with no residual step-off. Closed in layers. Volar
          splint applied.

          DISPOSITION
          Discharged same day. Follow-up in 10 days for suture removal. Physical therapy to
          begin at approximately 4 weeks. No lifting with the left upper extremity.
          Amara Okonkwo, MD
      - kind: note
        title: Surgical Consent
        date: '2026-01-21'
        scan: true
        body: |
          Procedure: open reduction and internal fixation, left distal radius.
          Risks explained, including infection, nerve injury, stiffness and hardware removal.
          ~Robert Chen
