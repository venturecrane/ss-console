# ---- BUSINESS HOURS ----
# Sets the seat's IANA timezone. bootstrap.sh exports it as HERMES_TIMEZONE, so
# Hermes' clock AND this seat's cron schedules run in this timezone (DST-correct
# via ZoneInfo). Unauthored = UTC (the container clock). Hours/days are the
# firm's working window for future business-hours-aware behavior; the timezone
# is the load-bearing field today.
business_hours:
  timezone: America/Los_Angeles
  days: [mon, tue, wed, thu, fri]
  start: '08:00'
  end: '18:00'

# Reply-channel send policy (ss#2070). The Operator has to be usable the way a
# person uses Claude on the web: someone at the firm emails it, gets an answer,
# replies, gets another — for as long as the conversation lasts. The platform
# default (3 replies per sender per 10 minutes, hardcoded until #2070) cut that
# off at the fourth exchange and never resumed, which is exactly what the
# 2026-07-30 burst rehearsal caught.
#
# So a rostered colleague is exempt from the per-sender window, and the bound
# that remains is the reply backstop: 60 replies per hour across the whole
# channel. No real conversation approaches that; a stuck loop hits it inside an
# hour instead of mailing a client all day. Senders who are NOT on the roster
# keep the tight default caps unchanged.
send_policy:
  reply:
    internal_exempt: true
    per_sender_max: 3 # non-roster senders: platform default, unchanged
    per_sender_window_seconds: 600
    global_max: 20 # non-roster aggregate: platform default, unchanged
    global_window_seconds: 3600
    backstop_max: 60 # the runaway bound, all classes
    backstop_window_seconds: 3600
  held_release:
    enabled: true
    ttl_seconds: 86400

escalation:
  red_flag_recipients:
    - scott@smd.services
  failure_recipients:
    - scott@smd.services
  # Deadline-miss-escalator re-fire policy (WP-A). These are PACK-DEFAULT
  # rehearsal values, not client commitments: refire_days is legitimate
  # pack-authored content (a repetitive deadline watcher beats a silent one),
  # and ack_snooze_days keeps an acked-but-unresolved deadline from going
  # permanently dark. read live from this file by the escalator's pre_run
  # (SMD_CUSTOMER_YAML_PATH); absent => the same pack defaults.
  refire_days: 3 # re-fire an unacked, still-open deadline only this many days after the last raise
  ack_snooze_days: 7 # an acked-but-unresolved deadline re-surfaces this many days after the ack
  # Rehearses A&P's per-matter routing posture (#2004, correspondence 09): case
  # alerts resolve to the matter's assigned staff in the staging tenant. The
  # authored fallback keeps the fallback leg exercisable in rehearsal (L2 can
  # drive an unstaffed matter through resolution failure to a real delivery);
  # the client seat deliberately authors NO fallback until the firm names one.
  # Algorithm: operator/skills/deadline-miss-escalator/references/case-alert-routing.md
  case_alert_routing:
    mode: matter_staff
    fallback_recipients:
