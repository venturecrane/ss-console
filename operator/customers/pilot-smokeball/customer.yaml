schema_version: 1

# pilot-smokeball: SMD's DEMO seat (ADR 0107 purpose demo; seat.yaml beside
# this file). The real Operator, working for a FICTIONAL firm, Brannock &
# Ferreira LLP, on fictional matters in SMD's own Smokeball staging tenant. A
# sales representative emails it in front of a prospect and every reply comes
# from the product itself. Nothing here is a client's: no client name, no client
# setting, no client correspondence (Law 15). It gates no release (ADR 0107).
#
# Runbook: docs/handbook/demo-seat.md (what it is, how a representative
# enrolls, the demo script by act, what not to show, how the tenant is reseeded,
# and the follow-ups that need an outside act).
#
# Client changes are rehearsed on the client's release twin (ADR 0107), never
# here. The slug and the Fly app keep their name; renaming means a new Fly app
# (the runbook's follow-ups).
#
# Validate:  npx tsx scripts/validate-customer-yaml.ts \
#              operator/customers/pilot-smokeball/customer.yaml

# ---- IDENTITY ----
customer_id: pilot-smokeball
customer_name: 'Brannock & Ferreira LLP (SMD demo, fictional)'

# ---- SEAT DESCRIPTOR ----
# demo: the seat-side twin of seat.yaml's purpose (the seat never reads
# seat.yaml). It is what lets this seat take invite codes (sender_enrollment
# below); the shadow firm may still drive it (operator/rehearsal/scope.py), never
# during a scheduled demo. tests/demo-seat.test.ts pins the two declarations
# together.
seat:
  kind: demo
  product: operator

# ---- OUTPUT CLASSES (ADR 0083) ----
# The fictional firm's approved voice is one artifact, the Delta Card at
# seed/voice/spec/work_product.voice.md, derived from the firm's own thirteen
# documents with zero sentences copied (seed/voice/README.md). It is the firm's
# voice for its own documents (work_product) AND for its letters to people
# outside the firm (outbound_external), which is where a demo shows it live: a
# representative asks for a letter to opposing counsel or an adjuster, and the
# Operator keeps it as a draft for a person to send, in the firm's voice.
#
# The spec reaches the seat through its vault object, never this file:
#   operator/bin/publish-output-class-spec.py --slug pilot-smokeball \
#     --class <work_product|outbound_external> --property voice \
#     --body operator/customers/pilot-smokeball/seed/voice/spec/work_product.voice.md
# (an R2 write, so an outside act; the runbook lists it). Until it lands the
# seat raises spec_control_broken for each class, which is the honest state.
#
# staff is `none`: replies to the firm's own people (the representative)
# are in the persona's authored register below, which is the authored choice.
# `format_spec: none` everywhere: no drafting lane runs on this seat.
output_classes:
  staff:
    voice_spec: none
    format_spec: none
  work_product:
    voice_spec: expected
    format_spec: none
  outbound_external:
    voice_spec: expected
    format_spec: none

vertical: law-firm
addons:
  - law-firm/pi@0.3.0 # the CA PI-litigation pack; only the skills bound below are on
practice_areas:
  - personal-injury-plaintiff
fly_region: lax # the fictional firm is in California

# ---- RUNTIME ----
# The production default (ADR 0049): Sonnet for the conversation, Opus for the
# one heavy skill bound here (matter-document-review), the same pair a paying
# law seat runs, so a prospect sees the product as a firm gets it.
model: claude-sonnet-5-5
escalation_model: claude-opus-5-5

# One gateway and no job lanes (no skill below queues a job). 2048 MB is this
# seat's floor, not a preference: the 2026-09-01 crash loop ran here at 1024
# (docs/runbooks/operator/incidents/2026-09-01-gateway-startup-watchdog-collision.md).
# Kept at the running Machine's size: the boot harness's large-store case is
# rendered from the demo seat at exactly this guest (operator/bin/lib/
# boot_harness/cli.py SIZES "4x-8192"), and a smaller seat is a reprovision.
machine:
  size: shared-cpu-4x
  memory_mb: 8192

# ---- HUMANS WITH PORTAL ACCESS ----
users:
  - email: scott@smd.services
    role: principal
    full_name: Scott Durgan

# ---- PERSONAS ----
# One coordinator persona working for the fictional firm. The register below is
# authored for Brannock & Ferreira from its approved voice (the Delta Card):
# written fresh here, never a client's.
personas:
  - slug: operator
    status: active
    name: Operator
    title: Case Coordinator, Brannock & Ferreira LLP
    tone:
      - 'Open with the fact or the answer: the matter, the date, the status. Never open with a greeting, a preamble or a restatement of the question.'
      - 'Plain sentences, no em dashes, no semicolons, no exclamation points, no contractions. Numbers and dates exactly as the file has them.'
      - 'When the file does not say, say so and stop. Never fill a gap from inference, and never speculate about law, merits, strategy or value.'
      - 'Name who does what next. A thing you will not do on your own (a send outside the firm, anything an attorney decides) is said plainly, with what you did instead.'
    entitlements:
      exposure:
        # A firm's default posture (the pi-law-firm preset): writes into the
        # matter system execute and are recorded as draft-class in the audit
        # record. Nothing here needs autonomous: the email reply path's own
        # create_draft and invite_code_issue both run under draft_for_review
        # (hermes-smd-trust enforce.py, INTERNAL_WRITE at draft_for_review is
        # allowed and executes).
        internal_write: draft_for_review
        # Replies to the firm's own people: SMD's administrators and the
        # representatives who enrolled with a code (sender_enrollment below).
        external_send_internal: autonomous
        # Anyone else (opposing counsel, an adjuster, a court): the Operator
        # never sends. It keeps the letter as a draft for a person. This is the
        # demo's refusal-to-send act, live.
        external_send: draft_for_review
        # external_send_client, external_send_vendor, destructive, commitment
        # and code_execution are unauthored, so refused (ADR 0035): the
        # fictional firm has no listed clients or vendors, and a demo never
        # deletes, commits or runs code.
      exposure_ceiling:
        external_send: draft_for_review
    skills:
      # Every email lands here and is handed to the skill it asks for.
      - name: matter-inbox-router
        version: pending
        initiation:
          manual: true
          scheduled: false
          webhook: true
        enabled: true
      # Demo act: "introduce yourself and tell me what you can see".
      - name: operator-introduce
        version: pending
        initiation:
          manual: true
          scheduled: false
          webhook: false
        enabled: true
      # Demo act: the employee manual ("how do we work together?"), read from
      # this seat's own facts: what it does on its own and what it brings to a
      # person first. On request only; the daily help review is not run here.
      - name: operator-help
        version: pending
        initiation:
          manual: true
          scheduled: false
          webhook: false
        enabled: true
      # Keeps the Smokeball refresh token alive and pages SMD the hour it dies.
      # Turn-free (the pre_run decides; no model call), so it costs nothing.
      - name: connector-auth-check
        version: pending
        initiation:
          manual: true
          scheduled: true
          webhook: false
        enabled: true
      # Demo act: "where are we on 2026-PI-102?"
      - name: matter-status-responder
        version: pending
        initiation:
          manual: true
          scheduled: false
          webhook: false
        enabled: true
      - name: matter-status-digest
        version: pending
        initiation:
          manual: true
          scheduled: false
          webhook: false
        enabled: true
      # Demo act: what is due on a matter, read from the matter's own dates.
      - name: deadline-and-sol-tracker
        version: pending
        initiation:
          manual: true
          scheduled: false
          webhook: false
        enabled: true
      # Demo act: read a document in the matter and surface what is in it,
      # cited. Surface only, never drafts. Heavy (escalates to Opus), so the
      # runbook points it at one short document, never a whole record set.
      - name: matter-document-review
        version: pending
        initiation:
          manual: true
          scheduled: false
          webhook: false
        enabled: true
      # Demo act: the refusal to send. A letter to opposing counsel is drafted
      # in the firm's voice and kept for a person to send (external_send above).
      - name: meet-and-confer-drafter
        version: pending
        initiation:
          manual: true
          scheduled: false
          webhook: false
        enabled: true
    # The one schedule on this seat, and it calls no model.
    cron:
      - skill: connector-auth-check
        schedule: '13 * * * *' # hourly at :13 seat-local
        pre_run: pre_run.py
        wake_policy: pre_run_decides
    # The Operator's inbox is AgentMail; the native mail skills stay off.
    skills_disabled:
      - google-workspace
      - himalaya

# ---- MCP CONNECTOR (Operator <-> Claude) ----
# Console-sole door (ADR 0057). SMD's administrator only; representatives use
# email.
mcp_connector:
  enabled: true
  data_posture: open
  access:
    - email: scott@smd.services
      profile: operator
      clerk_subjects:
        - user_3EEs0aMBRgu6PRxBa4g5YhHjggD
        - user_3E1RPGrTMxkSqciXMTyybUNSJWu

# ---- CONNECTORS ----
connectors:
  # SMD's own Smokeball STAGING tenant, which holds only the fictional firm's
  # matters (seeded by operator/bin/seed-staging-matter.py). Firm-delegated
  # authorization_code app (ADR 0053); the refresh token lives on the seat
  # volume and is kept alive by connector-auth-check above.
  PracticeManagement:
    adapter: smokeball
    backend: mcp:smokeball
    enabled: true
    environment: staging
    auth_mode: authorization_code
    token_ref: 'infisical:/operator/pilot-smokeball/practice-management/smokeball-oauth'
    # Kept so Smokeball deliveries still verify at the gate. No trigger below
    # subscribes to a Smokeball event: a matter change wakes nothing here (the
    # reconciler registers nothing with no event types, and never deletes).
    webhook_url: 'https://hermes-pilot-smokeball.fly.dev/webhooks/smokeball'

  # The Operator's own inbox. AgentMail for now; a mailbox in an M365 lab
  # tenant is a follow-up (the runbook), because creating that user is an
  # outside act. AGENTMAIL_API_KEY is a Fly secret.
  Email:
    adapter: agentmail
    backend: mcp:agentmail
    enabled: true
    webhook_url: 'https://hermes-pilot-smokeball.fly.dev/webhooks/agentmail'

# ---- WEBHOOK TRIGGERS ----
webhook_triggers:
  - source: agentmail
    event_type: message.received
    skill: matter-inbox-router
    persona: operator

# ---- SCOPE ----
scope:
  email_folders_visible:
    - Inbox
    - Sent
  email_folders_blind: []
  email_keyword_blocks: []
  domain_blocks: []
  # Who the seat answers: SMD's administrators, written here, plus every
  # representative who enrolled with an invite code (sender_enrollment below;
  # the broker's store on the volume, never this file). A prospect is never
  # listed: the demo is driven by the representative, and a prospect's own
  # email gets no reply.
  inbound_allow_from:
    - scott@smd.services
  admins:
    - scott@smd.services
  # A request for a firm-level rule from someone who is not an administrator
  # is passed to SMD.
  rule_requests_to:
    - scott@smd.services
  # Whose reply answers an [ops XXXX] request (a routine, a schedule, an
  # on/off): SMD's. Grants nothing else; none of these is inbound trust beyond
  # scott@ above.
  ops_reply_from:
    - scott@smd.services
    - team@smd.services
    - smdurgan@smdurgan.com
  # SMD's operations desk, so an operations request can be passed on rather
  # than held. Outbound classification only, never inbound trust.
  outbound_roster:
    - address: scott@smd.services
      class: firm_staff
      note: 'SMD operations desk (cards are addressed here); outbound classification only, never inbound trust'
    - address: team@smd.services
      class: firm_staff
      note: 'SMD operations desk; outbound classification only, never inbound trust'

# ---- INVITE-CODE ENROLLMENT (ADR 0106, amended 2026-11-10 for demo seats) ----
# A representative SMD invited emails this seat with the code; the seat checks
# it in code before any model sees the message, answers them from then on like
# a listed person (never an administrator), sends a fixed welcome and tells
# SMD. An administrator gets a code by emailing "I need a code for <name>".
sender_enrollment:
  enabled: true

# ---- BUSINESS HOURS ----
business_hours:
  timezone: America/Los_Angeles
  days: [mon, tue, wed, thu, fri]
  start: '08:00'
  end: '18:00'

# ---- SEND POLICY ----
# A representative sends several requests in a row in a demo: rostered senders
# are exempt from the per-sender window; the backstop bounds a runaway.
send_policy:
  reply:
    internal_exempt: true
    per_sender_max: 3
    per_sender_window_seconds: 600
    global_max: 20
    global_window_seconds: 3600
    backstop_max: 60
    backstop_window_seconds: 3600
  held_release:
    enabled: true
    ttl_seconds: 86400

escalation:
  red_flag_recipients:
    - scott@smd.services
  failure_recipients:
    - team@smd.services

# ---- SAFETY ----
# On SMD's key: the runaway guard, the same caps as smd-guide.
safety:
  sticky_stop:
    cost_cap_daily_cents: 1000
    inbound_daily_cap: 100

# ---- MEMORY (isolation invariants; must match customer_id) ----
# Native memory is off: several representatives share this seat, and one
# prospect's meeting must not surface in another's. A preference a
# representative gives ("lead with open items when you answer me") is kept
# per person by the learned-preference lane (hermes-smd-peer-memory), which is
# the demo's preference act.
memory:
  d1_namespace: pilot-smokeball
  r2_vault_path: 'vaults/pilot-smokeball/'
  vectorize_index: 'hermes-pilot-smokeball-vault'
  memory_enabled: false
  user_profile_enabled: false
