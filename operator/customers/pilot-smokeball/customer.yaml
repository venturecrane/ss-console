schema_version: 1

# pilot-smokeball — the Smokeball STAGING build instance for the law-firm Operator
# (the Ashton & Price pilot prep). This is bound to OUR OWN Smokeball staging
# tenant (Partner-Program credentials), NOT a real client's production data. At
# go-live the real firm gets its own slug bound to its firm-sponsored prod app.
#
# Validate:  npx tsx scripts/validate-customer-yaml.ts \
#              operator/customers/pilot-smokeball/customer.yaml
#
# GATES (Track 0 / Captain): the mcp:smokeball connector is net-new (overlay) and
# its token_ref below is seeded once SMD's Smokeball staging credential lands.
# The persona name/voice are a PROPOSED default — the firm authors the final
# identity and writing voice (ADR 0035, no imposed defaults).

# ---- IDENTITY ----
customer_id: pilot-smokeball
customer_name: 'Pilot Law (Smokeball Staging)'

# ---- SEAT DESCRIPTOR ----
# What this seat IS. Kind and product only; lifecycle state is DERIVED from
# probes of the running system and is deliberately absent here — a state field
# is a claim an agent can write, and a claim an agent can write is one that rots.
# OUR OWN Smokeball staging tenant, fictional matters. The seat A&P work rehearses on.
seat:
  kind: proving
  product: operator

# ---- OUTPUT CLASSES (ADR 0083) ----
# Which classes expect an authored spec. The specs themselves live in this
# customer's vault object, never here (sections-output-classes.ts explains the
# split); what is declared here is the commitment-shaped bit, and it is what
# separates `the customer chose not to author` from `a control is broken`.
#
# TWO CLASSES, DELIBERATELY, so a failed observation names its own half.
#
#   staff       — persona provenance. Needs no corpus, so it is authorable on
#                 day one, and it is the same shape already proven on
#                 smd-staging. If the chain is broken, this breaks too, and the
#                 fault is delivery rather than distillation.
#   work_product — firm provenance, and the actual target. This is the SAFEST
#                 possible first firm-voice declaration: the class is
#                 `external_send: forbidden` (operator/contracts/
#                 output-classes.yaml), so declaring `expected` before a spec
#                 exists cannot downgrade any autonomous send. There is no send
#                 to downgrade. Every other firm-voice class is outbound, where
#                 the same declaration would freeze real traffic.
#
# `format_spec: none` on both is an authored choice, not an omission — the
# drafting lane's skeletons and the ten mechanical gates already own the shape
# of work product, and restating it here would create a second authority over
# one behaviour.
#
# ORDERING CONSEQUENCE — RESOLVED 2026-08-11 (#2234), and the history matters
# because this block has now been wrong in both directions.
#
# #2094 declared `staff: expected` on the reasoning that the declaration and the
# spec would "land close together". The spec never landed, and because a
# declared-but-uninstalled spec refused every autonomous send, the seat stopped
# emailing the Captain for a week (08-04 → 08-10) with no alert — the refusal
# told the model to read a spec that did not exist (#2228). #2229 set this to
# `none` as a stopgap: correct as first aid, wrong as an end state, since it
# also deleted the only seat exhibiting the state the fix needed to prove.
#
# ss#2234 removed the reason for both. A declared-but-uninstalled spec is still
# a BROKEN CONTROL and still recorded as one, but what it COSTS now depends on
# who is waiting: `staff` PROCEEDS in the persona's own authored register (ADR
# 0083's own "fails closed to the persona's own authored judgment"), outbound
# routes to a human, and `work_product`/`record` still refuse. The seat raises
# `spec_control_broken:staff.voice` on the heartbeat so the gap is visible
# rather than silent.
#
# So `expected` is correct here again, and it is now SAFE: internal mail flows,
# the alert stays open, and it resolves the moment a staff voice spec is
# installed. That standing alert is the honest state of this seat — it declares
# a control it does not have — and a proving seat is exactly where that should
# be visible rather than papered over.
#
# `work_product` carries no such window. It is `external_send: forbidden`, so
# there is no send for a missing spec to downgrade.
output_classes:
  staff:
    voice_spec: expected
    format_spec: none
  work_product:
    voice_spec: expected
    format_spec: none

vertical: law-firm
addons:
  - law-firm/pi@0.3.0 # the CA PI-litigation lifecycle pack (19 routine skills + the 4-skill work-product drafting lane, v0.3.0 2026-07-28)
practice_areas:
  - personal-injury-plaintiff
fly_region: lax # Pacific — the pilot firm is California-based

# ---- RUNTIME ----
# Light main, escalate up (ADR 0049): Sonnet runs the high-frequency volume —
# conversation, inbox triage, simple replies — cheaply; genuinely heavy work
# (matter-document-review et al., pre-weighted) escalates to Opus via the SOUL
# instruction that translate.py renders when escalation_model is set.
model: claude-sonnet-4-6
escalation_model: claude-opus-4-8
# Pin to the CURRENT overlay/hermes ref at provision time (matches OVERLAY_REF).
# Hermes v0.18.0 → v0.20.4 promotion (Step 2, real-connector proving seat before
# A&P, ss#2444). Rollback pin: v2026.7.1@7c1a029553d87c43ecff8a3821336bc95872213b.
# See docs/runbooks/operator/hermes-v0.20-upgrade-plan.md.
hermes_ref: v2026.8.18@e624e9fde561e1add9388384012b295fde669ade

machine:
  size: shared-cpu-1x
  # 2048 is this seat's FLOOR, not a preference. The 2026-09-01 crash loop
  # (00:12-02:45 UTC) ran here: at 1024 the gateway's startup crawl -- the
  # synchronous platform-plugin imports inside gateway/channel_directory.py's
  # build_channel_directory, which runs as the event loop's first task -- took
  # roughly four minutes, while hermes' own in-process loop watchdog
  # (gateway/shutdown_watchdog.py start_loop_liveness_watchdog, armed at
  # gateway/run.py:12186 BEFORE that crawl) hard-exits 75 after three missed
  # probes, a budget of about two minutes. The loop wedged on its own startup:
  # exit 75, container restart, colder caches, slower startup, repeat every
  # ~15 minutes. oom_killed was false throughout, so memory pressure is not the
  # proximate cause -- the extra GB buys page cache and import headroom that
  # pulls startup back under the watchdog budget. `fly scale memory 2048` broke
  # the loop instantly (beat age 3s, stable since).
  #
  # The live Machine was scaled to 2048 by hand during the incident. This line
  # is what a reprovision reads, so leaving it at 1024 would silently shrink the
  # seat back into the loop. Do not lower it without either raising hermes'
  # watchdog budget (not configurable at this pin -- see
  # docs/runbooks/operator/incidents/2026-09-01-gateway-startup-watchdog-collision.md) or
  # making the platform-plugin import lazy.
  memory_mb: 2048

# ---- HUMANS WITH PORTAL ACCESS ----
users:
  - email: scott@smd.services
    role: principal
    full_name: Scott Durgan
  # Staging-only admin probe identity (ss#2222 gate 3 / card R2) — authored as
  # a user because scope.admins must be a subset of users[] (commitments gate
  # j); it holds no portal seat in practice. Never copy to a client seat.
  - email: ss-probe-admin@agentmail.to
    role: staff
    full_name: SS Probe Admin (staging rehearsal)

# ---- PERSONAS ----
# One coordinator persona. Name/title/voice are a PROPOSED default — the firm
# authors the final identity and tunes the writing voice from real samples.
# Outside sends follow the authored external_send ceiling below (ADR 0035/0073;
# the former non-raisable law draft floor is removed). The two committed
# deliverables — matter-memo-on-update (internal supervision memo) and
# matter-document-review (surface-only, never drafts) — write only internally.
personas:
  - slug: operator
    status: active
    # Neutral display identity (Captain call 2026-07-02): SMD proposes no
    # persona name. The firm authors a name at onboarding if it wants one at
    # all (ADR 0035, no imposed defaults). The slug is internal plumbing only.
    name: Operator
    title: AI Case Coordinator
    # AUTHORED REGISTER (ADR 0083), carried from the client seat so rehearsals
    # exercise the real persona rather than a placeholder — the same
    # fixtures -> pilot-smokeball -> ashton-price order every other authored
    # value follows. Full spec: ashton-price/persona-operator.md. Only this
    # list reaches the seat today (overlay translate.py::_soul_body renders it
    # under "## Tone"). Keep BYTE-IDENTICAL to the client seat's list: a
    # rehearsal against a different register proves nothing about the seat it
    # is rehearsing for.
    tone:
      - 'Lead with the fact. Name the matter and the event in the first sentence. Never open with a pleasantry, a preamble, or "I hope this finds you well."'
      - 'Say what you need, specifically. A closed question with a real answer ("Confirm August 28, or tell me the date you want"), never "please advise." One message, one purpose.'
      - 'When unsure, do not guess and do not proceed: state what you found, what you need, and stop. A refusal is a normal outcome, never an apology. Bad news, including your own error, goes in the first sentence.'
      - 'Numbers and dates bare, no hedging wrapped around them. No filler, no flattery, no announcing your own diligence. Never speculate about law, merits, strategy, or valuation. No em dashes.'
      - "Use the firm's own words (matter, served, propounded, verification, lien), never software vocabulary. You are a case manager working every open file: you carry the work, the attorneys decide it, and you never confuse the two."
    entitlements:
      exposure:
        internal_write: autonomous
        # ADR 0073 proved (merged #1843, live on this seat) that an authored
        # autonomous outside send actually SENDS in the gateway. That proof is
        # intentionally SUPERSEDED here by the Ashton & Price day-one grid posture
        # (the 2026-07-09 commitment letter): every send starts at draft_for_review.
        # Git history is the record of the autonomous proof; the letter grid
        # (routine-grid.yaml) is the authority now. The content-sensitivity floor
        # (ADR 0031) and taint gate still narrow further.
        #   external_send          -> outside recipients (opposing counsel, court):
        #                             the letter's permanent "a person sends it" cap.
        #   external_send_client   -> the firm's own rostered client (verification
        #                             chase): graduatable to autonomous by the firm.
        #   external_send_vendor   -> the firm's own rostered records vendor (records
        #                             chase): graduatable to autonomous by the firm.
        # The two typed classes resolve via scope.outbound_roster below (ADR 0075).
        external_send: draft_for_review
        external_send_internal: autonomous
        external_send_client: draft_for_review # day-one grid posture (graduation proven config-correct; see ADR 0075 + the send-delivery follow-on)
        external_send_vendor: draft_for_review # day-one grid posture
        destructive: autonomous
        # The Operator's own internal matter (ss-console#2536), rehearsing the
        # A&P posture: an admin-confirmed act proposal is the only path, never
        # autonomous. No exposure_ceiling entry, so the entitlement dial cannot
        # raise it.
        commitment: confirm
        # Captain-authorized 2026-08-21: an admin-confirmed act proposal is the only path, never autonomous. Requires overlay >= b782926c (validator accepts confirm on commitment).
      # Letter-commitment bounds for the runtime entitlement dial (ss#2003
      # Q7), mirroring the A&P seat (this seat rehearses that grid). Derived
      # from routine-grid.yaml ceiling_tier per send class; the Machine clamps
      # every portal-set override to these.
      exposure_ceiling:
        external_send: draft_for_review
        external_send_client: autonomous
        external_send_vendor: autonomous
        # code_execution stays UNAUTHORED (= refused) on this seat, and the
        # custody guard (#1841, ADR 0044 Decision 8) enforces it: gateway-held
        # credential surfaces exist (agentmail/brave/smokeball), executed code
        # could read them from the env, and smokeball is a client-data
        # connector — never custody-exception eligible. Consequence: the
        # ADR 0021 Stream-A execute_code fetch skills are inert here by
        # posture; their revival is #1917 (broker-mediated fetch or connector
        # custody move), NOT this dial. Ledger writes stopped needing it in
        # ss #1915 (escalation_append/escalation_state mediated tools).
