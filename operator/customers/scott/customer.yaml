schema_version: 1

# HOSTED AGENT seat: Scott Durgan (founding seat #1, the live dry-run of
# ADR 0067). Authored from the intake row in the admin queue on
# 2026-07-06 per docs/runbooks/hosted-agent/concierge.md; template
# operator/customers/_hosted-template/.
#
# Intake: agent name "Agent Crane"; use cases "chief of staff — email,
# calendar, daily routine"; timezone MST; allowed sender
# smdurgan@icloud.com; spend limit confirmed. Anthropic key staged at
# Infisical /ss/hosted/scott (the CUSTOMER'S key, never an SMD org key).
#
# ADR 0067 hard rules honored: inbound allowlist non-empty and exact
# addresses only; external_send stays draft_for_review.

# ---- IDENTITY ----
customer_id: 'scott'
customer_name: 'Scott Durgan'

# ---- SEAT DESCRIPTOR ----
# What this seat IS. Kind and product only; lifecycle state is DERIVED from
# probes of the running system and is deliberately absent here — a state field
# is a claim an agent can write, and a claim an agent can write is one that rots.
# Hosted Agent founding seat.
seat:
  kind: internal
  product: hosted-agent

vertical: mixed
addons: []
practice_areas:
  - general
fly_region: lax # Phoenix-adjacent; Fly retired phx (fleet standard, same as customer-zero)

# ---- RUNTIME ----
# Cheap main model on the customer's own key; no escalation tier at this
# price point (their key, their spend limit — keep the burn predictable).
model: claude-sonnet-4-6
# Hermes v0.18.0 → v0.20.4 promotion (Step 3, SMD-own Telegram seat, ss#2444).
# Rollback pin: v2026.7.1@7c1a029553d87c43ecff8a3821336bc95872213b.
# See docs/runbooks/operator/hermes-v0.20-upgrade-plan.md.
hermes_ref: v2026.9.14@345cd2b057a452236de401d3534b8502a7465e8d

machine:
  size: shared-cpu-1x
  memory_mb: 1024

# ---- HUMANS WITH PORTAL ACCESS ----
users:
  - email: scott@smd.services
    role: principal
    full_name: Scott Durgan

# ---- PERSONA ----
personas:
  - slug: agent-crane
    status: active
    name: Agent Crane
    title: Assistant
    tone:
      - plainspoken
      - warm-but-professional
      - concise
    entitlements:
      exposure:
        internal_write: autonomous
        external_send: confirm
        # Sends to a ROSTERED address (scope.inbound_allow_from) are their own
        # class. Autonomous here lets the open-house follow-up drafts reach the
        # seat's own principal on a scheduled turn without a Telegram approval
        # round trip; nothing outside the roster is touched by this line (the
        # recipient classifier decides the class at send time). The owner
        # promoting trust on their own seat is ADR 0071 decision 5.
        external_send_internal: autonomous
    skills:
      - name: inbox-triage
        version: pending
        initiation:
          manual: true
          scheduled: true
          webhook: true
        enabled: true
      - name: workspace
        version: pending
        initiation:
          manual: true
          scheduled: false
          webhook: false
        enabled: true
      - name: status-report-assembler
        version: pending
        initiation:
          manual: true
          scheduled: true
          webhook: false
        enabled: true
      # Real estate open-house POC (the Captain plays the agent from the
      # allowlisted address). Woken by the inbound-email trigger below for
      # capture and recall, and by cron for the follow-up drafts.
      - name: open-house-visitor-capture
        version: pending
        initiation:
          manual: true
          scheduled: true
          webhook: true
        enabled: true
    cron:
      # Named day-one job: the morning digest at 7:00 MST (Phoenix has no
      # DST, so 7am is 14:00 UTC year-round).
      - skill: status-report-assembler
        schedule: '0 14 * * *'
        wake_policy: always
      # Open-house follow-up drafts at 8:00 MST (15:00 UTC). `always`: the
      # skill reads a small records directory and exits silently when nothing
      # is due; a pre_run gate would add a second process root for a POC.
      - skill: open-house-visitor-capture
        schedule: '0 15 * * *'
        wake_policy: always

# ---- CONNECTORS ----
connectors:
  Email:
    adapter: agentmail
    backend: 'mcp:agentmail'
    enabled: true
    webhook_url: 'https://hermes-scott.fly.dev/webhooks/agentmail'
    # The seat's OWN inbox. The workspace broker pins every outbound send to
    # this address (operator/workspace_broker/agentmail_auth.py
    # seat_inbox_address) and, absent this line, derives `<slug>@agentmail.to`.
    # This seat's inbox was created as agentcrane@ (the persona name), not
    # scott@, so the derived address is not in the account listing and the
    # broker refuses every send from this seat, fail-closed (proven 2026-09-15:
    # the account lists agentcrane@agentmail.to with the hermes-scott webhook
    # bound to it, and no scott@agentmail.to). Authored, not derived.
    inbox_address: agentcrane@agentmail.to

webhook_triggers:
  # One trigger per (source, event); it names ONE skill. Re-pointed from
  # inbox-triage to the open-house skill for the POC: every inbound email on
  # this seat now lands there, and its SKILL.md carries an "anything else"
  # branch that answers as the assistant would. inbox-triage keeps its
  # scheduled and manual initiation. Reverting is this one line, applied live.
  - source: agentmail
    event_type: message.received
    skill: open-house-visitor-capture
    persona: agent-crane

# ---- SEND POLICY ----
# The reply relay's platform default is 3 replies per sender per 10 minutes.
# The only sender here is the seat's own principal; a capture, a correction,
# and a recall inside ten minutes must not go quiet mid-thread. Same authored
# values as the paid seats (ashton-price): rostered senders exempt, held
# replies auto-release, non-roster bounds unchanged.
send_policy:
  reply:
    internal_exempt: true
    per_sender_max: 3
    per_sender_window_seconds: 600
    global_max: 20
    global_window_seconds: 3600
    backstop_max: 60
    backstop_window_seconds: 3600
  held_release:
    enabled: true
    ttl_seconds: 86400

# ---- SCOPE ----
scope:
  email_folders_visible:
    - Inbox
    - Sent
  email_folders_blind: []
  email_keyword_blocks: []
  domain_blocks: []
  # ADR 0067 channel constraint: the allowlist IS the inbound surface.
  # Exact addresses from the intake row; no domain wildcards at this tier.
  # smdurgan@smdurgan.com added 2026-09-25 by the seat owner: the open-house
  # POC proofs (#2793) are observed from the Gmail account the agents can
  # read; the iCloud address from intake stays, and nothing else is widened.
  inbound_allow_from:
    - smdurgan@icloud.com
    - smdurgan@smdurgan.com

# ---- ESCALATION ----
escalation:
  red_flag_recipients:
    - scott@smd.services
  failure_recipients:
    - team@smd.services

# ---- SAFETY ----
# The cost breaker guards the CUSTOMER'S key here (their spend limit is
# the real cap; this is the on-Machine backstop). Tighter than the
# platform default on purpose.
safety:
  sticky_stop:
    cost_cap_daily_cents: 1000
    inbound_daily_cap: 100

# ---- TELEGRAM ----
# Per-customer bot (BotFather; see docs/runbooks/hosted-agent/). Token is
# staged as a Fly secret, never here. Allowlist is MANDATORY (fails open
# when empty).
telegram:
  allowed_users:
    - '7367659986'

# ---- VOICE LIBRARY ----
voice_library:
  samples_path: 'r2://vaults/scott/voice/samples/'

# ---- MEMORY (isolation invariants; must match customer_id) ----
memory:
  d1_namespace: scott
  r2_vault_path: 'vaults/scott/'
  vectorize_index: 'hermes-scott-vault'
