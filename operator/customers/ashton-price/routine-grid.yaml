    start_tier: prepare-and-route
    ceiling_tier: prepare-and-route
    start_verbatim: 'Prepare-and-route'
    ceiling_verbatim: 'Prepare-and-route (capped: before a judge)'
    enforcement:
      initiation: 'manual (person-invoked)'
      exposure_keys:
        external_send: draft_for_review
      content_floor: true
      banned_tools: []
      notes: >-
        Capped "before a judge" by STRUCTURE, not by a raisable dial: there is no
        roster class for the court, so anything bound for the court is an un-rostered
        outside recipient governed by external_send at draft_for_review. Never a
        graduation path. The CRC 3.1345 reasons-to-compel cells stay EMPTY for the
        attorney; there is no mode that fills in an argument. It assembles into the
        matter; an attorney finalizes and files. The Operator does not e-file (no
        e-file tool is granted).

