# routine-grid.yaml — the compiled traceability artifact for the Ashton & Price
# routine-settings grid (ADR 0075).
#
# SOURCE OF TRUTH: operator/customers/ashton-price/correspondence/
#   07_2026-07-09_scott-to-christa_responses-and-routine-matrix.md
# Every `start_tier`, `ceiling_tier`, and `*_verbatim` value below traces verbatim
# to the grid at the bottom of that letter (the client commitment). This file does
# NOT author new client-facing content; it maps the letter's 19 rows onto the seat's
# skills and records how each tier is actually made real in config + enforcement.
#
# WHY THIS EXISTS: the letter makes a three-tier promise per routine (auto-handle /
# prepare-and-route / flag-only) with named permanent caps (deadline, money, opposing
# counsel, court). A tier is only as real as the composition that enforces it. Each
# row's `enforcement:` block states that composition honestly, including the caveats
# that NARROW the letter — those caveats are the point of the artifact.
#
# TIER VOCABULARY (normalized, closed set): flag-only | prepare-and-route | auto-handle.
#   The letter's "Runs on its own" normalizes to auto-handle (medical chronology);
#   its "Internal record only" cap keeps that auto-handle scoped to internal_write.
#   The letter's "Flag-only / prepare-and-route" dual start (lien ledger) normalizes
#   to its lower bound, flag-only (a judgment call, noted on that row).
#
# SEAT NOTE (ashton-price): this is the same letter-derived matrix maintained and
# drift-gated on the proving seat (operator/customers/pilot-smokeball/routine-grid.yaml,
# gate: tests/customer-commitments.test.ts), carried onto the client's own seat so the
# portal renders Ashton & Price's operator from Ashton & Price's projection (console
# blueprint 05-console-blueprint.md §7a — a client sees her own seat, never the pilot).
# Each row's `enforcement.exposure_keys` documents the letter's day-one composition AS
# REALIZED ON THE PROVING SEAT. This seat's sibling customer.yaml adopts those values at
# go-live (CLIENT-IMPLEMENTATION-PLAN.md), and the drift gate extends to this seat with
# the go-live rework; until then the pins here are the composition of record from the
# letter, not assertions about this directory's customer.yaml.
#
# CEILING vs LIVE: where a row's ceiling_tier is auto-handle but the day-one exposure is
# draft_for_review (client verification, records chase, new matter setup, response
# inputs staged), the day-one value is the START; the letter authorizes the firm
# to graduate that one class to autonomous. The graduation is a one-line exposure (or
# initiation) change, noted per row. It is never automatic.

adr: '0075'
seat: ashton-price
persona: operator
source_letter: operator/customers/ashton-price/correspondence/07_2026-07-09_scott-to-christa_responses-and-routine-matrix.md

rows:
  # ---------------------------------------------------------------- DISCOVERY
  - routine: 'Served discovery caught'
    letter_section: DISCOVERY
    skills: [discovery-served-watch]
    start_tier: flag-only
    ceiling_tier: flag-only
    start_verbatim: 'Flag-only'
    ceiling_verbatim: 'Flag-only (only surfaces)'
    enforcement:
      initiation: 'manual + webhook (served-discovery notices routed in by the matter-inbox-router spine)'
      exposure_keys:
        internal_write: autonomous
      content_floor: false
      banned_tools: []
      notes: >-
        Flag-only is held by the skill contract: it reads the served-discovery notice
        the spine routes in and writes only an internal surfacing note (internal_write).
        The skill carries no draft or send tool, so there is no path above flag-only.
        This is authored skill discipline within the persona, verified by audit-journal
        observation, not a per-routine gate.

  - routine: 'Response deadlines'
    letter_section: DISCOVERY
    skills: [discovery-response-tracker]
    start_tier: prepare-and-route
    ceiling_tier: prepare-and-route
    start_verbatim: 'Prepare-and-route'
    ceiling_verbatim: 'Prepare-and-route (capped: deadline)'
    enforcement:
      initiation: 'manual + scheduled (weekday deadline sweep)'
      exposure_keys:
        internal_write: autonomous
      content_floor: true
      banned_tools: []
      notes: >-
        Capped at prepare-and-route by the content-sensitivity floor (ADR 0031) plus
        the skill's read-not-compute contract: it reads Smokeball's computed
        court-rules dates and routes them for the attorney to confirm, it does not
        compute or commit a date. Every date is confirmed by the attorney with name +
        timestamp logged on the matter. Where a discovery type or service method is not
        covered cleanly it proposes the date instead. No graduation path above
        prepare-and-route for this row.

  - routine: 'Client verification'
    letter_section: DISCOVERY
    skills: [client-verification-tracker]
    start_tier: prepare-and-route
    ceiling_tier: auto-handle
    start_verbatim: 'Prepare-and-route'
    ceiling_verbatim: 'Auto-handle (once you are comfortable)'
    enforcement:
      initiation: 'manual + scheduled (chase cadence)'
      exposure_keys:
        external_send_client: draft_for_review
      content_floor: false
      banned_tools: []
      notes: >-
        CAVEAT (narrows the letter): the Smokeball e-sign leg is HUMAN-SENT today;
        graduation covers the CHASE EMAILS to the client only (external_send_client).
        Signature detection is via get_files_on_matter matter-metadata reads
        (taint-safe), never by reading document contents. Allowed state reads are
        matter-metadata only (non-fenced); the chase itself is a proactive send_message.
        Day-one ceiling is draft_for_review (the prepare-and-route start); the letter
        authorizes the firm to graduate external_send_client to autonomous
        (auto-handle) at its discretion, a one-line exposure change. This send routes to
        the client class because the client address is authored in scope.outbound_roster.

