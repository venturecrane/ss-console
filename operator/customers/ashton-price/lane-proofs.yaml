# The kinds of job PROVEN on this seat (the lane-proof gate,
# operator/runners/medchron/medchron/lane_proof.py; runbook
# docs/runbooks/operator/lane-proof.md).
#
# A job of a kind listed here runs the moment it is asked for. A job of any
# other kind WAITS (queued, never failed), and SMD is paged at once with the
# request and the lane, until SMD runs it as a proof run on the request's own
# matter (nothing written, nothing emailed), reads what it produced, and
# accepts it on the seat. The in-turn skills listed here are the asks the
# Operator answers inside a turn; those are never held, but an unlisted one
# pages SMD on its first live use.
#
# Seeded 2026-10-13 from the seat's own ledgers (vfy_01M4V168KX39PHM10KG1K7RVV6,
# read-only census of the job tables) and the request cards. Only clean live
# deliveries count. Evidence names job ids, PR numbers and dates, never a
# client, a matter or a file name: this repo is public.
#
# Deliberately NOT here:
#   document-drafter.discovery_set  three sets delivered 10-12/10-13, but the
#       10-12 set carried a false declaration and was withdrawn; the lane was
#       rebuilt by ss#3137 (pre-delivery review, one document per set,
#       pleading paper). The rebuilt lane is proved by a proof run of a real
#       past request (`lane-proof dry-run <finished job>`), then accepted.
#   document-drafter.(discovery_response|memo|depo_outline)  no delivery here
#       at the census.
#
# A census row count is only the rows that existed at its timestamp. A lane
# with no delivered job is "no evidence yet", never "never run": check the
# ledger for an in-flight job before saying more.
#
# Revocations go under `revoked:` and win over every runtime proof until this
# file changes (a runtime `medchron lane-proof revoke` is the faster, undoable
# kind).
