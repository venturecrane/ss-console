      #   4. The drafting-gate delivery hook BUILT, then deployed to this seat.
      #      code_execution is refused here, so the mechanical gate has to run
      #      off the agent's own hands. As of 2026-08-13 that hook DOES NOT
      #      EXIST (ss-console#2258): drafting_gate_check.py is referenced in the
      #      overlay only as a presence probe, and hermes-smd-drafting disclaims
      #      the record checks in its own docstring. This row was written as a
      #      deploy step; it is a BUILD step, and "no draft surfaces ungated" is
      #      the goal of the row rather than a description of today. It holds on
      #      this seat right now only because the lane above is unactivated, so
      #      no draft surfaces here at all.
      #   5. The pilot-smokeball kill-test battery green on the exact skill
      #      versions being promoted.
      # When those are met, the activation is the pilot-smokeball block
      # (customer.yaml there, "work-product drafting lane") copied onto this
      # seat: manual initiation only, never scheduled, never webhook.
    # Every entry is pre_run-gated (ADR 0021 Stream B, #1748). The escalator's
    # bespoke pre_run decides whether a deadline needs the ladder; the other
    # skills carry the shared empty-seat gate (operator/templates/pre_run_gate.py):
    # zero open matters -> SUPPRESSED_WAKE heartbeat, no LLM turn. Any probe or
    # heartbeat failure wakes (fail-open). Schedules stay staggered (never
    # :00/:30) and weekday- or weekly-cadenced — a wake on a hydrated seat
    # bills tokens, so the cadence matches how fast each item actually changes.
    # All times are seat-local (business_hours.timezone -> HERMES_TIMEZONE):
    # authored as Pacific.
    # GO-LIVE POSTURE (Captain directive 2026-08-12): NO scheduled initiation at
    # hand-off. We told the firm that once they connect Smokeball and their mail,
    # nothing runs on a schedule until they ask for it. So the seat comes up with
    # an empty cron list, and a routine is scheduled only when Chris or Christa
    # asks for that routine by name.
    #
    # The authored schedules are PRESERVED AS COMMENTS below, not deleted, so
