# ashton-price — the PRODUCTION Operator for the Ashton & Price law-firm pilot
# (ADR 0053). This is bound to A&P's REAL production Smokeball tenant via the
# firm-delegated authorization_code grant, NOT our own staging tenant. The
# rehearsal rig is the separate `pilot-smokeball` seat (our staging) — do NOT
# conflate them: separate app, tenant, credentials, Fly app, slug.
#
# Validate:  npx tsx scripts/validate-customer-yaml.ts \
#              operator/customers/ashton-price/customer.yaml
#
# SEAT INPUTS RESOLVED 2026-06-24 (Captain-confirmed from A&P directly):
#   - fly_region: sjc — A&P main office is Fair Oaks (Sacramento), CA; San Jose
#     is the nearest Fly US-West region (closer than the pilot's lax).
#   - users: Chris Price (principal/litigator) + Christa Barrera (office manager,
#     the firm's financial/operational spine) authored below with real emails.
#     Scott (SMD) stays as the pilot-period operator (removed/converted at handoff).
#   - mail/calendar platform: M365 / Office 365 (confirmed). Calendar + mail ride
#     Microsoft Graph, NOT Smokeball (no Smokeball calendar API). The M365 backend
#     is not yet runtime-wired (Track E) — added at a later provision, not here.
#
# STILL EXTERNAL before provisioning:
#   - hermes_ref: pin to the OVERLAY_REF carrying the smokeball auth-code change
#     (ss-console + overlay PRs) at provision time.
#   - SMOKEBALL_PROD_* creds + the refresh token land at the connect step; until
#     then the smokeball connector is unwired (boot-before-token), Machine healthy.
#   - Smokeball 72hr app review (submitted 2026-06-24) must clear to unlock the
#     Production callback tab where hermes-ashton-price's callback is registered.

# ---- IDENTITY ----
customer_id: ashton-price
customer_name: 'Ashton & Price LLP'

# ---- SEAT DESCRIPTOR ----
# What this seat IS. Kind and product only; lifecycle state is DERIVED from
# probes of the running system and is deliberately absent here — a state field
# is a claim an agent can write, and a claim an agent can write is one that rots.
# A&P's REAL production Smokeball tenant; a real firm's real matters.
seat:
  kind: customer
  product: operator

# ---- OUTPUT CLASSES (ADR 0083) ----
# Mirrors the proving seat's declaration (pilot-smokeball, fixtures -> pilot ->
# client discipline): the firm's voice is EXPECTED on staff mail and on work
# product, established through the self-initiation / establishment path.
# format_spec: none is an authored choice — the drafting lane's skeletons and
# mechanical gates own work-product shape.
#
# TWO AUTHORED CAVEATS, read before touching this block:
# (a) PRECONDITION: this seat's rebuild pin must carry overlay#2234's
#     proceed-and-alert semantics. Before #2234, `voice_spec: expected` with
#     no installed spec REFUSED every autonomous send — on the pilot that
#     froze internal mail for six days with no alert (#2228). On a pre-#2234
#     pin this block would recreate that outage on a production client seat,
#     case alerts included. Verify the pin at activation with a probe +
#     crane_verify; never assume.
# (b) STANDING ALERT WINDOW: from rebuild until the firm blesses its voice,
#     the seat raises `spec_control_broken:staff.voice` on the heartbeat.
#     That alert is AUTHORED state, not a defect: the seat declares a control
#     it does not yet have, and it resolves the moment voice establishment
#     installs the staff spec. work_product carries no such window (its class
#     is external_send: forbidden — no send exists for a missing spec to
#     downgrade).
output_classes:
  staff:
    voice_spec: expected
    format_spec: none
  work_product:
    voice_spec: expected
    format_spec: none

vertical: law-firm
addons:
  - law-firm/pi@0.3.0 # the CA PI-litigation lifecycle pack (19 routine skills active here; the v0.3.0 drafting lane is NOT activated on this seat — see the fail-closed block at the end of the skills list)
practice_areas:
  - personal-injury-plaintiff
fly_region: sjc # Fair Oaks (Sacramento), CA — San Jose is the nearest Fly region

# ---- RUNTIME ----
# Light main, escalate up (ADR 0049): Sonnet runs the high-frequency volume —
# conversation, inbox triage, simple replies — cheaply; genuinely heavy work
# (matter-document-review et al., pre-weighted) escalates to Opus via the SOUL
# instruction translate.py renders when escalation_model is set.
model: claude-sonnet-4-6
escalation_model: claude-opus-4-8
# Promoted to the blessed v0.20 line 2026-08-20 (ss#2444 PR-2, Captain go). The
# four SMD-own seats moved on PR-1 (#2453) and this seat, the paying client,
# moves last and alone — the staged order the upgrade plan exists to enforce
# (docs/runbooks/operator/hermes-v0.20-upgrade-plan.md). The prior CONFIRM note
# here asked for an OVERLAY_REF carrying the smokeball authorization_code +
# per-seat-env change; that condition was met long before this bump and the note
# outlived it.
#
# Two properties of THIS seat that pilot could not prove, both first exercised
# by this promotion: `msgraph-send-credential-stripped-from-agent` asserts
# something real here for the first time (it passed vacuously on all four
# SMD-own seats, none of which author msgraph), and the msgraph delta POLLER
# has never run on v0.20 anywhere — pilot is inbound-by-webhook, this seat is
# inbound-by-poll. Cursor resume is proven by delta-state.json's post-boot mtime
# plus zero duplicate inbound rows, not by boot-smoke.
hermes_ref: v2026.8.18@e624e9fde561e1add9388384012b295fde669ade

# ss#2612 / ADR 0087: the chronology-package runner runs on this Machine beside
# the gateway. Memory is the binding constraint (vision and billing render
# whole documents to base64; exhibit assembly holds a provider production;
# the 1 GB seat went health-critical under two 40 MB downloads, ss#2465), so
# 4 GB with one job at a time; two shared vCPUs set wall clock, not cost.
machine:
  size: shared-cpu-2x
  memory_mb: 4096

# ---- HUMANS WITH PORTAL ACCESS ----
# A&P's two principals-of-use plus the SMD operator for the pilot period.
# Chris = the firm principal/decision-maker; Christa = office manager (the
# financial/operational spine — trust/IOLTA, AP/AR, file org). Scott is the SMD
# operator running the pilot hands-on; his entry is removed or converted to a
# support role at handoff.
users:
  - email: chris@ashtonandprice.com
    role: principal
    full_name: Chris Price
  - email: christa@ashtonandprice.com
    role: staff
    full_name: Christa Barrera
  - email: scott@smd.services
    role: principal
    full_name: Scott Durgan

# ---- AUTHORITY (ADR 0041/0042 domain switches) ----
# The diligence reply (10, Q6/Q7) commits the pause control and entitlement
# visibility to the firm's named admins "without us." The runtime switch is
# therefore CLIENT-held: the portal pause/resume control (#2003) is operable
# by the firm's principal-role users. Every other domain stays managed for
# the pilot; entitlement-setting changes (Q7's second half) flip `trust` to
# client when that control ships. No imposed defaults — this is authored.
authority:
  default: managed
  overrides:
    runtime: client
    # The entitlement dial (ss#2003 Q7, letter 10; agreement §2.4-2.5): Named
    # Administrators change routine autonomy levels directly in the portal,
    # within the grid ceilings. Captain ruling 2026-07-28 — runtime posture,
    # effective on completion of the portal action.
    trust: client

# ---- PERSONAS ----
# One coordinator persona — the law spine + the two committed deliverables
# (matter-memo-on-update, matter-document-review). Entitlements are the FIRM's to
# specify (see ENTITLEMENTS.md); the ceilings here are PROPOSED defaults we
# recommend at onboarding, NOT floors (ADR 0005's "external-send floor" is retired;
# ADR 0035 = no imposed defaults). The only non-configurable controls are the
# integrity ones (irreversibility adapter ban + taint-gate), never these ceilings.
# Name/voice are likewise a PROPOSED default; the firm authors the final identity.
personas:
  - slug: operator
    status: active
    # Neutral display identity (Captain call 2026-07-02): SMD proposes no
    # persona name. The firm authors a name at onboarding if it wants one at
    # all (ADR 0035, no imposed defaults). The slug is internal plumbing only.
    name: Operator
    title: AI Case Coordinator
    # AUTHORED REGISTER (ADR 0083). Full spec: persona-operator.md in this
    # directory — a DRAFT PROPOSAL the firm reacts to, not an imposed identity.
    # Only this list reaches the seat today (overlay translate.py::_soul_body
    # renders it under "## Tone"), so it carries the register rules that change
    # the most output, not the worked examples. The prior value was three
    # generic adjectives copied from the proving seat; it described no firm,
    # no vertical, and no role.
    tone:
      - 'Lead with the fact. Name the matter and the event in the first sentence. Never open with a pleasantry, a preamble, or "I hope this finds you well."'
      - 'Say what you need, specifically. A closed question with a real answer ("Confirm August 28, or tell me the date you want"), never "please advise." One message, one purpose.'
      - 'When unsure, do not guess and do not proceed: state what you found, what you need, and stop. A refusal is a normal outcome, never an apology. Bad news, including your own error, goes in the first sentence.'
      - 'Numbers and dates bare, no hedging wrapped around them. No filler, no flattery, no announcing your own diligence. Never speculate about law, merits, strategy, or valuation. No em dashes.'
      - "Use the firm's own words (matter, served, propounded, verification, lien), never software vocabulary. You are a case manager working every open file: you carry the work, the attorneys decide it, and you never confuse the two."
    entitlements:
      exposure:
        internal_write: draft_for_review
        external_send: draft_for_review
        # Internal alert delivery to firm staff (#2004, correspondence 09/10):
        # case-level alerts route per matter to the assigned attorney/paralegal
        # "the same way work reaches them today" — an alert that waits for SMD
        # approval is not an alert. Recipients classify INTERNAL only through
        # the authored @ashtonandprice.com roster grant (ADR 0072); this key
        # authorizes nothing outside it. Client- and tribunal-bound mail stays
        # governed by external_send above. Pinned by customer-commitments (g).
        external_send_internal: autonomous
        # Recipient-class exposures the routine grid says enforce the letter's
        # prepare-and-route tiers (letter 07: client verification, records
        # chase). resolve_ceiling does NO fallback from a recipient class to
        # the base external_send — unauthored is REFUSED (ADR 0056), so
        # without these two keys the firm's #1 named routine (verification
        # chase) and the records chase would refuse instead of drafting.
        # Found by the #2003 compiler build; the A&P grid had no traceability
        # gate (the commitments suite pointed only at pilot-smokeball) — gate
        # (h) now covers it.
        external_send_client: draft_for_review
        external_send_vendor: draft_for_review
        # The Operator's own internal matter, and nothing else this class can
        # reach (mcp_smokeball_create_matter is the only COMMITMENT tool on the
        # Smokeball surface). Captain-authorized 2026-08-21: an admin-confirmed
        # act proposal is the only path; never autonomous. The Operator states
        # the exact matter back to a Named Administrator, the administrator
        # answers in their own words, and only then does the act happen. There
        # is deliberately no exposure_ceiling entry for this class, so the
        # runtime entitlement dial cannot raise it at all.
        commitment: confirm
        # Captain-authorized 2026-08-21: an admin-confirmed act proposal is the only path, never autonomous. Requires overlay >= b782926c (validator accepts confirm on commitment).
      # Letter-commitment bounds for the runtime entitlement dial (ss#2003
      # Q7). Derived from routine-grid.yaml ceiling_tier per send class
      # (auto-handle -> autonomous, prepare-and-route -> draft_for_review),
      # taking the most autonomous committed tier across routines sharing a
      # class; gate (h) of the commitments suite pins the derivation. The
      # Machine clamps every portal-set override to these — raising a bound
      # is a commitment change (a letter), never a settings change.
      #   external_send_client -> autonomous  (client verification, ceiling auto-handle)
      #   external_send_vendor -> autonomous  (records chase, ceiling auto-handle)
      #   external_send        -> draft_for_review (the letter's permanent
      #                           "a person sends it" cap on outside recipients)
      exposure_ceiling:
        external_send: draft_for_review
        external_send_client: autonomous
        external_send_vendor: autonomous
    skills:
      # product ops — the initiation card's Stage A (initiation-card.yaml).
      # Person-invoked only; report/reply to the requester only. admin_only is
