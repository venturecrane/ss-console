      # ---- PI litigation lifecycle (law-firm/pi@0.2.0, staged 2026-07-02) ----
      # The 19-skill CA PI pack, adversarially gated 2026-07-01. Initiation per
      # skill: watch/chase/track skills run on the cron block below; assemblers
