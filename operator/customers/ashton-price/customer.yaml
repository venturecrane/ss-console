# ---- SCOPE ----
scope:
  email_folders_visible:
    - Inbox
    - Sent
  email_folders_blind: []
  email_keyword_blocks: []
  # The firm is reachable (Captain, 2026-08-21). The 2026-08-18 bring-up fence
  # (domain_blocks: '@ashtonandprice.com', SMD-only while the test batch ran)
  # was removed the day the Captain approved the Operator's welcome to the firm;
  # the flip is proven by that one observed send to an @ashtonandprice.com admin.
  domain_blocks: []
  # The organization roster (ADR 0055) — who the Operator may RESPOND to (not just
  # draft) when they email its inbox. The whole firm (@ashtonandprice.com) plus the
  # SMD operator; replies are recipient-locked to the verified sender. So Chris,
  # Christa, and firm staff get real answers from the Operator out of the box, while
  # anyone OUTSIDE the firm is drafted (reaching outside needs explicit
  # authorization, ADR 0055 §3). Empty roster = fail-closed (drafts only).
  inbound_allow_from:
    - '@ashtonandprice.com'
    - scott@smd.services
  # The Operator-admin allow list (ADR 0085 §2) — who may establish the firm's
  # voice and output shapes by instructing the Operator, and who may promote a
  # captured correction. Chris and Christa are the two Named Administrators of
  # letter 18; the config key is ours, the people are the paper's. Scott
  # (SMD) was added PERMANENTLY by Captain decision 2026-08-11 (the
  # self-initiation decision set) so SMD can run initiation and establishment
  # on the firm's behalf. Letter 18 named only the firm's two admins, so this
  # third admin is disclosed to the firm (Captain follow-up, tracked with the
  # ss#2220 rescope).
  #
  # Why this list is NOT the roster above: the roster is domain-wide, so every
  # person at the firm gets real answers. Establishment is narrower on purpose —
  # an associate asking for a different tone is captured as a proposed
  # correction, and an admin decides whether it becomes how the firm
  # writes. Person addresses only; a whole-@domain grant is refused by the
  # validator precisely because it would erase that distinction.
  #
  # Empty = fail-closed: no admin-classed instruction exists on any channel.
  # Changed only through a PR.
  admins:
    - chris@ashtonandprice.com
    - christa@ashtonandprice.com
    - scott@smd.services
  # TRAFFIC ROUTING ONLY (ss-console#2546). When somebody at the firm who is not
  # an admin asks for a firm-level rule, this is who gets the email asking them
  # to reply "apply that" or "no". It changes nothing about AUTHORITY: all three
  # admins above may still apply a rule, and any of them can, by answering the
  # Operator directly. Chris is deliberately absent — he is an admin who is not
  # paged for every request, which is the reason this key is separate from the
  # list above. Scott (SMD) is here so the path has a second answerer while the
  # firm settles in.
  #
  # Every entry must also be on scope.admins (validator-enforced): routing a
  # request to somebody who could not act on it would produce an email nobody
  # can answer, and the broker's recipient fence would refuse the send anyway.
  #
  # Empty = no admin is emailed, and the Operator says so rather than claiming
  # somebody was asked.
  rule_requests_to:
    - christa@ashtonandprice.com
    - scott@smd.services
  # Whose reply ANSWERS an operations request (ss-console#2546). A routine, a
  # schedule, a channel, a memory setting, an autonomy level, an on/off: ADR 0085
  # as amended places all of those with SMD rather than with the firm, so when
  # somebody here asks for one the Operator records it, emails SMD with an
  # `[ops XXXX]` tag, and waits. A reply from one of these addresses quoting that
  # tag resolves that row, and the person who asked is told once — set up,
  # declined with SMD's reason, or lapsed unanswered after seven days.
  #
  # WHAT THIS GRANTS, exactly: a reply quoting an `[ops XXXX]` tag from this
  # address resolves that row. Nothing else. It is NOT inbound trust — none of
  # these addresses is on scope.inbound_allow_from, none of them is an admin, and
  # mail from one of them quoting no tag is as untrusted as any other mail. In
  # particular team@smd.services stays OFF inbound_allow_from, which is pinned by
  # a test: being able to answer a question the Operator asked is a much smaller
  # grant than being able to instruct it.
  #
  # The tag is the capability, and the spoof class is identical for all three: no
  # seat gets an SPF or DKIM verdict on inbound mail (ADR 0085 §5), so naming
  # scott@ rather than team@ buys nothing. What bounds the risk is the effect —
  # one templated notice to the person who asked.
  #
  # smdurgan@smdurgan.com is here because team@smd.services is an alias of that
  # mailbox, and a reply sent from the bare mailbox carries the bare address.
  #
  # Empty = no reply resolves anything and every request lapses at seven days.
  ops_reply_from:
    - scott@smd.services
    - team@smd.services
    - smdurgan@smdurgan.com
  # Typed outbound roster (ADR 0075). One entry on this seat, and it is an SMD
  # address rather than a firm one: operations requests (routines, schedules,
  # channels, memory, autonomy, on/off) are made by SMD, not by the firm's own
  # admins, so the Operator has to be able to pass such a request on to us
  # (ss-console#2546).
  #
  # WHAT THIS GRANTS, exactly: outbound CLASSIFICATION. A send to this address
  # resolves as internal firm staff instead of falling to the outside
  # external_send ceiling, so the request goes rather than sitting as a held
  # draft. It grants NO inbound trust — this address is deliberately absent from
  # scope.inbound_allow_from, so mail claiming to come from it does not untaint
  # a turn and cannot instruct the seat.
  outbound_roster:
    - address: team@smd.services
      class: firm_staff
      note: 'SMD operations desk; outbound classification only, never inbound trust'
  # External send to non-roster recipients is drafted, never autonomous — client-
  # and tribunal-bound mail ships under a human reviewer. The draft_for_review
  # posture is authored on the persona's entitlements.exposure (ADR 0056), the
  # RECOMMENDED default the firm confirms or changes at onboarding (ENTITLEMENTS.md),
  # not a fixed floor (ADR 0035). Recipient-locked replies to rostered senders are
  # governed by the roster above, not by this ceiling (ADR 0055 §3).

# ---- REPLY-CHANNEL SEND POLICY (ss#2070) ----
# Chris asked for something he can talk to. The platform default — 3 replies to
# one sender per 10 minutes, hardcoded until #2070 — cuts a conversation off at
# the fourth exchange and, before the auto-release landed, never resumed: the
# Operator simply went quiet mid-thread with no notice to either side. On this
# engagement that is the "one mistake" failure mode, not a missing feature.
#
# The roster above is domain-wide (`@ashtonandprice.com`), so everyone at the
# firm classifies INTERNAL and is exempt from the per-sender window. What still
# bounds the channel is the reply backstop: 60 replies an hour, every class
# counted. Two people in a working conversation are nowhere near it; a stuck
# loop trips it inside the hour instead of mailing the firm all day. Senders NOT
# on the roster keep the tight platform caps, unchanged.
#
# Values are the settled platform decision (Captain, 2026-07-30), authored
# identically on pilot-smokeball (#2076) and proven there before landing here:
# leg 1 ran ten exchanges on one thread with zero rate holds
# (vfy_01KYV9QEEEVB1H9G3YPMFYZJ5E). Held replies release automatically within
# the TTL rather than being dropped.
send_policy:
  reply:
    internal_exempt: true # the whole firm is rostered INTERNAL
    per_sender_max: 3 # non-roster senders: platform default, unchanged
    per_sender_window_seconds: 600
    global_max: 20 # non-roster aggregate: platform default, unchanged
    global_window_seconds: 3600
    backstop_max: 60 # the runaway bound, all classes
    backstop_window_seconds: 3600
  held_release:
    enabled: true
    ttl_seconds: 86400

