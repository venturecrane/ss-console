      # ---- work-product drafting lane (law-firm/pi@0.3.0): NOT ACTIVATED ----
      # FAIL-CLOSED BY OMISSION (ADR 0035, no imposed defaults): the four
      # drafting skills (discovery-response-drafter, follow-up-discovery-drafter,
      # demand-letter-drafter, mediation-brief-drafter) exist in the pack and
