schema_version: 1

# ============================================================================
# STAGING Operator — faithful pre-production mirror of customer-zero (smd).
# ============================================================================
# This is NOT a real customer. It exists so that every change to the Operator
# deploy/boot/voice/env machinery is proven on a Machine provisioned by the
# EXACT same tooling as production, before it ever touches the live business.
# It is a permanent, reusable pre-prod gate for Operator lifecycle work.
#
# Faithful where it matters (same boot sequence: unconditional Workspace
# broker + uid-split, same skill/connector materialization, same voice vault
# path shape, same env contract) but INERT and ISOLATED:
#   - Google credential is a GENERATED, isolated service account (real RSA key,
#     wired to nothing real). It boots the broker identically to prod; it is
#     never used for a live Google call by boot-smoke or the voice gate.
#     Staged at provision time, NEVER committed.
#   - No managed_mailboxes  -> touches no real Google inbox.
#   - No Telegram, no cron. The msgraph Email binding (ADR 0078 / ss#1978
#     sandbox e2e) was the one inbound path, proven against the smdopslab
#     tenant we own — operator@smdopslab.onmicrosoft.com, never a real client
#     mailbox. PARKED 2026-08-21: the M365 licences are not being retained
#     unless a future troubleshoot needs them, and the connector cannot work
#     without a licensed mailbox. The seat currently has NO inbound path.
#     See the parked block under connectors: for how to revive it.
#   - Own R2 prefix (vaults/smd-staging/), own D1 namespace, own skill-bodies
#     bucket. Shares no mutable state with smd.
#
# Provision with (overriding the real per-customer secrets in /ss so none leak):
#   see operator/customers/smd-staging/PROVISION.md

# ---- IDENTITY ----
customer_id: smd-staging
customer_name: 'SMD Staging (pre-prod, not a real customer)'

# ---- SEAT DESCRIPTOR ----
# What this seat IS. Kind and product only; lifecycle state is DERIVED from
# probes of the running system and is deliberately absent here — a state field
# is a claim an agent can write, and a claim an agent can write is one that rots.
# The permanent, reusable pre-production gate. Not a real customer.
seat:
  kind: preprod
  product: operator

# ---- AUTHORED OUTPUT SPECS (ADR 0083) ----
# The first seat in the fleet to declare anything here, and deliberately the
# preprod one: declaring `expected` BINDS the spec gate, and a bound class whose
# spec is not yet installed fails closed to draft. That is the correct behavior
# and the entire point of the declaration existing — but it is behavior to
# observe on a seat that serves nobody before it reaches one that serves a firm.
#
# `staff` first because persona voice needs no customer corpus, so it is
# provable from day one; because it is the highest-volume class by a wide
# margin; and because its recipients are the firm's own people, so the cost of
# a fail-closed draft is a human reading it a moment later rather than a client
# waiting. `format_spec: none` is an authored choice, not an omission — the
# convention in the skill's own output-format reference governs the shape.
#
# Every other class stays undeclared until someone authors its spec. An absent
# class is not `none`; it is a class nobody has decided about yet, and the
# registry is built so those cannot be confused (sections-output-classes.ts).
output_classes:
  staff:
    voice_spec: expected
    # Raised from `none` 2026-07-31 to prove ADR 0083 criteria 7/8: an authored
    # format is BINDING and deterministic, and an output that breaks it does not
    # go out. Format is the binary half of the model (§3) — a machine can decide
    # whether a required line is present, where it can only grade whether a
    # register sounds right — so this is the property that can be honoured every
    # time rather than usually.
    format_spec: expected

vertical: mixed
fly_region: lax

# ---- RUNTIME ----
model: claude-opus-4-8
# Hermes v0.18.0 → v0.20.4 promotion (staging leads the fleet, ss#2444). Rollback
# pin: v2026.7.1@7c1a029553d87c43ecff8a3821336bc95872213b (uv.lock + uv sync --frozen
# make the Python rebuild reproducible; proven to build on the Node-26 image by
# the staging rollback rehearsal). See docs/runbooks/operator/hermes-v0.20-upgrade-plan.md.
hermes_ref: v2026.8.18@e624e9fde561e1add9388384012b295fde669ade

machine:
  size: shared-cpu-1x
  memory_mb: 1024

# ---- GOOGLE WORKSPACE AUTHORITY ----
# Mirrors smd's DWD shape so the broker boots identically. The credential
# (GOOGLE_SERVICE_ACCOUNT_JSON Fly secret) is a generated isolated key, not the
# real customer credential. Subject is an unresolvable staging address — no
# managed mailboxes, so the broker's authored surface is the subject alone and
# nothing real is reachable.
google_auth:
  mode: dwd
  subject: crane@smd-staging.invalid
  scopes:
    - https://www.googleapis.com/auth/gmail.modify
    - https://www.googleapis.com/auth/calendar.events
    - https://www.googleapis.com/auth/drive

# ---- HUMANS WITH PORTAL ACCESS ----
users:
  - email: staging@smd-staging.invalid
    role: principal
    full_name: Staging Principal
    voice_profile_id: scott

# ---- PERSONAS ----
# Same persona/skill shape as smd so skill + connector materialization is
# exercised. No cron block: the agent does not self-trigger on staging.
personas:
  - slug: crane
    status: active
    name: Crane
    title: Chief of Staff
    tone:
      - plainspoken
      - direct
      - executive-summary
      - concise
    entitlements:
      exposure:
        internal_write: draft_for_review
        external_send: draft_for_review
    skills:
      - name: inbox-triage
        version: pending
        initiation:
          manual: true
          scheduled: false
          # webhook: WAS woken by the msgraph message.received trigger — the
          # ADR 0078 sandbox e2e inbound path, parked 2026-08-21 with the
          # connector. Left true so reviving the connector needs no edit here;
          # with no trigger authored, nothing wakes this skill by webhook.
          webhook: true
        enabled: true
      - name: workspace
        version: pending
        initiation:
          manual: true
          scheduled: false
          webhook: false
        enabled: true
    skills_disabled:
      - google-workspace
      - himalaya

# ---- CONNECTORS ----
# Google Workspace (Gmail / Calendar / Drive) rides the governed ADR 0045 Workspace
# broker — NOT the connector mechanism. The broker holds the DWD service-account
# credential (see google_auth:) and exposes the governed workspace_* tools; no CLI to
# shell out to.
# EXPLICIT EMPTY MAP, not an oversight: the seat's only connector is the msgraph
# Email one parked below, and a bare `connectors:` with every child commented out
# parses as null, which the validator rejects with "connectors is required".
# Restore this to `connectors:` when the Email block below is uncommented.
connectors: {}
  # Client-custody email (ADR 0078 / email-channel-seam spec / ss#1978) — the
  # sandbox END-TO-END proof binding. The mailbox is operator@smdopslab
  # .onmicrosoft.com on the smdopslab SANDBOX tenant we own (app-only
  # client-credentials, tenant-side ApplicationAccessPolicy pins the app to
  # exactly this mailbox — proven 2026-07-24, vfy_01KYAP100X / vfy_01KYAQ7V6Q).
  # Inbound rides the overlay delta poller (no public webhook); every polled
  # message enters through the same fence/taint/roster spine as webhook mail.
  # AgentMail is deliberately NOT bound on this seat — one mail path, one
  # custody story (ADR 0078 §1).
  #
  # TWO app registrations, both pinned to this mailbox by ApplicationAccessPolicy
  # (Captain decision 2026-08-13; provision-customer.sh refuses a seat without
  # both). `client_id` below is the READ-ONLY one — Mail.ReadWrite, NO Mail.Send —
  # and it is the ONLY Graph identity the agent process ever holds. The
  # send-capable registration reaches the workspace broker alone, via
  # MSGRAPH_SEND_CLIENT_ID__SMD_STAGING / MSGRAPH_SEND_CLIENT_SECRET__SMD_STAGING,
  # and is stripped from the agent's env before the exec-drop.
  #
  # The split is proven live on this seat, 2026-08-13
  # (vfy_01KZXX523V6JNWEETG4PSZDQY3): the read app below is refused sendMail with
  # 403 ErrorAccessDenied, the broker's send app returns 202, and the read app
  # still reads this mailbox (200) while being refused a tenant user list (403).
  #
  # CORRECTED 2026-08-13: this field previously carried 83a044a4-…, which is the
  # SEND-capable registration. Authoring it here is what a reprovision would have
  # staged as MSGRAPH_CLIENT_ID — handing the agent the app that can transmit and
  # undoing the fence. The read-only app is 9301fd6f-… , which is what the live
  # seat actually runs.
  # ---- MSGRAPH PARKED 2026-08-21 ----
  # The smdopslab M365 licences are not being retained unless a future
  # troubleshoot needs them, and without a licensed mailbox this connector
  # cannot work regardless of how fresh its credentials are. Parked rather
  # than deleted: the provisioner derives its authored-channel facts with
  # yaml.safe_load, so a commented block is invisible to the msgraph gate
  # (the gate that refuses a seat carrying no SEND app credential) while
  # every id below stays on hand. Commenting only became safe on
  # 2026-08-18 -- before that the gates grepped the raw file and read
  # comments as config.
  #
  # TO REVIVE: re-licence the mailbox, uncomment this block and the
  # webhook_triggers block below (indentation is preserved -- strip the
  # leading "# " and nothing else), mint a SEND secret on the EXISTING
  # send registration, vault it as MSGRAPH_SEND_CLIENT_ID__SMD_STAGING /
  # MSGRAPH_SEND_CLIENT_SECRET__SMD_STAGING, and replace the stale
  # MSGRAPH_CLIENT_SECRET__SMD_STAGING in /ss prod -- it is invalid
  # (AADSTS7000215); the bare MSGRAPH_CLIENT_SECRET is the good read value.
  # Email:
  # adapter: msgraph
  # backend: mcp:msgraph-mail
  # enabled: true
  # msgraph_auth:
  # tenant_id: 'f11d2887-b7f2-4464-a9c6-d4db2166b43c'
  # client_id: '9301fd6f-1d97-4ed4-abc3-e99e3cf326f0'
  # mailbox: operator@smdopslab.onmicrosoft.com
  # secret_ref: 'fly-secret:MSGRAPH_CLIENT_SECRET'
  # poll_seconds: 45

# ---- WEBHOOK TRIGGERS ----
# The e2e wake path: a new message in the operator's sandbox inbox (delivered
# by the delta poller through the signed loopback) routes to inbox-triage.
# webhook_triggers:
# - source: msgraph
# event_type: message.received
# skill: inbox-triage
# persona: crane

# ---- SCOPE ----
scope:
  email_folders_visible:
    - Inbox
  email_folders_blind: []
  email_keyword_blocks: []
  domain_blocks: []
  trusted_sender_domains:
    - smd-staging.invalid
  # The organization roster (ADR 0055) for the e2e proof: Captain's real
  # addresses classify INTERNAL (no fence, recipient-locked real reply via the
  # relay) — the human-visible acceptance test is Captain emailing the operator
  # and receiving its reply. Anyone else is quarantined + drafted (fail-closed),
  # which is the OTHER half of the proof.
  inbound_allow_from:
    - scott@smd.services
    - smdurgan@smdurgan.com
  # Exposure stays draft_for_review: the model drafts, the relay delivers the
  # recipient-locked reply to the rostered sender (ADR 0072/0055 posture).
escalation:
  red_flag_recipients:
    - staging@smd-staging.invalid
  failure_recipients:
    - staging@smd-staging.invalid

# ---- VOICE LIBRARY ----
# Same path shape as smd. A copy of smd's content-free structural-diff samples
# is staged under vaults/smd-staging/voice/ at setup so the POPULATED voice path
# is exercised end-to-end on staging.
voice_library:
  samples_path: 'r2://vaults/smd-staging/voice/samples/'

# ---- MEMORY (per-customer isolation; must match customer_id) ----
memory:
  d1_namespace: smd-staging
  r2_vault_path: 'vaults/smd-staging/'
  vectorize_index: 'hermes-smd-staging-vault'
