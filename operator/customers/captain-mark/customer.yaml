schema_version: 1

# captain-mark: Laurie Perrin and Scott Durgan's couples agent, SMD's own proof
# of concept of the couples role (ADR 0090, ADR 0091; ss-console#3264). Made
# from operator/customers/_couples-template. Like The Brokery: the only
# interface is email to and from the agent's own inbox, and only the two
# partners' addresses reach it. Both partners are also on Telegram, by DM and in
# one shared group (bot token is a Fly secret on hermes-captain-mark, never
# here). Schedules and other
# settings are given to the agent in conversation, not authored here.

# ---- IDENTITY ----
customer_id: captain-mark
customer_name: Laurie & Scott

# ---- SEAT DESCRIPTOR ----
seat:
  kind: customer
  product: hosted-agent
  role: couples

vertical: mixed
addons: []
practice_areas:
  - general
fly_region: lax # nearest to Phoenix; Fly has no phx region

# ---- RUNTIME ----
model: claude-sonnet-4-6

machine:
  size: shared-cpu-1x
  memory_mb: 1024

# ---- PEOPLE (ADR 0091) ----
people:
  - id: p1
    name: Laurie Perrin
    telegram_id: '8854529905'
    email: lsperrin.lp@gmail.com
    channel: telegram
  - id: p2
    name: Scott Durgan
    telegram_id: '7367659986'
    email: scott.durgan@gmail.com
    channel: telegram

spaces:
  shared_telegram_chat: '-5461624424'

# ---- SMD OPERATOR OF THE SEAT ----
users:
  - email: scott@smd.services
    role: principal
    full_name: Scott Durgan

# ---- PERSONA ----
personas:
  - slug: captain-mark
    status: active
    name: Captain Mark
    title: Assistant
    tone:
      - plainspoken
      - warm
      - concise
    entitlements:
      exposure:
        internal_write: autonomous
        external_send: confirm
        # Sends to a ROSTERED address only, which on a couples seat is exactly
        # the two partners (validator rule: roster == people). Without it the
        # seat cannot deliver a hello or a routine by
        # email: those run on scheduled turns with no channel to confirm on.
        # Same grant as The Brokery. Anything off the roster stays confirm.
        external_send_internal: autonomous
    skills:
      - name: calendar
        version: pending
        initiation:
          manual: true
          scheduled: false
          webhook: false
        enabled: true
        settings:
          recipients: roster
      - name: workspace
        version: pending
        initiation:
          manual: true
          scheduled: false
          webhook: false
        enabled: true
      - name: inbox-triage
        version: pending
        initiation:
          manual: true
          scheduled: false
          webhook: true
        enabled: true
      - name: couples-checkin
        version: pending
        initiation:
          manual: true
          scheduled: true
          webhook: false
        enabled: true
        settings:
          recipients: roster
      # Schedules and settings set in conversation (#3264).
      - name: couples-settings
        version: pending
        initiation:
          manual: true
          scheduled: false
          webhook: false
        enabled: true
      # A partner's message to the other partner, passed by the agent at once
      # (partner_message_send, ADR 0097). Manual only: a partner asks.
      - name: partner-messages
        version: pending
        initiation:
          manual: true
          scheduled: false
          webhook: false
        enabled: true
      - name: gratitude-prompts
        version: pending
        initiation:
          manual: true
          scheduled: true
          webhook: false
        enabled: true
        settings:
          recipients: roster
      - name: dates-to-remember
        version: pending
        initiation:
          manual: true
          scheduled: true
          webhook: false
        enabled: true
        settings:
          recipients: roster
      - name: date-night-planner
        version: pending
        initiation:
          manual: true
          scheduled: false
          webhook: false
        enabled: true
      - name: travel
        version: pending
        initiation:
          manual: true
          scheduled: true
          webhook: true
        enabled: true
        settings:
          recipients: roster
      - name: shared-lists
        version: pending
        initiation:
          manual: true
          scheduled: false
          webhook: false
        enabled: true
      - name: weekly-checkin-agenda
        version: pending
        initiation:
          manual: true
          scheduled: true
          webhook: false
        enabled: true
        settings:
          recipients: roster
      - name: memory-journal
        version: pending
        initiation:
          manual: true
          scheduled: false
          webhook: false
        enabled: true
    # No authored routines: the couple sets every schedule by email.
    cron: []

# ---- CONNECTORS ----
connectors:
  Email:
    adapter: agentmail
    backend: 'mcp:agentmail'
    enabled: true
    webhook_url: 'https://hermes-captain-mark.fly.dev/webhooks/agentmail'
  WebSearch:
    adapter: brave
    backend: 'native:brave-free'
    enabled: true

webhook_triggers:
  - source: agentmail
    event_type: message.received
    skill: inbox-triage
    persona: captain-mark

# ---- RECORD STORES ----
record_stores:
  - name: couples-checkin
    path: /opt/data/couples/checkin
    owner_field: owner
    index: [kind, topic, date]
  - name: gratitude
    path: /opt/data/couples/gratitude
    owner_field: owner
    index: [kind, date]
  - name: dates
    path: /opt/data/couples/dates
    owner_field: owner
    index: [kind, title, date]
  - name: date-nights
    path: /opt/data/couples/date-nights
    owner_field: owner
    index: [idea, status, last_tried]
  - name: trips
    path: /opt/data/couples/trips
    owner_field: owner
    index: [kind, trip, start_date, end_date]
  - name: lists
    path: /opt/data/couples/lists
    owner_field: owner
    index: [kind, title, due]
  - name: journal
    path: /opt/data/couples/journal
    owner_field: owner
    index: [date, title]

# ---- SCOPE ----
scope:
  email_folders_visible:
    - Inbox
    - Sent
  email_folders_blind: []
  email_keyword_blocks: []
  domain_blocks: []
  inbound_allow_from:
    - lsperrin.lp@gmail.com
    - scott.durgan@gmail.com

# ---- ESCALATION ----
escalation:
  red_flag_recipients:
    - scott@smd.services
  failure_recipients:
    - team@smd.services

# ---- SAFETY ----
safety:
  sticky_stop:
    cost_cap_daily_cents: 500
    inbound_daily_cap: 100
    web_search_daily_cap: 200

# ---- TELEGRAM ----
# One bot for the couple (BotFather). Only bound partners reach it: Laurie and
# Scott. A partner's id goes on both allow lists when they bind; the shared
# group's chat id goes in spaces.shared_telegram_chat and group_chats.
#
# In the group the agent speaks only when addressed: an @mention or a reply to
# one of its messages (require_mention, the Captain's call 2026-10-22). BotFather
# group privacy stays ON, so the bot never receives the couple's own talk.
#
# Do not change the group's settings after its id is bound here. Some changes
# turn a basic group into a supergroup with a new -100... id, and a message from
# a chat not on the list is dropped without a log line.
telegram:
  enabled: true
  require_mention: true
  allow_from:
    - '8854529905'
    - '7367659986'
  group_allow_from:
    - '8854529905'
    - '7367659986'
  group_chats:
    - '-5461624424'
  group_sessions_per_user: false

# ---- VOICE LIBRARY ----
voice_library:
  samples_path: 'r2://vaults/captain-mark/voice/samples/'

# ---- MEMORY ----
memory:
  d1_namespace: captain-mark
  r2_vault_path: 'vaults/captain-mark/'
  vectorize_index: 'hermes-captain-mark-vault'
  memory_enabled: false
  user_profile_enabled: false
