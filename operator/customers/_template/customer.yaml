schema_version: 1

# TEMPLATE customer.yaml for a PI law firm demo.
#
# Copy this file to operator/customers/{firm-slug}/customer.yaml, then
# replace every bracketed value. Validate with the canonical TS validator
# (per ADR 0019):
#
#   npx tsx scripts/validate-customer-yaml.ts \
#     operator/customers/{firm-slug}/customer.yaml
#
# The reserved `_template` directory is never a real customer slug.
# customer_id must equal the directory name and match ^[a-z0-9][a-z0-9-]{0,31}$.

# ---- IDENTITY ----
customer_id: '[FIRM-SLUG]'
customer_name: '[LEGAL NAME]'

# ---- SEAT DESCRIPTOR ----
# What this seat IS. Kind and product only; lifecycle state is DERIVED from
# probes of the running system and is deliberately absent here — a state field
# is a claim an agent can write, and a claim an agent can write is one that rots.
# Templates default to the MOST cautious kind: a seat nobody has relabelled is treated as if it holds a real client's data.
seat:
  kind: customer
  product: operator

# ADR 0022 Stream 1: vertical accepts either bare (legacy back-compat) or
# pinned form (<vertical>@<semver>). Pin once the vertical pack ships at a
# stable version. Bare form is fine for pre-launch customer-zero.
vertical: mixed
# Optional add-on packs the customer subscribes to. Each entry is
# <vertical>/<addon>@<semver> (cross-vertical composition allowed —
# ADR 0022 §"Properties of the vertical model" bullet 3). v1 ships with
# law-firm/pi only. Empty array means "vertical defaults only."
addons: []
practice_areas:
  - '[PRIMARY PRACTICE AREA, e.g., personal-injury-plaintiff]'
fly_region: '[FLY REGION SLUG, e.g., iad / lax / ord]'

# ---- RUNTIME ----
# Default posture (ADR 0049): light main, escalate up. Sonnet runs the
# high-frequency volume cheaply; heavy work (pre-weighted skills) escalates to
# Opus via the SOUL instruction translate.py renders when escalation_model is set.
model: claude-sonnet-4-6
escalation_model: claude-opus-4-8
hermes_ref: '[HERMES UPSTREAM PIN, e.g., v2026.5.7@<40-hex-sha>]'

machine:
  size: shared-cpu-1x
  memory_mb: 1024

# ---- HUMANS WITH PORTAL ACCESS ----
users:
  - email: '[PRINCIPAL EMAIL]'
    role: principal
    full_name: '[PRINCIPAL FULL NAME]'

# ---- PERSONAS (length >= 1) ----
personas:
  - slug: '[PERSONA SLUG, e.g., marcus]'
    status: active
    name: '[PERSONA FIRST NAME]'
    title: AI Associate
    tone:
      - plainspoken
      - warm-but-professional
      - concise
    entitlements:
      exposure:
        internal_write: draft_for_review
        external_send: draft_for_review
    skills:
      - name: '[LEAD PI SKILL, e.g., demand-letter-draft]'
        version: pending
        initiation:
          manual: true
          scheduled: false
          webhook: false
        enabled: true
    # ---- OPTIONAL: skill bundles (ADR 0021 Stream D) ----
    # bundles:
    #   - slug: example-bundle
    #     description: 'Group related skills that share context'
    #     skills:
    #       - inbox-triage
    #       - status-report-assembler
    #     instruction: 'Optional shared context prepended to every bundled skill'
    #
    # ---- OPTIONAL: per-skill cron schedules (ADR 0021 Stream B) ----
    # cron:
    #   - skill: paid-media-anomaly-watcher
    #     schedule: '0 7 * * *'        # daily 0700 PT
    #     pre_run: pre_run.py          # required when wake_policy is pre_run_decides
    #     wake_policy: pre_run_decides # pre_run.py decides wakeAgent; MUST emit
    #                                  # audit_action='suppressed_wake' on silent path
    #   - skill: status-report-assembler
    #     schedule: 'every 1d'
    #     wake_policy: always          # no pre_run; agent wakes every tick

# ---- CONNECTORS ----
# Hypothesized stack from the dossier. Confidence-low items should start
# as synthetic and switch to a real adapter only after Captain confirms
# during the assessment call.
#
# OPTIONAL `webhook_url` (ADR 0021 Stream E): if the vendor pushes events,
# point them at the customer's own Fly Machine. Pattern enforces that the
# embedded slug matches customer_id (cross-customer leakage vector if not).
#   webhook_url: 'https://hermes-[FIRM-SLUG].fly.dev/webhooks/practice_management'
connectors:
  PracticeManagement:
    adapter: '[filevine / clio / no_pm]'
    backend: '[build:filevine / mcp:clio-oktopeak / synthetic:no_pm]'
    enabled: true
  Email:
    adapter: '[msgraph / m365-mail / google-gmail / agentmail / synthetic]'
    backend: '[mcp:msgraph-mail / mcp:m365-mail / mcp:google-gmail / synthetic:fixture]'
    enabled: true
    # CLIENT-CUSTODY MAIL (adapter: msgraph — ADR 0078 / email-channel-seam D5).
    # The Operator reads and sends from a mailbox inside the CLIENT's own
    # Microsoft 365 tenant. Uncomment and author when this seat uses it; delete
    # otherwise (a msgraph_auth block on any other adapter is a hard validation
    # error — no dead config).
    #
    # THE CLIENT'S IT ADMINISTRATOR MUST CREATE **TWO** APP REGISTRATIONS BEFORE
    # STAND-UP DAY. This is a hard requirement (Captain decision 2026-08-13);
    # provision-customer.sh refuses the seat without both, naming the exact
    # variable to stage.
    #
    #   1. READ app  — Mail.ReadWrite, NO Mail.Send. Its client id goes in
    #      `client_id` below. This is the only Graph identity the agent holds.
    #   2. SEND app  — Mail.Send only. Never appears in this file; staged as
    #      MSGRAPH_SEND_CLIENT_ID__<CID> / MSGRAPH_SEND_CLIENT_SECRET__<CID> in
    #      the operator env and materialized to the broker alone.
    #
    # Both pinned to the one mailbox by an Exchange ApplicationAccessPolicy. Two
    # apps is the ONLY way to split read from send here: a Graph app-only token
    # is always `/.default` — every permission the registration holds, with no
    # per-request scope-down — so one app that can read the mailbox can also send
    # from it the moment Mail.Send is granted.
    #
    # Setup (give this to the client's IT):
    #   docs/runbooks/operator/ms-graph-azure-ad-setup.md
    #     → "Client-custody app-only registrations — TWO apps, not one"
    #
    # msgraph_auth:
    #   tenant_id: '[the CLIENT tenant GUID]'
    #   client_id: '[the READ app client id — the one WITHOUT Mail.Send]'
    #   mailbox: '[the Operator's own mailbox in the CLIENT's tenant]'
    #   secret_ref: 'fly-secret:MSGRAPH_CLIENT_SECRET'  # READ app secret, ADR 0010
    # poll_seconds: 45   # delta poll cadence; inbound is polling, not webhooks
  Calendar:
    # ADR 0021 Stream F migration (PR #1080): M365 calendar shipped as
    # first-party MCP. Per ADR 0020 the MCP-first ordering applies.
    adapter: '[m365-calendar / google-calendar / synthetic]'
    backend: '[mcp:m365-calendar / mcp:google-calendar / synthetic:fixture]'
    enabled: true
  DocumentStorage:
    # ADR 0021 Stream F migration (PR #1080): Microsoft has not shipped a
    # first-party OneDrive/SharePoint MCP. The community MIT
    # `mcp:softeria/ms-365-mcp-server` covers the Files surface; the
    # retired BUILD adapter at `operator/connectors/ms_graph/` is
    # removed in the Wave-4 removal PR.
    adapter: '[ms-365 / google-drive / synthetic]'
    backend: '[mcp:softeria/ms-365-mcp-server / mcp:google-drive / synthetic:fixture]'
    enabled: true
  # WebSearch (ADR 0070) is UNAUTHORED by default for the Operator: the web is
  # incidental to the engagement and lower-trust/injectable in regulated
  # verticals, so it is authored per engagement, not imposed (ADR 0035). Wired to
  # Hermes' native web provider (no MCP wrapper). To enable, uncomment and also
  # author safety.sticky_stop.web_search_daily_cap. For a SENSITIVE/legal seat
  # prefer a paid or customer-owned Brave key (one party in the query path) and
  # confirm Brave's data-processing/retention terms first. Search only.
  # WebSearch:
  #   adapter: brave
  #   backend: 'native:brave-free'   # or a paid/customer-owned Brave tier
  #   enabled: true

# ---- OPTIONAL: webhook triggers (ADR 0021 Stream E) ----
# Map inbound vendor webhook payloads to skill invocations on a persona.
# Each `source` MUST be a connector adapter with `webhook_url` configured.
# webhook_triggers:
#   - source: filevine
#     event_type: matter.created
#     skill: intake-triage
#     persona: '[PERSONA SLUG]'
#   - source: filevine
#     event_type: document.added
#     skill: discovery-response
#     persona: '[PERSONA SLUG]'
#     # OPTIONAL trigger exceptions (gate-enforced: excluded deliveries get a 202 +
#     # WEBHOOK_SUPPRESSED audit row, no agent wake). Author these when a skill must
#     # NOT fire for specific matters or specific actors — e.g. an internal
#     # ops/notepad matter the Operator should not supervise, or a principal whose
#     # own edits should not trigger a supervision memo. Values are vendor GUIDs;
#     # the validator rejects unknown keys and non-GUID entries because the runtime
#     # gate FAILS OPEN — a typo must fail authoring loudly, not silently forward.
#     # Unauthored = no exceptions (ADR 0035, no imposed defaults).
#     exclude:
#       matters:
#         - '[MATTER GUID]'   # e.g. an internal ops/digest-home matter
#       actors:
#         - '[VENDOR USER GUID]'   # e.g. the supervising principal's own edits

# ---- SCOPE ----
scope:
  email_folders_visible:
    - Inbox
    - Sent
  email_folders_blind: []
  email_keyword_blocks: []
  domain_blocks: []
  # The organization roster (ADR 0055) — who the Operator may RESPOND to (not just
  # draft) when they email its inbox. Onboarding default = the SMD operator + the
  # organization's own email domain, so the org can talk to its Operator from day
  # one (replies are recipient-locked to the verified sender). Anyone outside the
  # roster is drafted. Empty roster = fail-closed (drafts only).
  inbound_allow_from:
    - scott@smd.services
    - '@[ORG EMAIL DOMAIN]'
  # Operator-admin allow list (ADR 0085 §2) — who may establish or update the
  # FIRM's voice and output shapes by instructing the Operator. Specific
  # people's email addresses, never domains: who speaks for the firm is
  # commitment-shaped, so changing this list is a PR. Empty = fail-closed
  # (nobody can establish firm-level voice/shape; per-person preferences are
  # unaffected — a person's own rostered identity governs their own layer).
  admins: []
  # Who is EMAILED when somebody who is not an admin asks for a firm-level rule
  # (ss-console#2546). Routing, not authority: every admin above may still apply
  # a rule. Author a subset of `admins` when the organization does not want each
  # of them paged for every request; author all of them, or leave it empty, when
  # it does not care. Every entry MUST also appear on `admins` (validated).
  # Empty = no admin is emailed, and the Operator says so rather than claiming
  # somebody was asked.
  rule_requests_to: []
  # Whose reply ANSWERS an operations request (ss-console#2546) — a routine, a
  # schedule, a channel, a memory setting, an autonomy level, an on/off, all of
  # which ADR 0085 as amended places with SMD rather than with the firm. A reply
  # from one of these addresses quoting the request's `[ops XXXX]` tag resolves
  # it, and the person who asked is told once. Person addresses at an SMD domain
  # only (validated); NOT inbound trust, and deliberately never on
  # `inbound_allow_from`. Empty = no reply resolves anything and every request
  # lapses unanswered at seven days.
  ops_reply_from: []

# ---- ESCALATION ----
escalation:
  red_flag_recipients:
    - '[PRINCIPAL EMAIL]'
  failure_recipients:
    - '[PRINCIPAL EMAIL]'

# ---- SAFETY (ADR 0062 cost breaker; optional — platform defaults apply) ----
# Integrity controls protecting SMD's own spend (ADR 0035: unauthored means
# the platform default, never fail-open). Live-read from the volume per use.
# safety:
#   sticky_stop:
#     cost_cap_daily_cents: 5000   # job-path daily cap base ($50/day). The seat
#                                  # HARD-STOPS at 200% of this ($100/day), which
#                                  # is platform semantics, not authorable. Note
#                                  # it does NOT stop at 100%: the 80%/100% rungs
#                                  # named states that restricted nothing and
#                                  # were removed 2026-09-02. To brake at the cap
#                                  # itself, halve this number.
#     inbound_daily_cap: 200       # verified webhook wakes routed per UTC day;
#                                  # overflow is parked (202 + audit, no wake)

# ---- SELF-INITIATION (ss#2220; optional) ----
# The seat's authored initiation sequence: the acts one Operator-admin request
# ("initialize yourself") runs, in order, via the operator-self-initiation
# conductor skill. Person-initiated always — never automatic at connect, boot,
# or on a schedule. Every sequence act must be a skill bound+enabled on this
# seat (drift-gated by tests/self-initiation-sequence.test.ts), and any seat
# that binds operator-self-initiation must author this block. Read at turn
# time off /var/lib/smd-config/customer.yaml (routine_names shape).
# self_initiation:
#   sequence:
#     - operator-self-test
#     - voice-establishment
#     - document-library-establishment
#   document_library:
#     matter_hint: '[the ops matter the library lives on — authored after the blessing]'
#     folder_name: 'Document Library'
#     # Format templates (#2448). The Smokeball connector's renderer resolves the
#     # firm's per-class Word template from here at render time: matter_number
#     # (the library matter's NUMBER, a stable human key) -> folder_name -> the
#     # file named templates[<class>], else "Template - <Class>.docx". Classes:
#     # discovery_set, discovery_response, demand_letter, mediation_brief, memo,
#     # letter. Typography lives ONLY in those .docx files (the firm edits them in
#     # Word; no config change, no reboot). Either provenance: the firm's own
#     # template/letterhead dropped into the folder under that name, or the
#     # starter the establishment turn files for the firm to edit.
#     matter_number: '[the library matter number, e.g. 2026-OPS-001]'
#     templates:
#       letter: '[optional: the firm letterhead file name in the folder]'

# ---- VOICE LIBRARY ----
voice_library:
  samples_path: 'r2://vaults/[FIRM-SLUG]/voice/samples/'

# ---- MEMORY (isolation invariants; must match customer_id) ----
memory:
  d1_namespace: '[FIRM-SLUG]'
  r2_vault_path: 'vaults/[FIRM-SLUG]/'
  vectorize_index: 'hermes-[FIRM-SLUG]-vault'
  # ADR 0022 Stream 2 (skill body persistence) populates these at bootstrap.
  # Never hand-author them. Schema declared in PR 1 as known-optional so
  # Stream 2 can consume them without amending the validator. See
  # docs/specs/operator/vertical-manifest-schema.md §"Skill body R2 keys".
  # r2_skill_bodies_bucket: 'smd-operator-skill-bodies'   # shared-bucket default
  # r2_skill_bodies_prefix: '[FIRM-SLUG]/'                   # shared-bucket prefix
