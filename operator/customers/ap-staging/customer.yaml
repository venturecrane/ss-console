# ============================================================================
# ap-staging: the EXACT twin of ashton-price, on SMD's own lab accounts.
# ============================================================================
# Not a real customer. This seat exists so that every change is rehearsed on a
# copy of the A&P seat before A&P sees it (ADR 0107): the same model, the same
# escalation model, the same Machine size and lane memory, the same region,
# skills, lanes, crons, webhook triggers, entitlements, send policy and output
# classes. Everything that reaches a person, a mailbox or a tenant is SMD's:
#   - Smokeball: SMD's own STAGING tenant (environment: staging), the tenant
#     pilot-smokeball also uses, through SMD's sandbox app (SMOKEBALL_STAGING_*,
#     the `sandbox` custody class in operator/bin/lib/secret_custody.py).
#   - Mail: the smdopslab lab mailbox smd-staging uses, the same two Graph app
#     registrations (read app below; send app staged as MSGRAPH_SEND_*__AP_STAGING).
#   - People: SMD lab stand-ins in the shape A&P's people have. The office
#     manager (admin, recipient of every scheduled email, the one send-as name)
#     is the lab staff mailbox ScottDurgan@smdopslab; the principal (admin who is
#     not paged) is SMD's ss-probe-admin AgentMail inbox; the office scanner is
#     SMD's ss-probe-runner AgentMail inbox. The firm, its letterhead and its
#     police agencies are fictional (SMD Lab Law, Labtown). No value below is
#     A&P's.
#
# THE DRIFT GATE. tests/twin-drift.test.ts holds this file equal to
# operator/customers/ashton-price/customer.yaml everywhere except the paths
# declared in twin.yaml beside it. A change to A&P that is not made here too
# fails CI, and so does a difference here that twin.yaml does not declare.
# Change A&P and this file in the same PR.
#
# NOT YET PROVISIONED (seat.yaml fly_app: null, purpose: internal). The four
# Operator Library matter ids and the expense staff id are nil-GUID PENDING
# markers: they are ids in SMD's staging tenant, read from that tenant before
# the first provision, and the provisioner refuses this seat while any remains
# (scripts/refuse-pending-config.ts). The provisioning runbook, step by step
# with a probe per step, is docs/handbook/deployment-release.md, "Provisioning
# ap-staging, the exact twin of ashton-price".
#
# Validate:  npx tsx scripts/validate-customer-yaml.ts \
#              operator/customers/ap-staging/customer.yaml

