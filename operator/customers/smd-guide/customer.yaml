schema_version: 1

# GUIDE seat: SMD Services' own product guide (ADR 0105, role package
# operator/roles/guide/). A sales representative SMD has listed emails a
# question about the Operator and gets, in the same thread, an answer from the
# product library (skill product-guide, operator/skills/product-guide/
# references/) that names the document and section it came from. No client
# material, no pricing.
#
# NOT YET PROVISIONED (seat.yaml fly_app: null). A merge of this file writes
# nothing to R2 (ci-publish-customer-configs.sh never creates a seat's object)
# and no D1 row (ci-sync-customer-configs.sh skips a slug with no
# customer_configs row), so nothing runs until the Captain provisions it. The
# outside representative's address is not known yet; until it is added below
# by a reviewed PR, the only person the seat answers is SMD.

# ---- IDENTITY ----
customer_id: 'smd-guide'
customer_name: 'SMD Services'

# ---- SEAT DESCRIPTOR ----
# SMD's own seat, on SMD's key; the role selects the guide persona and its
# toolset trim (no web, no native memory, no establishment).
seat:
  kind: internal
  product: operator
  role: guide

vertical: mixed
addons: []
practice_areas:
  - general
fly_region: lax # Phoenix-adjacent; Fly has no phx region

# ---- RUNTIME ----
# The guide reads an index and a few documents and writes one reply: the main
# model, no escalation tier.
model: claude-sonnet-5-5

# One gateway, no lanes; two shared CPUs, the fleet floor (#3917). Memory is
# twice the floor: SMD's three comparable seats (scott, brokery, captain-mark;
# same gateway, mail and chat) measured 859 to 1,055 MB used of 1,970 while
# IDLE on 2026-11-09, with no swap, so a working turn has under 1.1 GB before
# the kernel kills a process. This seat is what a prospective representative
# meets first; 4,096 MB is what smd-staging runs.
machine:
  size: shared-cpu-2x
  memory_mb: 4096

# ---- HUMANS WITH PORTAL ACCESS ----
users:
  - email: scott@smd.services
    role: principal
    full_name: Scott Durgan

# ---- PERSONA ----
personas:
  - slug: guide
    status: active
    name: SMD Product Guide
    title: Product Guide
    tone:
      - plainspoken
      - concise
    entitlements:
      exposure:
        # The one send this seat authors: the reply to a ROSTERED sender
        # (scope.inbound_allow_from), in that sender's thread, through the
        # recipient-locked reply relay. No person is present to confirm an
        # answer, so it is autonomous. Every other class is unauthored, and an
        # unauthored class is refused: no send to anyone off the roster, no
        # write, no commitment, no code.
        external_send_internal: autonomous
        # Internal writes (ADR 0106): the email reply path's own create_draft
        # is INTERNAL_WRITE and runs through the trust gate, so without this
        # every reply was refused; and the administrator's invite-code request
        # (invite_code_issue). The tool itself refuses anyone not on scope.admins, a chat
        # turn and a turn that read outside content; the code goes only to the
        # administrator who asked, in their thread, written by the broker.
        internal_write: autonomous
    skills:
      # Every email to the seat lands here (webhook_triggers below); a
      # practice request is handed to pitch-practice in the same turn.
      - name: product-guide
        version: pending
        initiation:
          manual: true
          scheduled: false
          webhook: true
        enabled: true
      # The role's second job: practice pitching against an authored buyer.
      # Reached from product-guide on email, or chosen directly in chat.
      - name: pitch-practice
        version: pending
        initiation:
          manual: true
          scheduled: false
          webhook: true
        enabled: true
      # Training (issue #3946): guided lessons with an exercise each, an
      # open-book quiz graded in code, a mock pitch, and readiness worked out
      # by code from those facts. Reached from product-guide on email;
      # scheduled for the weekly progress report below.
      - name: rep-training
        version: pending
        initiation:
          manual: true
          scheduled: true
          webhook: true
        enabled: true
      # The desk (issue #3946): notes, leads and a pipeline view the
      # representative alone can read, dated reminders, a brief built only from
      # their own records, a follow-up draft returned to them as text, critique
      # and debrief. Reached from product-guide on email; scheduled for the
      # digest below. The seat never emails a prospect.
      - name: rep-desk
        version: pending
        initiation:
          manual: true
          scheduled: true
          webhook: true
        enabled: true
        settings:
          reminder_store: rep-reminders
          # One email on a morning when something of theirs is due, sent at
          # 7:00 AM Arizona time. Nothing due means no email and no model call.
          digest_hour: 7
          timezone: America/Phoenix
          recipients: roster
    cron:
      # Hourly check for the digest above. Code renders one email per person
      # from that person's own records; the hour and the per-day mark decide
      # who is due.
      - skill: rep-desk
        schedule: '7 * * * *'
        pre_run: pre_run.py
        wake_policy: pre_run_decides
      # Weekly progress and readiness report to scope.admins, Mondays 8:00 MST
      # (15:00 UTC). Code renders it from the progress store only; a week with
      # nobody enrolled wakes no model and sends nothing.
      - skill: rep-training
        schedule: '0 15 * * 1'
        pre_run: pre_run.py
        wake_policy: pre_run_decides

# ---- CONNECTORS ----
connectors:
  Email:
    adapter: agentmail
    backend: 'mcp:agentmail'
    enabled: true
    webhook_url: 'https://hermes-smd-guide.fly.dev/webhooks/agentmail'
    # The seat's OWN inbox, created at provisioning. Authored rather than
    # derived so the address the representative is given is written down here;
    # the workspace broker pins every outbound send to it and refuses every
    # send from an address the account does not list.
    inbox_address: smd-guide@agentmail.to

webhook_triggers:
  - source: agentmail
    event_type: message.received
    skill: product-guide
    persona: guide

# ---- SEND POLICY ----
# Same authored values as scott and brokery: rostered senders exempt from the
# reply throttle (a representative may send several questions in a row),
# held replies auto-release, non-roster bounds unchanged.
send_policy:
  reply:
    # A reply the checks hold tells the sender in one fixed line that it could
    # not be answered and to send it again; redrafts after a hold are capped.
    held_notice: true
    max_redrafts: 2
    internal_exempt: true
    per_sender_max: 3
    per_sender_window_seconds: 600
    global_max: 20
    global_window_seconds: 3600
    backstop_max: 60
    backstop_window_seconds: 3600
  held_release:
    enabled: true
    ttl_seconds: 86400

# ---- SCOPE ----
scope:
  email_folders_visible:
    - Inbox
    - Sent
  email_folders_blind: []
  email_keyword_blocks: []
  domain_blocks: []
  # Exact addresses only. SMD for now; each representative is added here by a
  # reviewed PR once SMD has their address (then reprovision or let the live
  # applier pick it up).
  inbound_allow_from:
    - scott@smd.services
  admins:
    - scott@smd.services

# ---- ESCALATION ----
escalation:
  red_flag_recipients:
    - scott@smd.services
  failure_recipients:
    - team@smd.services
  # Request cards and the email to SMD say who wrote and what happened, never
  # the words: a representative's messages are not copied into SMD's mailbox.
  request_card_text: false

# ---- SAFETY ----
# On SMD's key: the runaway guard, the same caps as SMD's own scott seat.
safety:
  sticky_stop:
    cost_cap_daily_cents: 1000
    inbound_daily_cap: 100

# ---- INVITE-CODE ENROLLMENT (ADR 0106) ----
# A person holding an invite code emails this seat from an address not listed
# above, with the code in the message; the seat checks it in code before any
# model sees the message, lists the address, sends a fixed welcome and tells
# SMD. Codes come from an administrator emailing "I need a code for <name>"
# (or SMD's sender_enrollment_cli on the seat); only salted hashes are kept, on
# the seat, never here. Accepted on guide seats only (both validators).
sender_enrollment:
  enabled: true
  # Emails a day from one enrolled person before the seat stops answering them
  # until tomorrow, with one fixed notice (Captain, 2026-11-10: 60). It ends a
  # mail loop and keeps one person from using the whole seat's day
  # (safety.sticky_stop.inbound_daily_cap). Administrators are exempt.
  daily_limit: 60

# ---- TELEGRAM (chat) ----
# Chat, mainly so pitch practice runs turn by turn. Per-seat bot (BotFather);
# its token is staged as the Fly secret TELEGRAM_BOT_TOKEN on hermes-smd-guide
# at provisioning, never here (docs/runbooks/hosted-agent/concierge.md step 5).
# The allowlist is MANDATORY: an empty one fails OPEN (ADR 0033; the validator
# refuses it and ensure-telegram-allowlist.py refuses the boot). The one id is
# the Captain's own, as bound to him in operator/customers/captain-mark
# (people p2, telegram_id) and already allow-listed on SMD's scott seat. A
# representative's numeric id is added here by a reviewed PR once known.
# OFF for first boot (Captain, 2026-11-09): no bot exists yet, and a seat with
# chat enabled and no bot token does not boot. Email carries both skills. Turn
# it on by a reviewed PR once the bot is created and its token is vaulted.
telegram:
  enabled: false
  allow_from:
    - '7367659986'

# ---- MEMORY (isolation invariants; must match customer_id) ----
# The native memory stores are off: every answer comes from the library, and
# nothing one representative says may shape another's answer.
memory:
  d1_namespace: smd-guide
  r2_vault_path: 'vaults/smd-guide/'
  vectorize_index: 'hermes-smd-guide-vault'
  memory_enabled: false
  # Per-sender memory is off too: what a representative keeps lives only in
  # the walled record stores below, which removal purges.
  peer_memory_enabled: false
  user_profile_enabled: false

# ---- RECORD STORES (ADR 0106 amendment, issue #3946) ----
# Walled per person: each enrolled representative's records sit in their own
# directory, named by code from the verified sender; nobody reads across.
# `managed` stores are written by code only, never by the model. Removing a
# person (sender_enrollment_cli remove) purges their directory in every store.
record_stores:
  # Lessons completed, quiz result, practice answered, readiness. Ids and
  # counts only. The weekly report to administrators is rendered from this.
  - name: rep-progress
    path: /opt/data/rep/progress
    partition: sender
    managed: true
  # What a representative asks the guide to keep. Theirs alone.
  - name: rep-notes
    path: /opt/data/rep/notes
    partition: sender
  - name: rep-leads
    path: /opt/data/rep/leads
    partition: sender
  # Dated reminders and the per-day digest mark. Written by code only
  # (reminder_set resolves and checks the date).
  - name: rep-reminders
    path: /opt/data/rep/reminders
    partition: sender
    managed: true
