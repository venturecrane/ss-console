# Boot-log lines the boot harness tolerates (judge.py check boot-log-clean).
#
# Every entry is a regex AND the reason it is not a defect. An entry without a
# reason fails to load. Add one only after reading the line on a real harness
# boot and establishing that it is an artifact of the harness (dummy secrets,
# dead R2 endpoint, no volume) or a known pre-existing fleet-wide line, never a
# new seat defect; name the run it was seen on. A traceback is matched as its
# whole block (the line before it plus the 40 after), so a rule names the
# exact failure, never "any traceback".
allow:
  - pattern: '\[entrypoint\] ERROR: the (demand|drafting|litigation|casefile|marketing|negotiation) firm inputs could not be fetched from the vault for boot-harness and this seat has no copy'
    reason: >-
      Harness artifact: R2 is pointed at a dead loopback port, so every lane's firm-input
      fetch fails, and the lane defers by design. Seen on the known-good calibration run
      of rel-4cd01e8e-202610280041.
  - pattern: 'ERROR __main__ (spec_applier|skills_applier): (preference )?boot fetch failed .*http://127\.0\.0\.1:9/'
    reason: >-
      Harness artifact: the root spec and skills appliers' boot fetch names the dead
      harness R2 endpoint (127.0.0.1:9); both are fail-static by design. Seen on the
      known-good calibration run of rel-4cd01e8e-202610280041.
