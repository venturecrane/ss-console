# The couples role (ADR 0090): a hosted agent a couple shares.
#
# A role is a packaged hosted-agent job. A seat selects it with
# `seat.role: couples`; `seat.product` stays `hosted-agent`. This file is the
# package manifest: what the job is made of, so the next couple's seat is
# generated from it rather than hand-copied from the last one.
#
# Privacy is by space (ADR 0091). Each partner talks to the agent privately,
# and both talk to it together in one shared Telegram group. A turn in one
# partner's space reads that partner's items plus shared ones; a turn in the
# shared space reads shared items only; no turn reads the other partner's space.
#
# Kept in step with the seat template by tests/couples-role.test.ts: every skill
# and routine named here appears in operator/customers/_couples-template, and
# every `built:` flag below matches whether operator/skills/<name>/SKILL.md exists.

role: couples
schema_version: 1

# The agent's persona prompt and its safety rules.
persona: persona.md

# The template a seat's customer.yaml is generated from.
seat_template: operator/customers/_couples-template/customer.yaml

# Skills the role's persona carries. `built: false` means the skill body does
# not exist yet under operator/skills/. An enabled skill with no body fails the
# seat's boot (overlay translate _install_persona_skills), so a seat cannot be
# provisioned from this role until every enabled skill is built.
skills:
  - name: calendar
    built: true
    purpose: The shared calendar the agent owns, sent to both partners as invites (ADR 0092).
  - name: workspace
    built: true
    purpose: Shared documents and the shared folder, in the owner partner's Google account.
  - name: inbox-triage
    built: true
    purpose: Each partner's approved email to the agent, answered privately to that partner.
  - name: couples-checkin
    built: false
    purpose: Private check-in nudges on topics the couple authors together, per person cadence and quiet hours.
  - name: gratitude-prompts
    built: false
    purpose: Gratitude prompts, delivered to each partner privately.
  - name: dates-to-remember
    built: false
    purpose: Dates to remember, with gift lists kept private to one partner.
  - name: date-night-planner
    built: false
    purpose: Date ideas with a tried, loved, skip history.
  - name: travel
    built: false
    purpose: Itineraries from forwarded confirmations, packing lists, passport expiry, price watches.
  - name: shared-lists
    built: false
    purpose: Shared lists, chores, expenses and renewals.
  - name: weekly-checkin-agenda
    built: false
    purpose: An agenda for the weekly joint check-in, built only from what each partner chose to share.
  - name: memory-journal
    built: false
    purpose: Photos and notes from the shared group, kept in the shared folder.

# Default routines. Every routine names its space: the space the run reads and
# the chat it is delivered to (`person:<id>` delivers to that partner's DM,
# `shared` to the group). Schedules are UTC and are set per couple from the
# joint onboarding section.
routines:
  - skill: couples-checkin
    space: person:p1
    schedule_from: joint.checkin_cadence (partner 1)
  - skill: couples-checkin
    space: person:p2
    schedule_from: joint.checkin_cadence (partner 2)

privacy:
  model: spaces
  spaces: [shared, person]
  adr: docs/adr/0091-privacy-by-space-for-multi-person-seats.md
  # The seat-level config this model requires. The validator enforces it for
  # any seat that authors people: (src/lib/operator/customer-yaml/sections-people.ts).
  requires:
    - people
    - spaces
    - memory.memory_enabled false
    - memory.user_profile_enabled false
    - a space on every routine

# Connections the role needs at launch. None: the calendar is the agent's own
# and reaches the partners as invites through the seat's own inbox (ADR 0092).
# Google (shared documents) is optional and connected by the owner partner.
required_connections: []
optional_connections:
  - name: google
    connected_by: owner partner
    used_for: shared documents and the shared folder

# What onboarding collects. `per_person` fields are asked of each partner;
# `joint` fields are not final until both partners confirm (ADR 0090 decision 4).
onboarding:
  per_person:
    - field: name
      maps_to: people[].name
    - field: email
      maps_to: people[].email and scope.inbound_allow_from
    - field: consent
      maps_to: none (recorded by onboarding, not in customer.yaml)
    - field: telegram
      maps_to: people[].telegram_id, telegram.allow_from, telegram.group_allow_from
      note: bound by a single-use deep link, written through the reviewed customer.yaml change (ADR 0091 section 5)
  joint:
    - field: timezone
      maps_to: routine schedules (expressed in UTC)
    - field: checkin_topics
      maps_to: couples-checkin
    - field: checkin_cadence
      maps_to: routines[].schedule, per partner
    - field: quiet_hours
      maps_to: couples-checkin
    - field: shared_group
      maps_to: spaces.shared_telegram_chat and telegram.group_chats
