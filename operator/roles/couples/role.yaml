# The couples role (ADR 0090): a hosted agent a couple shares.
#
# A role is a packaged hosted-agent job. A seat selects it with
# `seat.role: couples`; `seat.product` stays `hosted-agent`. This file is the
# package manifest: what the job is made of. SMD sets a couple's seat up by
# copying the seat template, filling in the two partners' names and emails
# (`people:`), merging that through a PR and reprovisioning. Everything after
# that, settings and schedules included, happens in conversation with the
# agent over its channels (email; Telegram later). There is no web setup.
#
# Privacy is by space (ADR 0091). Each partner talks to the agent privately,
# and both talk to it together in one shared Telegram group. A turn in one
# partner's space reads that partner's items plus shared ones; a turn in the
# shared space reads shared items only; no turn reads the other partner's space.
#
# Kept in step with the seat template by tests/couples-role.test.ts: every skill
# and routine named here appears in operator/customers/_couples-template, and
# every `built:` flag below matches whether operator/skills/<name>/SKILL.md exists.

role: couples
schema_version: 1

# The agent's persona prompt and its safety rules.
persona: persona.md

# The template a seat's customer.yaml is copied from.
seat_template: operator/customers/_couples-template/customer.yaml

# Skills the role's persona carries. `built: false` would mean the skill body
# does not exist yet under operator/skills/. An enabled skill with no body fails
# the seat's boot (overlay translate _install_persona_skills), so a seat cannot
# be provisioned from this role until every enabled skill is built.
skills:
  - name: calendar
    built: true
    settings:
      recipients: roster
    purpose: The shared calendar the agent owns, sent to both partners as invites (ADR 0092).
  - name: workspace
    built: true
    purpose: Shared documents and the shared folder, in the owner partner's Google account.
  - name: inbox-triage
    built: true
    purpose: Each partner's approved email to the agent, answered privately to that partner.
  - name: couples-checkin
    built: true
    settings:
      recipients: roster
    purpose: Check-in nudges on topics the couple chooses, per person cadence and quiet hours.
  - name: couples-settings
    built: true
    purpose: The couple's schedules and settings, set by talking to the agent; either partner changes anything alone.
  - name: gratitude-prompts
    built: true
    settings:
      recipients: roster
    purpose: Gratitude prompts, delivered to each partner privately.
  - name: dates-to-remember
    built: true
    settings:
      recipients: roster
    purpose: Dates to remember, with gift lists kept private to one partner.
  - name: date-night-planner
    built: true
    purpose: Date ideas with a tried, loved, skip history.
  - name: travel
    built: true
    settings:
      recipients: roster
    purpose: Itineraries from forwarded confirmations, packing lists, passport expiry, price watches.
  - name: shared-lists
    built: true
    purpose: Shared lists, chores, expenses and renewals.
  - name: weekly-checkin-agenda
    built: true
    settings:
      recipients: roster
    purpose: An agenda for the weekly joint check-in, built only from what each partner chose to share.
  - name: memory-journal
    built: true
    purpose: A dated journal of moments, in the couple's words. Text only; photos stay in the Telegram chat.

# `settings.recipients: roster` puts a skill's sends on its roster lane: the
# broker admits only the seat's rostered addresses, which on this role are
# exactly the two partners (validator rule 8, sections-people.ts). Every skill
# that sends on a schedule or carries the seat's two-person notices authors it;
# the overlay's cron email delivery also locks recipients in code.

# Schedules are set by the couple in conversation, never authored here or in
# the seat's customer.yaml (skill couples-settings; overlay tool
# couples_settings_change, state on the seat's volume). Nothing is scheduled
# until the couple asks. At boot the overlay registers one slot job per entry
# below, per person for `space: person` and once for `space: shared`
# (overlay shared/couples_slots.py, which must list the same skills in
# couples_settings.KINDS); every quarter hour the slot's gate runs whichever of
# the couple's routines is due in the couple's own timezone, honouring quiet
# hours and pauses. Who it reaches is the slot's space, never an address.
# Validator rule 9 refuses an authored cron entry for any skill here.
slots:
  - skill: couples-checkin
    space: person
  - skill: gratitude-prompts
    space: person
  # A private reminder ahead of each shared date, with that partner's own gift
  # ideas, as many days ahead as that partner chose.
  - skill: dates-to-remember
    space: person
  # Price watches the couple asked for, reported to both. Silent when no watch
  # is active or none is under its target.
  - skill: travel
    space: shared
  - skill: weekly-checkin-agenda
    space: shared

# Record stores the skills use, all private per space (owner_field: owner, a
# person id or `shared`), none with readers (ADR 0091 rule 7). Authored in the
# seat template under record_stores.
record_stores:
  - couples-checkin
  - gratitude
  - dates
  - date-nights
  - trips
  - lists
  - journal

privacy:
  model: spaces
  spaces: [shared, person]
  adr: docs/adr/0091-privacy-by-space-for-multi-person-seats.md
  # The seat-level config this model requires. The validator enforces it for
  # any seat that authors people: (src/lib/operator/customer-yaml/sections-people.ts).
  requires:
    - people
    - spaces
    - memory.memory_enabled false
    - memory.user_profile_enabled false
    - a space on every routine
    - no authored cron for a slot skill (rule 9)

# Connections the role needs at launch. None: the calendar is the agent's own
# and reaches the partners as invites through the seat's own inbox (ADR 0092).
# Google (shared documents) is optional and connected by the owner partner.
required_connections: []
optional_connections:
  - name: google
    connected_by: owner partner
    used_for: shared documents and the shared folder

# What this role's seats may send, beyond the platform default (ADR 0093).
# Read by the overlay's policy resolver from the image (COPY operator/roles/),
# so it always ships with the code that reads it. Floors stay in code and are
# not authorable here: SSN, A-number, receipt number, case number and a case
# number paired with a date block on every seat. Every value looser than the
# default needs the rationale and the ADR below (tests/role-policy.test.ts), and
# any change here moves the seat x gate matrix (tests/policy-matrix.test.ts).
policy:
  identifier_gate:
    recurring_dates: verify_by_month_day
    provenance_sources:
      - calendar_invite_list
      - couples_settings_read
  output_checklist:
    profile: household
  rationale: >-
    A couples seat reminds the couple of their own recorded birthdays and
    anniversaries, whose next occurrence falls in a year nobody wrote down; a
    date verifies only when its month and day match a date read from the seat's
    own record store this session, so invented dates stay blocked. Its
    scheduled routines also send invites and reminders for dates the couple set
    through the agent itself, so reads of the seat's own invite list and
    settings count as a source for those dates (cron-created recurring invites
    were refused on captain-mark 2026-10-19). Its sends are
    household notes between two partners, so paralegal wording rules
    (exclamation marks, unknown all-caps words) do not apply.
  adr: docs/adr/0093-seat-policy-profiles.md
