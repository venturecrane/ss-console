schema_version: 1

# TEMPLATE customer.yaml for a firm with NO external practice-management
# system (paper + Outlook + OneDrive + QuickBooks for billing). This is
# the most common state at the target-buyer profile -- most prospects we
# meet have no working PM system at all.
#
# Default capability bindings (vendor-direct-MCP-first per ADR 0020):
#
#   PracticeManagement -> synthetic:no_pm        (per-customer D1+R2 substrate)
#   Email              -> mcp:m365-mail          (first-party MS hosted MCP)
#   Calendar           -> mcp:m365-calendar      (first-party MS hosted MCP)
#   DocumentStorage    -> build:microsoft_graph  (OneDrive — no MS MCP yet)
#   ESign              -> build:docusign         (MCP is Beta — pilot in parallel)
#   Accounting         -> mcp:quickbooks-intuit  (first-party Intuit MCP, gold standard)
#
# Adapter implementations referenced above either ship (no_pm), use a
# vendor-maintained MCP server (no SMD code), or are tracked under named
# build-adapter issues. The bindings are wire contracts; flipping any
# binding to a different vendor later is a customer.yaml edit, not a
# skill rewrite (per ADR 0006 capability-adapter pattern).
#
# Copy this file to operator/customers/{firm-slug}/customer.yaml, then
# replace every bracketed value. Validate with the canonical TS validator
# (per ADR 0019):
#
#   npx tsx scripts/validate-customer-yaml.ts \
#     operator/customers/{firm-slug}/customer.yaml
#
# The reserved `_template` directory is never a real customer slug.
# customer_id must equal the directory name and match ^[a-z0-9][a-z0-9-]{0,31}$.

# ---- IDENTITY ----
customer_id: '[FIRM-SLUG]'
customer_name: '[LEGAL NAME]'
vertical: law-firm
practice_areas:
  - '[PRIMARY PRACTICE AREA, e.g., personal-injury-plaintiff]'
fly_region: '[FLY REGION SLUG, e.g., iad / lax / ord]'

# ---- RUNTIME ----
model: claude-opus-4-7

machine:
  size: shared-cpu-1x
  memory_mb: 1024

# ---- HUMANS WITH PORTAL ACCESS ----
users:
  - email: '[PRINCIPAL EMAIL]'
    role: principal
    full_name: '[PRINCIPAL FULL NAME]'

# ---- PERSONAS (length >= 1) ----
personas:
  - slug: '[PERSONA SLUG, e.g., marcus]'
    status: active
    name: '[PERSONA FIRST NAME]'
    title: AI Associate
    tone:
      - plainspoken
      - warm-but-professional
      - concise
    entitlements:
      exposure:
        internal_write: draft_for_review
        external_send: draft_for_review
    skills:
      - name: '[LEAD SKILL NAME]'
        version: pending
        initiation:
          manual: true
          scheduled: false
          webhook: false
        enabled: true

# ---- CONNECTORS ----
# No-PM-system stack. Bindings follow the vendor-direct-MCP-first matrix
# locked in ADR 0020 (Connector Strategy, 2026-05-24). Replace any binding
# with a real vendor adapter during the assessment call if the firm uses
# one (e.g. swap accounting.adapter to xero if the firm is on Xero, not
# QuickBooks — `mcp:xero-official` is the right backend for that case per
# ADR 0020).
#
# Backend-prefix decision order per ADR 0020:
#   1. mcp:<server>       — vendor-direct MCP first (default when available)
#   2. mcp:<community>    — vetted community MCP (light review per ADR 0020)
#   3. build:<vendor>     — Python adapter we maintain (no acceptable MCP, or
#                            trust-ceiling enforcement we own end-to-end; also
#                            the fallback for long-tail vendors with no MCP)
#   4. synthetic:<name>   — in-process substrate (no_pm for this template)
# (Composio is dropped per the ADR 0020 2026-05-30 revision; no composio: backend.)
connectors:
  PracticeManagement:
    adapter: no_pm
    backend: synthetic:no_pm
    enabled: true
    # No token_ref -- the synthetic store has no external OAuth surface.
    # Per-customer D1 + R2 wiring is applied at provision time.

  Email:
    # ADR 0020: first-party Microsoft hosted MCP, per-tenant URL
    # /agents/tenants/{tenant_id}/servers/mcp_MailTools at
    # agent365.svc.cloud.microsoft. Auth via Microsoft Entra tenant ID.
    adapter: m365-mail
    backend: mcp:m365-mail
    enabled: true
    scopes:
      - 'Mail.Read'
      - 'Mail.ReadWrite'
    # Per-tenant Entra auth — the token_ref points at the customer's tenant
    # ID, not a refresh token. The hosted MCP brokers the OAuth flow.
    token_ref: 'infisical:/operator/[FIRM-SLUG]/email/microsoft-entra-tenant-id'

  Calendar:
    # ADR 0020: first-party Microsoft hosted MCP,
    # /servers/mcp_CalendarTools. Same per-tenant Entra auth as Email.
    adapter: m365-calendar
    backend: mcp:m365-calendar
    enabled: true
    scopes:
      - 'Calendars.Read'
      - 'Calendars.ReadWrite'
    # Same tenant ID as Email — the customer's M365 tenant.
    token_ref: 'infisical:/operator/[FIRM-SLUG]/email/microsoft-entra-tenant-id'

  DocumentStorage:
    # ADR 0020 / ADR 0021 Stream F: Microsoft has
    # not shipped a first-party M365 MCP for OneDrive/SharePoint
    # (Mail/Calendar/Teams/User/Copilot Chat only). The community
    # mcp:softeria/ms-365-mcp-server (MIT) covers the OneDrive Files
    # surface (read + read/write inside the agent's AppFolder).
    # Migrated 2026-05-25 — see PR #1080. The BUILD adapter at
    # operator/connectors/ms_graph/ is retired in the Wave-4 removal
    # PR.
    #
    # Fallback: if the community MCP turns out unsuitable for a specific
    # customer, document the regression with a Captain decision and
    # bind backend: build:microsoft_graph instead. The BUILD adapter is
    # removed from the tree in Wave 4 so any fallback must restore it
    # from git history; that is the desired friction.
    adapter: ms-365
    backend: mcp:softeria/ms-365-mcp-server
    enabled: true
    scopes:
      - 'Files.Read'
      - 'Files.ReadWrite.AppFolder'
    # OneDrive uses the standard Microsoft Graph OAuth refresh-token path.
    # The community MCP server reads from the same token surface as the
    # retired BUILD adapter; the token_ref name stays for continuity.
    token_ref: 'infisical:/operator/[FIRM-SLUG]/document-storage/microsoft-graph-oauth-refresh'

  ESign:
    # ADR 0020: DocuSign shipped an MCP server in Beta on 2026-04-28.
    # Per ADR 0020 §"ESign": "Hold build adapter as prod path; pilot the
    # MCP; cut over at GA." When the DocuSign MCP graduates to GA and we
    # have a customer to pilot against, the binding becomes
    # `backend: mcp:docusign-official` (read
    # https://developers.docusign.com/platform/mcp-server/ before binding
    # to verify the endpoint and auth model).
    adapter: docusign
    backend: build:docusign
    enabled: true
    scopes:
      - 'signature'
      - 'impersonation'
    token_ref: 'infisical:/operator/[FIRM-SLUG]/e-sign/docusign-oauth-refresh'

  Accounting:
    # ADR 0020: first-party Intuit MCP (Apache-2.0, 144 tools, 29 entities).
    # The gold-standard MCP profile in the matrix; default for any
    # QuickBooks Online customer. Per-customer OAuth managed by Intuit.
    adapter: quickbooks-intuit
    backend: mcp:quickbooks-intuit
    enabled: true
    scopes:
      - 'com.intuit.quickbooks.accounting'
    token_ref: 'infisical:/operator/[FIRM-SLUG]/accounting/quickbooks-oauth-refresh'

# ---- SCOPE ----
scope:
  email_folders_visible:
    - Inbox
    - Sent
  email_folders_blind: []
  email_keyword_blocks: []
  domain_blocks: []

# ---- ESCALATION ----
escalation:
  red_flag_recipients:
    - '[PRINCIPAL EMAIL]'
  failure_recipients:
    - '[PRINCIPAL EMAIL]'

# ---- VOICE LIBRARY ----
voice_library:
  samples_path: 'r2://vaults/[FIRM-SLUG]/voice/samples/'

# ---- MEMORY (isolation invariants; must match customer_id) ----
memory:
  d1_namespace: '[FIRM-SLUG]'
  r2_vault_path: 'vaults/[FIRM-SLUG]/'
  vectorize_index: 'hermes-[FIRM-SLUG]-vault'
