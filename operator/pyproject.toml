# The Python operator tree as one project (2026-09-10, code review Code
# Quality 7 and Architecture 2).
#
# WHY. 451 Python files, no root manifest, no type checker, no formatter, and
# 33 `sys.path.insert` shims plus 130 `# noqa: E402` paying for the missing
# packaging. The three leaf subtrees that do carry a pyproject
# (connectors/_sdk, connectors/*, runners/medchron) prove the pattern works
# here; this file extends it to the root so CI installs the tree as packages
# and pyright has a project to check.
#
# STAGE 1 (2026-09-10): `uv pip install -e .` in the substrate job makes
# `adapter`, `workspace_broker`, `bin` importable as packages in CI; the shims
# stayed.
#
# STAGE 2 (2026-09-14): the shims that only put THIS tree's root on sys.path
# so a package import would resolve are gone (audit-chain-watch, verify-audit-
# chain, the voice corpus CLIs, bin/lib/evidence, bin/lib/decommission_cli,
# rehearsal/run), together with their E402 suppressions. Three things carry
# what the shims carried: this project installed editable (CI's substrate job
# and every workflow that runs one of those CLIs), `pythonpath = .` in
# pytest.ini for a bare local pytest, and, on a laptop, one
# `python3 -m pip install -e operator` (docs/handbook/building-the-platform).
# `rehearsal` joined the package list for the same reason.
#
# STAGE 3 (2026-09-14): bin/lib's bare-name family is imported as
# `bin.lib.*` everywhere (the reconcilers, overlay-ref-drift, gen-env-arrays,
# seed-staging-matter, sender_class via `workspace_broker.recipient_policy`,
# send_verify's siblings by relative import), the tests import the same
# names, and the three scheduled workflows that run a reconciler install the
# project first. rehearsal/drivers.py still loads the dashed scripts by path,
# because a dash is not an importable name, but no longer edits sys.path.
#
# STAGE 4 (2026-09-14): the seat side. `safety-substrate/` became the package
# `safety_substrate/` (the hyphen had kept every module in it on bare-name
# imports behind a shim); its modules and tests import each other and adapter
# by package name. On the seat, bootstrap.sh and entrypoint.sh run the three
# invariant invocations with PYTHONPATH=/app, which is where this tree and
# adapter/ are copied. The two /opt/connectors/smokeball shims (medchron
# seat.py's ssh script, drafting/corpus_measure.py) were inert: that path
# holds only the connector's venv, and both already run under an interpreter
# that has the connector installed. Proven by a reprovision (boot smoke step 8
# is the invariant run).
#
# STILL SHIMMED, on purpose, and why:
#   * bin/voice-fetch-corpus.py and bin/voice-survey-corpus.py put
#     connectors/smokeball on the path for the real extractor: that is a
#     separate distributable (connectors/smokeball/pyproject.toml), not this
#     project, so those two go with the connector install story.
#   * customers/pilot-smokeball's seed and l2 scripts insert their own
#     directory to import a sibling: the ordinary run-as-a-file idiom under a
#     dashed customer directory that cannot be a package path, not a packaging
#     gap in this project.

[project]
name = "smd-operator"
version = "0.0.0"
description = "SMD Operator control-plane tooling: broker, adapter, provisioning CLIs. Not published; installed editable into CI and, in the follow-up, into the seat's broker venv."
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["adapter", "workspace_broker", "bin", "rehearsal", "safety_substrate"]

# pyright, basic mode, ratcheted. bin/pyright-ratchet.py compares a
# `pyright --outputjson` report against contracts/operator-pyright-baseline.json
# (errors per file) and fails on any file whose count grew; the baseline only
# tightens. Tests are excluded: the baseline is about production code, and the
# tests' fixture shapes would triple the count without changing what ships.
# Third-party imports that are absent from the CI venv (anthropic, pymupdf,
# httpx, boto3, the Hermes runtime) report as warnings, not errors, so the
# error count measures our code, not the venv.
[tool.pyright]
include = ["adapter", "safety_substrate", "workspace_broker", "bin", "skills", "runners", "templates", "rehearsal"]
exclude = ["**/.venv", "**/__pycache__", "**/tests", "**/test_*.py", "**/.rendered", "**/node_modules"]
typeCheckingMode = "basic"
pythonVersion = "3.11"
pythonPlatform = "Linux"
reportMissingImports = "warning"
reportMissingModuleSource = "none"
