# closeout-seed.yaml - the single authored source for the Settlement Closeout
# proving data (ss #2455).
#
# WHY ONE SOURCE. Two artifacts are generated from this file by render_seed.py:
#
#   1. KEYING-SHEET.md   - what a person enters into the Smokeball STAGING sandbox
#                          by hand. layouts/write is not a granted scope
#                          (vfy_01M0DVZGZVTHN6G911NZFP136A), so settlement detail
#                          cannot be seeded through the API by any path.
#   2. wire/*.json       - canned GET /matters/{id}/layouts payloads for the
#                          offline tests.
#
# Because both come from here, the sandbox and the test fixtures cannot drift
# apart, and the read-back reconciliation probe can report per-field differences
# and say whether a mismatch was a misread or a keying slip.
#
# SHAPE PROVENANCE. Every key name below was observed on A&P production layouts
# in a read-only probe (vfy_01M0DXZ33QCTE7R58GF2WJ1ZB1), never invented. That
# matters: an invented field once taught a skill to gate on a branch that could
# never fire, which is why the connector fixtures carry the same rule.
#
# DISPOSITION. These are permanent fixture matters in a staging tenant SMD
# controls, not probe artifacts in a client tenant, so the ss #2403
# stamp-and-teardown contract does not apply. Stated explicitly because silence
# on that question is the thing the contract exists to prevent.
#
# NOT REPRESENTED HERE, ON PURPOSE. Real A&P matter numbers are bare digits
# (201537, 4853) which do NOT match the connector's _MATTER_NUMBER_RE, so its
# cross-matter write guard cannot fire on that tenant at all. That is a defect
# with its own issue, not a shape this seed should imitate; the sandbox uses the
# hyphenated format so the guard behaves here the way it is meant to.

version: 1
tenant: smokeball-staging
seat: pilot-smokeball
issue: 2455

# Providers referenced by matters below. MatterEntityId is the stable per-provider
# identifier the obligation ledger keys on. A misspelled provider is a DIFFERENT
# contact record in the practice-management system and therefore carries a
# DIFFERENT entity id - which is exactly why cross-matter provider rollup cannot
# be done on the id alone, and why the near-duplicate pass is a proposal a person
# confirms rather than a silent merge.
