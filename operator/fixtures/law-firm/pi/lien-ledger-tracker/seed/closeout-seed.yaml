# Shapes deliberately NOT keyed by hand. Each is exercised by an offline fixture
# generated from this same file, because none of them needs a live tenant to be
# true and each is a data-entry slip waiting to happen.
fixture_only:
  - id: F-negative-balance
    note: a provider whose InvoiceBalance is negative; 2 exist in the real portfolio
  - id: F-blank-service-dates
    note: service dates absent on every provider row; 71% of real rows
  - id: F-lien-and-final-populated
    note: LienAmount and FinalAmount both set; 7 of 347 real rows
  - id: F-page-truncation
    note: >-
      a 500-row listing page, asserting the truncation fail-open fires and is
      stated on the register rather than silently trusted
  - id: F-caption-budget
    note: >-
      a listing with more than 40 distinct client contacts, asserting the
      caption-coverage shortfall is counted and reported (the connector bounds
      caption enrichment at 40 per response and a truncated list is
      byte-identical to a complete one)
  - id: F-typo-fixed-after-chase-3
    note: >-
      a provider name corrected after three chases; the identity migration must
      carry the attempt count forward rather than restart at chase 1
