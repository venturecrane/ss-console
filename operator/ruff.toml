# Ruff configuration for the Python operator tree.
#
# WHY THIS EXISTS. Before this file (2026-08-24), `operator/` carried 261
# `# noqa` annotations for a linter that never ran; every one was inert.
# This file is the missing half, and it is A GATE, NOT A BASELINE: every rule
# selected below reports zero violations across the tree, so it blocks new
# violations outright rather than freezing a debt pile.
#
# 2026-09-10 (code review, Code Quality 6). Three rules were added and the
# suppression pile was made honest in the same change:
#   * BLE001 and F401 are enabled. The 210 BLE001 and 28 F401 suppressions
#     that already existed now mean something; the 11 uncovered blind-excepts
#     and 47 unused imports were fixed at the site.
#   * RUF100 (unused-noqa) is enabled, so a `# noqa` naming a rule ruff does
#     not enable is a lint error, not prose. 88 inert annotations left the
#     tree; the ~25 that named ANN001, SLF001, F403, F841, ARG002 are gone.
#   * bin/noqa-reasons.py (run in operator-substrate.yml) requires every
#     surviving suppression to carry ` - ` and a reason of 20+ characters.
#     Do NOT add a blanket `# noqa` to widen this selection: that trades a real
#     gate for the appearance of one, which is the failure this file exists
#     to end.
#
# WHAT IS STILL NOT SELECTED, AND WHY (counts as ALL / NON-TEST, 2026-08-24
# unless noted). Each fires today, so selecting it needs a reason at every
# uncovered site, not an allowlist:
#
#   S101   4889 / —     assert. Correct in pytest; would need a test-file carve-out.
#   E501   2119 / —     line-too-long. `ruff format` at line-length 120 is the
#                       companion change (wave 2b); E501 follows it.
#   ANN001 1287 / —     missing arg annotations. pyright (pyproject.toml,
#                       ratcheted) is the type gate now.
#   SLF001  166 / 9     private-member-access.
#   S106     62 / 0     hardcoded-password-func-arg — every hit is in a test.
#   ARG002   36 / 5     unused method argument.
#   S310     30 / 25    suspicious-url-open.      } listed under `external`
#   S603     29 / 18    subprocess-without-shell. } below so their existing,
#   S608     11 / 8     hardcoded-sql-expression. } reasoned noqa survive.
#   S105     21 / 13    hardcoded-password-string.
#   S110     14 / 14    try-except-pass.
#   S103      6 / 1     bad-file-permissions.
#
# CI pins ruff 0.15.17 (operator-substrate.yml). Check locally with the same
# version (`uvx ruff@0.15.17 check .`): RUF100 follows each version's BLE001
# exemptions, so a different local version can disagree with the gate at a
# handful of logged handlers.
#
# Complexity (C901) and function length are NOT ruff-selected either: they are
# ratcheted per function by bin/tests/test_function_size_ratchet.py from
# contracts/operator-function-size.json, the same shape as the module-size
# ratchet, so the 32 + 51 existing entries can only shrink.

target-version = "py311"

# Vendored virtualenvs and caches are not our source.
extend-exclude = [
    "**/.venv",
    "**/__pycache__",
    "**/.pytest_cache",
    "**/.ruff_cache",
]

[lint]
# Rules ruff does NOT enable here but whose `# noqa` annotations are kept on
# purpose: the nine S310 / S603 / S608 suppressions carry the tree's written
# security reasoning (why a URL open, a subprocess, or an inlined SQL literal is
# safe at that site). RUF100 would otherwise delete them as inert. Listing them
# here keeps them, and the noqa-reasons gate (bin/noqa-reasons.py) still
# requires each to carry its reason. Enabling the three rules outright is the
# follow-up; it needs a reason at every uncovered site (S310 25, S603 18, S608 8
# on 2026-09-10), not a blanket noqa.
external = ["S310", "S603", "S608"]

select = [
    "E4", # import placement — activates the E402 suppressions on the sys.path shims
    "E7", # statement-level pycodestyle, incl. E731 lambda-assignment
    "E9", # syntax and IO errors ruff cannot parse past
    "S102", # exec-builtin — activates the 2 existing suppressions
    # 2026-09-10 (code review, Code Quality 6): the three rules that turn the
    # suppression pile from prose into a gate.
    "BLE001", # blind-except: 210 suppressions already existed for a rule that never ran
    "F401", # unused-import: highest value per edit; 28 suppressions were already in place
    "RUF100", # unused-noqa: a `# noqa` naming a rule ruff does not enable is deleted, not kept
]
