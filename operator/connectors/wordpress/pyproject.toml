[project]
name = "wordpress-connector"
version = "0.1.0"
description = "Author-built MCP connector for a firm's WordPress site: reads, media upload, and pending (never published) posts over an Application Password."
requires-python = ">=3.11"
dependencies = [
    "operator-connector-sdk",
    "httpx>=0.27",
    # Not imported here: the advertising gate this connector runs as a
    # subprocess with ITS interpreter reads the firm registers YAML, and
    # without PyYAML it fails closed on every post.
    "pyyaml>=6",
]

# The console-script the overlay registry launches as `command`
# (/opt/connectors/wordpress/.venv/bin/wordpress-mcp).
[project.scripts]
wordpress-mcp = "wordpress_connector.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wordpress_connector"]
