[project]
name = "operator-records-contract"
version = "0.1.0"
description = "The matter-records contract shared by the Operator overlay (hermes venv) and the records lane (jobs-bundle venv): review rows, reply batches, the facts renderer. NOT published; installed from this path. Stdlib only, by rule."
requires-python = ">=3.11"
# ZERO runtime dependencies, by rule: two venvs with different dependency
# closures install this package, and tests/test_no_dependencies.py proves it
# imports with no site-packages at all.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["records_contract"]

[tool.pytest.ini_options]
testpaths = ["tests"]
