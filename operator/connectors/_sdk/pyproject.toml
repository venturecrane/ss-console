[project]
name = "operator-connector-sdk"
version = "0.1.0"
description = "Minimal SDK + conformance contract for author-built MCP connectors (the Operator connector platform). NOT published — installed from this path into each connector's venv."
requires-python = ">=3.11"
dependencies = [
    # <2 is load-bearing: mcp 2.0.0 (2026-07) renamed mcp.server.fastmcp ->
    # mcp.server.mcpserver, which breaks server.py's import in every venv that
    # resolves latest — CI conformance AND the seat image (Dockerfile installs
    # this SDK from source). Migrating to the 2.x layout is its own change;
    # until then the 1.x line is the contract.
    "mcp>=1.2,<3",
    "pydantic>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["operator_connector_sdk"]
