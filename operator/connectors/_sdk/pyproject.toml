[project]
name = "operator-connector-sdk"
version = "0.1.0"
description = "Minimal SDK + conformance contract for author-built MCP connectors (the Operator connector platform). NOT published — installed from this path into each connector's venv."
requires-python = ">=3.11"
dependencies = [
    # The 2.x line is the contract (migrated 2026-09-15). 2.0 renamed
    # mcp.server.fastmcp.FastMCP -> mcp.server.mcpserver.MCPServer and moved the
    # wire-model attributes to snake_case (Tool.input_schema; the JSON key is
    # still inputSchema), which is what server.py, conformance.py and the
    # connectors' tests are written against. <3 is load-bearing for the same
    # reason <2 was: the next major will rename again, and every venv that
    # resolves latest (CI conformance, the seat image's per-connector venvs and
    # the medchron runner) would break at the import.
    "mcp>=2,<3",
    "pydantic>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["operator_connector_sdk"]
