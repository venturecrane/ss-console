# Vertical pack manifest — REFERENCE TEMPLATE (never a real vertical)
#
# Copy this directory to operator/verticals/<slug>/ and fill it in. The Law
# pack (operator/verticals/law-firm/) is the worked reference; read its
# vertical.yaml and docs/specs/verticals/law-firm.md alongside this.
#
# Schema: docs/specs/operator/vertical-manifest-schema.md (ADR 0022 Stream 1).
# Every list field is required; [] is valid and means "the pack provides none
# of this artifact class." `name` MUST be added to ACCEPTED_VERTICALS in
# src/lib/operator/customer-yaml/types.ts first (and ACCEPTED_ADDONS for addons).

name: '[VERTICAL-SLUG]' # matches ACCEPTED_VERTICALS
version: 0.1.0

# Vertical-level safety floors (free-form slugs). Fail-closed, authored per
# ADR 0037 Tenet 3 / ADR 0025. Name the compliance line for the vertical
# (e.g. a regulated-practice send floor, a privacy boundary).
compliance: []

# Reference persona archetypes (templates, not runtime personas). Usually the
# coordinator seat the pack digitizes.
personas:
  - slug: '[coordinator-archetype]'
    title: '[Coordinator Title]'

# Reuse the shared spine where it fits (inbox-triage, status-report-assembler,
# email-reply). Add vertical-specific skill identifiers; their bodies
# live in hermes-smd-overlay (the first hand-off).
skills: []

# Vertical-default connectors: capability + adapter + backend. MCP-first per
# ADR 0020; use build: only where no acceptable MCP exists; synthetic: for the
# no-system-of-record substrate.
connectors:
  - capability: '[Email|PracticeManagement|Accounting|...]'
    adapter: '[adapter-name]'
    backend: '[mcp:... | build:... | synthetic:...]'

# Connective-artifact templates the pack provides (these are the N=0 proof).
templates: []

# Synthetic test fixtures shipped with the pack.
fixtures: []

# Certification evals the pack must pass before a customer is bound to it.
evals: []
