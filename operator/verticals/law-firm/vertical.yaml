# Vertical pack manifest: law-firm
#
# Schema: docs/specs/operator/vertical-manifest-schema.md (ADR 0022 Stream 1).
# Brief:  docs/specs/verticals/law-firm.md (the skill catalog, connector map,
#         personas, and domain read this manifest declares the identifiers for).
#
# `name` MUST match ACCEPTED_VERTICALS in src/lib/operator/customer-yaml/types.ts
# (law-firm is already registered). All list fields are required; [] is valid.
#
# The intake-and-matter coordinator pack: substance-free connective work across
# a firm's practice-management system, email, calendar, documents, e-sign, and
# trust ledger. Per ADR 0037 the Operator competes with the coordinator hire;
# the PM suite is a connection target, not a competitor.

name: law-firm
version: 0.1.0

# Vertical-level safety floors (free-form slugs). Fail-closed, authored per
# ADR 0037 Tenet 3 / ADR 0025. See the brief's "Compliance floor".
compliance:
  - upl-boundary # connective work only; never legal advice or substance
  - privilege # privileged content stays inside firm surfaces
  - conflict-routing # capture + route to a human; never auto-clear
  - trust-funds-read-only # report trust balances; never move money
  - aba-512-supervision # maps to ABA Model Rule 5.3 / Formal Opinion 512

# Reference persona archetypes (templates, not runtime personas). The seat the
# pack fills, described by role. See the brief's "Personas".
personas:
  - slug: intake-coordinator
    title: Intake & Matter Coordinator
  - slug: paralegal-intake
    title: Paralegal Running Intake & Matters
  - slug: office-manager-intake
    title: Office Manager Handling Intake

# Vertical-default skills. The spine is law-specific (the 2026-06-05 spine
# pass corrected the original "reused as-is" assumption: customer-zero's
# `inbox-triage` and the marketing `status-report-assembler` are other
# verticals' skills, not a generic spine — see wedge.md "Spine"). The twelve
# law-specific skills are specified in the brief's "Skill catalog"; their
# runtime bodies live in operator/skills/.
skills:
  # spine (law-specific)
  - matter-inbox-router # routes inbound mail to the right wedge skill
  - matter-status-digest # assembles the internal Clio matter digest
  # intake
  - new-matter-intake
  - conflict-intake-router # gather + route; never clears
  - consult-scheduler
  # keeping matters moving
  - engagement-letter-chaser
  - trust-balance-nudge # read-only on funds
  - matter-status-responder
  - document-receipt-logger
  - stalled-matter-nudge
  - matter-memo-on-update # auto-logs a who/what/when supervision memo on matter change; internal-only, webhook-driven (matter.updated)
  - matter-document-review # reads matter docs, surfaces highlights/timelines/gaps for an attorney; content-ceiling: surface-only, never drafts work product
  - deadline-and-sol-tracker # tracks authored dates; never computes a limitation
  - deadline-miss-escalator # escalates an approaching/missed authored date; internal-only, cron
  - statute-watch # monthly email of open cases with a statute date in the next three months and nothing filed; internal-only, cron
  # proactive
  - client-matter-digest
  - referral-source-acknowledgment
  - intake-to-system-sync

# Vertical-default connectors (capability + adapter + backend). MCP-first per
# ADR 0020; the pilot's system of record (Clio) has an MCP, so the pilot needs
# no BUILD adapter. Payments/IntakeCRM are BUILD (the overlay hand-off).
connectors:
  - capability: PracticeManagement
    adapter: clio
    backend: 'mcp:clio-oktopeak'
  - capability: Email
    adapter: m365-mail
    backend: 'mcp:m365-mail'
  - capability: Calendar
    adapter: m365-calendar
    backend: 'mcp:m365-calendar'
  - capability: DocumentStorage
    adapter: ms-365
    backend: 'mcp:softeria/ms-365-mcp-server'
  - capability: ESign
    adapter: docusign
    backend: 'build:docusign'
  - capability: Payments
    adapter: lawpay
    backend: 'build:lawpay' # trust-account writes owned; read-only here
  - capability: IntakeCRM
    adapter: clio-grow
    backend: 'build:clio-grow'

# Connective-artifact templates the pack provides (the N=0 proof; see
# fixtures/n0-deliverability-proof.md).
templates:
  - intake-acknowledgment.md
  - consult-booking.md
  - engagement-letter-chase.md
  - matter-status-update.md
  - document-received-log.md
  - trust-replenishment-request.md
  - stalled-matter-followup.md

# Synthetic test fixtures shipped with the pack.
fixtures:
  - synthetic-intake-immigration
  - synthetic-matter-estate-simple

# Certification evals the pack must pass before a customer is bound to it.
evals:
  - cert-connective-no-legal-advice
  - cert-intake-ack-deliverability
  - cert-conflict-routing-human
  - cert-trust-funds-read-only
