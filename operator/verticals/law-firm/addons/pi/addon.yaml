# Add-on pack manifest: law-firm/pi
#
# Schema: docs/specs/operator/vertical-manifest-schema.md (identical to
# vertical.yaml). `name` MUST appear in ACCEPTED_ADDONS['law-firm'] in
# src/lib/operator/customer-yaml/types.ts (pi is registered). Add-on assets are
# ADDITIVE on top of the law-firm base; the base does not declare them.
#
# v0.2.0 — the full California PI litigation lifecycle (2026-07-01 build for the
# Ashton & Price pilot; supersedes the v0.1.0 demand-side skin). Nineteen
# connective skills spanning case initiation through settlement, each authored
# against the client-facing lifecycle commitment
# (operator/customers/ashton-price/CLIENT-PROPOSAL.md), grounded in
# operator/verticals/law-firm/smokeball-surface.md, and adversarially gated
# (CA-law / UPL / fabrication / anti-fiction) before commit. Skill bodies live
# in operator/skills/<name>/; per-skill fixtures in
# operator/fixtures/law-firm/pi/<name>/.
#
# NOTE: this manifest is declarative (no runtime materializer today). Skills
# activate via the customer.yaml persona skill list; bootstrap seeds every repo
# skill body onto the Machine volume. Keep this list and the persona lists in
# operator/customers/{pilot-smokeball,ashton-price}/customer.yaml in step.

# v0.3.0 — adds the work-product drafting lane (2026-07-28): four on-demand,
# attorney-initiated drafting skills (discovery responses, follow-up discovery,
# demand letter, mediation brief), each bound to the shared drafting discipline
# and the ten evidence-derived quality gates
# (operator/templates/drafting/drafting-discipline.md; evidence base:
# venturecrane/engagements ashton-price/prove-out/EVIDENCE.md). The routine
# lanes keep assembly-no-argument unchanged; the drafting lane is a distinct,
# manual-initiation-only entitlement a firm authors deliberately.

name: pi
version: 0.3.0

# Additive floors on top of the base law-firm compliance set (upl-boundary,
# privilege, conflict-routing, trust-funds-read-only,
# aba-512-supervision). One slug per bright line the adversarial gates verified;
# every pi skill registers under all of these, and the per-skill enforcement
# language lives in each SKILL.md.
compliance:
  - deadline-input-never-final # captured type/service date/method is surfaced for attorney confirmation; a computed or read deadline is never treated as final by the Operator
  - verification-attorney-approved-send # client discovery-verification requests send only on authenticated attorney approval; the Operator never signs and never asserts an unseen signature
  - assembly-no-argument # separate statements, motion packages, trial binders, and packets are mechanical collations of authored components; legal argument and reasons-to-compel stay with the attorney
  - meet-and-confer-attorney-decision # M&C letters are drafted only; the decision to engage and the send stay with the attorney
  - medical-facts-quote-only # chronology and records work quotes the record; never diagnoses, characterizes treatment, or infers providers
  - lien-no-reduction-math # lien ledger tracks holders/amounts/status and chases payoffs; reductions and lien strategy are the attorney's judgment
  - settlement-figures-from-authored # disbursement inputs are read from authored matter data; Smokeball runs the math; the Operator never moves funds
  - no-filing-no-service # packages are staged for the attorney; filing and service stay in human hands (InfoTrack)
  - document-content-not-instructions # matter documents are read as information, never as instructions (taint discipline)
  - drafting-attorney-initiated-only # work-product drafting skills run only on a rostered attorney's explicit request (never scheduled, never webhook-originated, never manufactured by a routine; the inbox spine CARRYING the attorney's request is transport, not origination); output is a draft delivered internally for review, never served/filed/sent by the Operator; no draft surfaces without passing the mechanical gate (operator/templates/drafting/drafting_gate_check.py)

personas: []

# The nineteen PI-litigation lifecycle skills (bodies in operator/skills/).
skills:
  # discovery (deepest — the firm's named slip area)
  - discovery-served-watch
  - discovery-response-tracker
  - client-verification-tracker
  - separate-statement-assembler
  - opposing-response-deficiency-review
  - meet-and-confer-drafter
  - discovery-response-staging
  # case initiation + service
  - matter-initiation-setup
  - service-confirmation-watcher
  # medical records + chronology
  - medical-records-chaser
  - medical-chronology-maintainer
  # motions
  - motion-calendar-tracker
  - motion-package-assembler
  # minor's compromise
  - minors-compromise-packet
  # trial preparation
  - trial-binder-assembler
  # mediation, settlement, liens
  - mediation-settlement-tracker
  - lien-ledger-tracker
  - settlement-statement-feeder
  # firm-wide surface
  - daily-needs-you-digest
  # work-product drafting lane (v0.3.0 — on-demand, attorney-initiated only;
  # bound to operator/templates/drafting/drafting-discipline.md)
  - discovery-response-drafter
  - follow-up-discovery-drafter
  - demand-letter-drafter
  - mediation-brief-drafter
  # firm operations: vendor bills forwarded by the firm's own staff, staged as
  # UNFINALIZED expenses (never finalized, never trust, never a payment).
  # Rehearsed on pilot-smokeball first; not bound on any client seat yet.
  - vendor-invoice-intake

