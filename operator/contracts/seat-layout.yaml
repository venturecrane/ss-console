# ============================================================================
# The Operator seat's folder layout: the SINGLE SOURCE for every seat path.
# ============================================================================
#
# WHY THIS EXISTS (2026-11-10). The sprawl audit (scripts/sprawl-audit.ts, PR
# #3944) found seat paths written out by hand across Python, shell and
# TypeScript with no central definition in any install tree: 35 paths in five or
# more files, /run/smd-jobs alone in 13. The ADR 0103 path move had to edit 49
# files. A path declared here is generated into each tree by
# operator/bin/gen-seat-layout.py, and code references the generated constant.
#
# GENERATED OUTPUTS (committed; operator/bin/tests/test_seat_layout_generation.py
# fails when one is out of sync). Regenerate: python3 operator/bin/gen-seat-layout.py
#   operator/templates/_seat-layout.generated.sh   shell: SMD_LAYOUT_<ID>=, never exported
#   operator/templates/seat-layout.generated.json  read by operator/templates/seat-layout-probe.py
#   operator/runners/jobs/jobs/seat_layout.py      the jobs runner (jobs bundle)
#   operator/workspace_broker/seat_layout.py       the workspace broker
#   operator/hermes-smd-overlay/shared/seat_layout.py  the overlay (gateway, appliers)
#   operator/bin/lib/seat_layout.py                fleet tools on the laptop and in CI
#   src/lib/operator/seat-layout.generated.ts      the console (the record-store fence)
#
# Shell reads a path as ${SMD_LAYOUT_<ID>} after sourcing the generated file
# (each script sources it itself; operator/templates/tests/test_seat_layout_shell_names.py
# holds that). A path may hold only [A-Za-z0-9/._-]: every output quotes it
# verbatim, and the shell may expand it unquoted.
#
# THE SEAT PROVES IT. seat-checks.sh runs seat-layout-probe.py at boot and every
# hour: each path with an `expect` holds on the live seat, every tree's generated
# module agrees with the image's copy, and every process that carries a declared
# `env` var carries the declared value.
#
# FIELDS (per id; ids are lower_snake and become SMD_LAYOUT_<ID> / <ID> constants):
#   path          absolute, or "{parent_id}/child" to derive from another id
#   env           runtime override vars that carry this path. Set and non-empty
#                 means equal to the path on a live seat; unset or empty is fine
#                 (code reads `os.environ.get(VAR) or DEFAULT`, and a lane that is
#                 off gets its queue var set empty, entrypoint-lanes.sh).
#   expect        what the probe asserts: present | absent | lazy (may not exist
#                 yet, kind checked when it does). Omitted: declared, not probed.
#   kind          dir | file (checked when expect is present or lazy)
#   when          always (default) | lanes: only on a seat that runs a job lane
#   volume        true: lives on the Fly volume; changing it needs a bump of
#                 operator/fleet/volume-epoch (ADR 0103 amendment)
#   bundle_mount  true: a jobs-bundle mount; changing it needs a bump of
#                 BundleSpec.layout (ADR 0103 decision 3)
#
# Values below were measured on hermes-smd-staging, the A&P twin, on 2026-11-10
# (stat and /proc/*/environ, read-only).

paths:
  # ---- the volume ----
  data:
    path: /opt/data
    expect: present
    kind: dir
    volume: true
  profiles:
    path: '{data}/profiles'
    expect: present
    kind: dir
    volume: true
  skills:
    path: '{data}/skills'
    volume: true
  installs:
    path: '{data}/installs'
    volume: true
  requests_db:
    path: '{data}/requests.db'
    volume: true
  attachment_spool:
    path: '{data}/attachment-spool'
    volume: true
  smokeball_extract_cache:
    path: '{data}/smokeball-extract-cache'
    volume: true
  smokeball_refresh_token:
    path: '{data}/.smokeball-mcp/refresh_token'
    volume: true
  casework_ledger:
    path: '{data}/audit/casework-ledger.jsonl'
    volume: true

  # ---- the jobs family (ADR 0100, ADR 0103) ----
  jobs_data:
    path: '{data}/jobs'
    env: [JOBS_DATA_DIR]
    expect: present
    kind: dir
    when: lanes
    volume: true
  jobs_run:
    path: /run/smd-jobs
    env: [SMD_JOBS_RUN_DIR]
    expect: present
    kind: dir
    when: lanes
  jobs_queue:
    path: '{jobs_run}/queue'
    env: [SMD_MEDCHRON_QUEUE_DIR]
  jobs_bundle:
    path: /opt/jobs
    expect: present
    kind: dir
    when: lanes
    bundle_mount: true
  jobs_python:
    path: '{jobs_bundle}/.venv/bin/python'
  lanes_run:
    path: /run/smd-lanes
  # The unrecorded-spend sweep's watermark (jobs/spend.py): the instant the
  # sweep first ran on this seat, written once; jobs that ended before it are
  # never flagged. A timestamp only, no client data. On the volume through the
  # run dir's bind mount of jobs_data.
  jobs_spend_watch:
    path: '{jobs_run}/spend-watch.json'
    expect: lazy
    kind: file
    when: lanes

  # ---- PR B: jobs family additions (W1) ----
  jobs_bin:
    path: '{jobs_bundle}/.venv/bin/jobs'
  jobs_pricing:
    path: '{jobs_bundle}/anthropic_pricing.json'
  # Each lane's queue default. The broker reads SMD_<LANE>_QUEUE_DIR first
  # (entrypoint-lanes.sh sets it, empty when the lane is off); no `env` here,
  # because the probe asserts env equality and these were not measured as such.
  demand_queue:
    path: '{jobs_run}/demand-queue'
  drafting_queue:
    path: '{jobs_run}/drafting-queue'
  litigation_queue:
    path: '{jobs_run}/litigation-queue'
  negotiation_queue:
    path: '{jobs_run}/negotiation-queue'
  casefile_queue:
    path: '{jobs_run}/casefile-queue'
  records_queue:
    path: '{jobs_run}/records-queue'
  # The same records queue through the volume path (the run dir is a bind
  # mount of jobs_data): the broker's default (workspace_broker/records_store.py).
  records_queue_volume:
    path: '{jobs_data}/records-queue'
    volume: true
  records_state:
    path: '{jobs_data}/records-state'
    volume: true

  # ---- root-owned config (the 2026-06-15 keystone) ----
  smd_config:
    path: /var/lib/smd-config
    expect: present
    kind: dir
  customer_yaml:
    path: '{smd_config}/customer.yaml'
    env: [SMD_CUSTOMER_YAML, SMD_CUSTOMER_YAML_PATH]
    expect: present
    kind: file
  specs:
    path: '{smd_config}/specs'
    env: [SMD_SPEC_DIR]
  marketing_registers:
    path: '{smd_config}/marketing/marketing-firm.yaml'
  volume_customer_yaml:
    # The pre-keystone location. It must stay ABSENT: the agent uid owns /opt/data.
    path: '{data}/customer.yaml'
    expect: absent

  # ---- interpreters ----
  hermes_root:
    path: /opt/hermes
  hermes_sha:
    path: '{hermes_root}/HERMES_SHA'
  hermes_venv:
    path: '{hermes_root}/.venv'
  hermes_python:
    path: '{hermes_venv}/bin/python'
  hermes_python3:
    path: '{hermes_venv}/bin/python3'
  broker_root:
    path: /opt/workspace-broker
  broker_python:
    path: '{broker_root}/.venv/bin/python'

  # ---- audit and sockets ----
  audit_run:
    path: /run/smd-audit
  audit_db:
    path: '{audit_run}/audit.db'
    env: [SMD_AUDIT_DB_PATH]
  escalation_ledger:
    path: '{data}/audit/escalation-ledger.jsonl'
    env: [SMD_ESCALATION_LEDGER_PATH]
    volume: true
  broker_socket:
    path: /run/smd-workspace-broker/broker.sock
    env: [SMD_WORKSPACE_BROKER_SOCKET]
  selftest_results:
    path: /run/smd-selftest/results.json
    expect: lazy
    kind: file
  # The self-test's per-check inconclusive streaks (check ids, counts and
  # epoch seconds; no client data), kept across restarts (selftest.sh
  # judge_inconclusive). Root-owned 0700; created on the first inconclusive run.
  selftest_state:
    path: '{data}/selftest-state'
    expect: lazy
    kind: dir
    volume: true

  # ---- connectors ----
  connectors_root:
    path: /opt/connectors
  smokeball_bundle:
    path: '{connectors_root}/smokeball'
    bundle_mount: true
  smokeball_python:
    path: '{smokeball_bundle}/.venv/bin/python'

  # ---- PR C: config, interpreter and audit families (W2-W4) ----
  # Declared so the Python trees read them from the generated module. No `env`:
  # an env name is asserted on live seats, and none of these has been measured
  # there under a declared name. No `volume` flag either: none of them moves here.
  casefile_inputs:
    path: '{smd_config}/casefile'
  demand_inputs:
    path: '{smd_config}/demand'
  drafting_inputs:
    path: '{smd_config}/drafting'
  litigation_inputs:
    path: '{smd_config}/litigation'
  records_inputs:
    path: '{smd_config}/records'
  medchron_firm_yaml:
    path: '{smd_config}/medchron-firm.yaml'
  casefile_broker_firm_yaml:
    path: '{smd_config}/casefile-broker-firm.yaml'
  litigation_broker_firm_yaml:
    path: '{smd_config}/litigation-broker-firm.yaml'
  records_broker_firm_yaml:
    path: '{smd_config}/records-broker-firm.yaml'
  hermes_playwright:
    # PLAYWRIGHT_BROWSERS_PATH: the image installs the browsers under the Hermes root.
    path: '{hermes_root}/.playwright'
  legacy_audit_db:
    # The pre-/run/smd-audit audit db on the volume (entrypoint.sh LEGACY_AUDIT_DB).
    # Every boot MOVES it to audit_volume_db (entrypoint.sh: mv), so nothing may
    # read it: it exists only for the move and its refusal.
    path: '{data}/audit.db'
  audit_volume_db:
    # The live audit db on the volume (entrypoint.sh AUDIT_DB); /run/smd-audit is
    # its bind for the broker. Measured on smd-staging 2026-11-10: this file exists
    # and /opt/data/audit.db does not.
    path: '{data}/audit/audit.db'

# Files that must spell a path rather than import it, each with the reason. The
# generation test pins each named path in each file to the value above.
restated:
  - file: operator/bin/lib/fleet/remote_busy_probe.py
    ids: [jobs_run]
    why: piped to python over fly ssh with no import path (operator/bin/lib/fleet/busy.py)
  - file: operator/bin/lib/fleet/remote_quiesce.py
    ids: [jobs_run]
    why: piped to python over fly ssh with no import path (operator/bin/lib/fleet/busy.py)
  - file: operator/templates/seat-layout-probe.py
    ids: [hermes_python3, jobs_python, broker_python, broker_root]
    why: the boot smoke sends this file over ssh, so it cannot import a tree's module
  - file: operator/templates/Dockerfile
    ids: [jobs_bundle]
    why: an image RUN line that makes the bundle's mount target, in a layer built before the one that COPYs the generated file
  - file: operator/contracts/runtime-control-probes.yaml
    ids: [jobs_bin]
    why: data, not code; the four gate probes' seat_command argv is read by bin/control-probes.py and run on the seat as written

# Seat paths the sprawl census finds in five or more files that are deliberately
# NOT declared, each with the reason. The generation test fails when a path in
# scripts/sprawl/literal-baseline.json is neither declared above nor listed here,
# so a newly restated seat path is a decision, not a drift.
left_out:
  - path: /opt/data/medchron
    why: the pre-ADR 0103 jobs tree; tests/jobs-volume-old-path-allowlist.test.ts owns it until the compatibility bind is removed
  - path: /run/smd-medchron
    why: the pre-ADR 0103 run dir; same owner and the same end as /opt/data/medchron
  - path: /opt/data/profiles/operator
    why: a persona's profile home; "operator" is a persona slug from customer.yaml, not a layout fact
