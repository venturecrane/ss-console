# ============================================================================
# customer.yaml block-materialization registry — the single declaration of, for
# every block a customer.yaml may author, WHAT turns it into a runtime effect
# (and whether anything does at all).
#
# WHY THIS EXISTS. cron was authored in customer.yaml, validated, and then
# SILENTLY DROPPED — translate.py had no _materialize_cron, so no scheduled turn
# ever fired ("validation passing ≠ materialized"). The validator proves a block
# is well-SHAPED; nothing proved a block is CONNECTED. This registry is that
# second proof: every block authored in any operator/customers/*/customer.yaml
# must appear here as either `implemented` (a named materializer produces a
# runtime effect) or `inert` (deliberately not wired, with a reason). A NEW
# block that nobody classified fails CI — the gate that would have caught cron.
#
# ENFORCEMENT: operator/bin/tests/test_customer_yaml_block_conformance.py asserts
#   authored-blocks ⊆ registry, every entry is implemented|inert, and every
#   inert entry carries a reason.
#
# RUNTIME BACKSTOP. The "Cut D drift audit" once named here as the runtime check
# (that the live Machine reflects what `implemented` claims) was never built — a
# comment standing in for a control, the same defect this enforcement guards
# against. The live-wiring backstop now lives in the runtime-control conformance
# harness: operator/contracts/runtime-controls.yaml + its CI forcing function
# (test_runtime_control_conformance.py), with the live negative-fire probe tier
# folded into ADR 0050 B3's design review. THIS registry proves a customer.yaml
# block is well-shaped + classified; that harness proves a runtime control fires.
#
# status:      implemented | inert
# materializer: where the runtime effect is produced (file/function), or — for
#              inert, where it is validated.
# note:        for inert, WHY it is not wired (deliberate vs not-yet); free text.
#
# Two scopes: customer.yaml TOP-LEVEL keys, and persona-level keys (entries of
# personas[]).

top_level:
  # ---- identity / provisioning-consumed ----
  schema_version:
    status: implemented
    materializer: src/lib/operator/customer-yaml (validation gate)
    note: schema-version guard at validation time
  customer_id:
    status: implemented
    materializer: provision-customer.sh (app/R2 naming) + translate _persona_config (config.yaml)
  customer_name:
    status: implemented
    materializer: translate _persona_config (config.yaml) + SOUL.md
  fly_region:
    status: implemented
    materializer: provision-customer.sh (Fly app region)
  machine:
    status: implemented
    materializer: provision-customer.sh (Machine size/region)
  hermes_ref:
    status: implemented
    materializer: provision-customer.sh (Docker build args + pinned-SHA assertion)
  vertical:
    status: implemented
    materializer: translate _persona_config (config.yaml) + SOUL.md + SMD_VERTICAL (trust)
  model:
    status: implemented
    materializer: translate _persona_config (config.yaml model override)
  escalation_model:
    status: implemented
    materializer: translate _persona_config (config.yaml delegation.model — ADR 0049 escalate-up tier)
    note: >-
      Optional. When set, emits Hermes' native `delegation: {model: ...}` so any
      skill that calls delegate_task runs heavy reasoning on this model while the
      seat's main `model` stays light. Absent => no delegation block; delegated
      work inherits the main model.
  # ---- materialized into the persona config.yaml / runtime ----
  personas:
    status: implemented
    materializer: translate_customer_yaml (per-persona profile dir)
  connectors:
    status: implemented
    materializer: translate _materialize_mcp_servers (config.yaml mcp_servers)
  google_auth:
    status: implemented
    materializer: entrypoint.sh (broker DWD credential) + bootstrap broker health check
  scope:
    status: implemented
    materializer: translate _persona_config (config.yaml scope)
    note: >-
      scope.inbound_allow_from (the organization roster, ADR 0055) is ALSO read
      live on the volume by overlay hermes-smd-reply on every draft — it
      authorizes the recipient-locked autonomous reply to a rostered inbound
      sender. Live-writable (config_applier), so authoring the roster takes
      effect with no restart.
  safety:
    status: implemented
    materializer: >-
      overlay runtime live-read (ADR 0044 posture), not translate: CustomerConfig.sticky_stop
      (overlay shared/customer_config.py) feeds shared/cost_breaker.thresholds_from_config
      (safety.sticky_stop.cost_cap_daily_cents -> the job-path daily ladder) and
      shared/gate_inbound_cap.resolve_inbound_cap (safety.sticky_stop.inbound_daily_cap ->
      the webhook-gate wake cap). safety.sticky_stop.web_search_daily_cap (ADR 0070) is
      read the same way — a per-UTC-day fair-use ceiling on native web search
      (native:brave-free); on the free tier this is a courtesy bound (Brave's own free
      quota is the hard stop, no spend to run away). The field is authored + read into
      config today; a dedicated per-call counter at the native web_search call site is a
      follow-on, with the cost breaker (cost_cap_daily_cents) as the interim backstop
      (every search rides an LLM turn). Unauthored => platform
      defaults (5000 cents / 200 wakes / 200 searches), integrity control per ADR
      0035/0062 — never fail-open.
  business_hours:
    status: implemented
    materializer: >-
      bootstrap.sh SEAT_TIMEZONE extraction -> `export HERMES_TIMEZONE` before the
      gateway exec. Hermes' clock (hermes_time.now(), highest-priority env source)
      and therefore the cron engine's due-computation run in the seat's IANA
      timezone; unauthored = UTC (container clock, the prior behavior). days/start/
      end are authored-but-inert today (future business-hours-aware behavior);
      timezone is the load-bearing field.
  digest:
    status: implemented
    materializer: >-
      overlay translate.py _digest_home_soul_section (overlay #138, ss #1742):
      digest.home_matter_id renders as the SOUL.md `## Digest home` section
      naming the designated internal operations matter, which
      daily-needs-you-digest step 4 resolves for the full-digest memo write.
      Unauthored = no section = fail-closed (session output + heartbeat only).
      Validated console-side by checkDigest (GUID) in sections-other.ts.
  escalation:
    status: implemented
    materializer: translate _persona_config (config.yaml escalation)
  send_policy:
    status: implemented
    materializer: Machine live-read (shared/send_policy.resolve_send_policy -> hermes-smd-reply RateLimiter.check, per reply, ADR 0044; not translated)
    note: >-
      Reply-channel send-rate policy (#2070): internal dialogue exemption,
      per-sender/global caps, reply backstop, held-reply auto-release.
      Governs ONLY the hermes-smd-reply relay; the autonomous/confirm send
      lane never consults it. Whole-block fail-closed on-box: any malformed
      field resolves the entire block to platform defaults.
  seat:
    status: inert
    materializer: >-
      console-side only — checkSeat (src/lib/operator/customer-yaml/sections-seat.ts)
      validates kind/product, and customer-yaml-editor preserves the block verbatim
      so a portal save cannot relabel a production seat.
    note: >-
      Authored NOW and wired later, deliberately. The descriptor answers "what is
      this Operator" — a question nothing in the tree could answer, which produced
      a live mislabel of hermes-ashton-price as a serving client seat when it was
      provisioned, connected to nothing, and serving nobody. It carries kind and
      product only; lifecycle state is DERIVED from probes and must never become a
      field here (a state field is a claim an agent can write, and a claim an agent
      can write is one that rots — see the persona `status: active` that reads the
      same on all eight seats including _template). Consumers land in two follow-ons:
      the git→R2 config publisher, where "does this seat carry a real firm's data"
      decides blast radius, and the fleet roster's derived lifecycle state.
  output_classes:
    status: inert
    materializer: >-
      console-side only — checkOutputClasses
      (src/lib/operator/customer-yaml/sections-output-classes.ts) validates the
      per-class spec dispositions; operator/bin/tests/test_output_class_conformance.py
      proves the class vocabulary agrees with operator/contracts/output-classes.yaml.
    note: >-
      ADR 0083. Declares, per output class, whether an authored voice/format spec is
      EXPECTED. That one bit is what separates "the customer chose not to author here,
      so persona judgment governs" from "a spec was promised and the sync is broken" —
      states that are otherwise indistinguishable, where the second would silently
      degrade to the first on an output the customer believes they shaped. The spec
      CONTENT lives in the customer's own vault object, not here: it is prose they
      edit through the portal, and a portal edit cannot reach git. Runtime consumer is
      the spec loader in Contract A; until it lands, this block is authored and unread,
      and saying so here is the point of this registry.
  routine_names:
    status: implemented
    materializer: >-
      no translate step by design — the block's runtime consumer is the
      operator-introduce skill, which reads it directly off the seat's own
      /var/lib/smd-config/customer.yaml via read_file (proven agent-readable,
      #2222 probe vfy_01KZPBXY9D). This is a NEW materialization shape:
      config-as-data read by a skill at turn time, reaching the seat through
      the existing R2 publish -> boot fetch of customer.yaml itself.
    note: >-
      Firm-legible routine names (skill slug -> the routine-grid row's verbatim
      `routine:` value). Drift-gated by tests/routine-names-drift.test.ts:
      every key is a skill bound on that seat, every grid row's skill has an
      entry, and the name equals the row's `routine:` byte-for-byte.
  self_initiation:
    status: implemented
    materializer: >-
      no translate step by design — the block's runtime consumers read it
      directly off the seat's own /var/lib/smd-config/customer.yaml at turn
      time (the routine_names materialization shape, proven agent-readable by
      #2222 probe vfy_01KZPBXY9D): the operator-self-initiation skill via
      read_file, and, since #2448, the Smokeball connector's format renderer
      (smokeball_connector/library.py, a connector-process read of the same
      file, proven on the pilot by vfy_01M0DTM2EGQZP9FZTM53S17CJ7), which
      resolves `document_library.{matter_number, folder_name, templates}` to
      the firm's per-class Word template. Reaches the seat through the
      existing R2 publish -> boot fetch of customer.yaml itself.
    note: >-
      The seat's authored initiation sequence (ss#2220 rescoped, Captain
      2026-08-11): `sequence` is the ordered list of acts one admin request
      runs (person-initiated always, never automatic on connect), and
      `document_library` names where the library lives for the status probe.
      Drift-gated by tests/self-initiation-sequence.test.ts: every sequence
      act is a skill bound+enabled on that seat, and any seat binding the
      conductor authors a sequence.

      `document_library.operator_matter` (ss#2536) is the one internal matter
      the Operator may offer to create for its own template library, and it is
      the ONLY source of the values that act carries: `number`, `description`,
      `client_contact_id` (the firm's own contact, so the firm is its own
      client on the matter), `matter_type_id`. Two runtime consumers, both
      reading the seat's own /var/lib/smd-config/customer.yaml. The workspace
      broker (operator/workspace_broker/establishment.py act_propose) refuses
      any proposal whose payload is not byte-equal to this block, so a seat
      that authors nothing here can propose nothing at all; the Smokeball
      connector's library resolver (smokeball_connector/library.py) falls back
      to `operator_matter.number`, and then to the convention number
      OPS-OPERATOR-LIBRARY, when no `matter_number` is authored. Changing which
      matter the Operator would create is an edit HERE, in a PR, never a value
      taken from an email.
  voice_library:
    status: implemented
    materializer: bootstrap Step 2a (R2 voice-vault sync) + translate _persona_config (config.yaml)
  voice_cohorts:
    status: inert
    materializer: >-
      console-side only — checkVoiceCohorts / resolveCohortVocabulary
      (src/lib/operator/customer-yaml/sections-voice.ts) validate and resolve the
      vocabulary, and bin/voice-fetch-corpus.py reads it as a pre-flight guard so
      an unauthored cohort cannot mint an orphan vault directory at ingest.
    note: >-
      INERT AT RUNTIME BY DESIGN. The vocabulary partitions the vault keys
      (vaults/<slug>/voice/cohort/<cohort>/) that the ingest step writes and the
      runtime reader consumes; nothing in translate.py or bootstrap renders this
      block into seat config, because the cohort is carried in the sample's own
      recipient_cohort field, not in a config value. The runtime effect is
      therefore real but indirect — the block governs WHERE samples land, not
      what the Machine is told.
  telegram:
    status: implemented
    materializer: translate _materialize_telegram_platform (config.yaml platforms)
  custody_exceptions:
    status: implemented
    materializer: >-
      validation-consumed, not materialized: console validator
      (src/lib/operator/customer-yaml/sections-custody-guard.ts) + on-box
      bootstrap/validate.py _validate_custody_guard (ADR 0044 D8 / ADR 0045 / #1841).
      Authored identity-channel acceptance for the code_execution custody guard;
      dispositions in operator/contracts/connector-custody-dispositions.md.
  gmail_push:
    status: inert
    materializer: src/lib/operator/customer-yaml/sections-gmail-push.ts (validation only)
    note: >-
      Gmail push-notification channel (real-time inbox delivery via Pub/Sub →
      /webhooks/gmail). Console-side validator is live; overlay /webhooks/gmail
      endpoint + translate.py materialization are pending (filed as overlay follow-on).
      Fail-closed: overlay reads the block at webhook dispatch time; without the
      endpoint, pushes are ignored rather than crashing. Not a silent drop — declared
      inert until the overlay ships.
  memory:
    status: implemented
    materializer: translate _persona_config (config.yaml memory block)
    note: >-
      written into the persona config; the Honcho inferred-memory CONSUMER is
      deliberately Phase-2-deferred (ADR 0016 revised), but the block is
      materialized into runtime config, not dropped — distinct from the cron bug.
  # ---- runtime-consumed from customer.yaml on the volume (overlay reads it directly) ----
  webhook_triggers:
    status: implemented
    materializer: >-
      overlay hermes-smd-webhook-router (routes (source,event_type)->persona/skill
      from customer.yaml at runtime) + webhook_gate source-stamp + webhook_gate
      trigger exclusions (overlay shared/gate_trigger_exclusions.py, live-read per
      delivery: exclude.matters/actors -> 202 + WEBHOOK_SUPPRESSED audit row, no
      forward; fail-open to forward on any config/parse issue)
    note: >-
      ADR 0021 Stream E. The router reads customer.yaml.webhook_triggers directly
      from the synced volume (not translated into config.yaml); validated
      console-side by src/lib/operator/customer-yaml/sections-webhook-triggers.ts.
  # ---- console-side (not a Machine materialization) ----
  users:
    status: implemented
    materializer: ss-console portal (console-side access control); not staged to the Machine
  authority:
    status: implemented
    materializer: ss-console portal domain-surface composition (projected to customer_configs.authority_json; resolveDomainSurfaceMode gates which domains render operable to client roles); not staged to the Machine
    note: >-
      ADR 0041/0042 domain switches (#2003). Consumed console-side only:
      validated by src/lib/operator/customer-yaml (checkAuthority), projected
      by customer-config-projection.ts, enforced per-request by the portal
      routes (e.g. the pause route requires runtime: client). The Machine
      never reads it — Machine-side enforcement is the entitlements/exposure
      model (ADR 0056), a separate axis.
  mcp_connector:
    status: implemented
    materializer: ss-console MCP endpoint (console-hosted Operator<->Claude connector; reads enabled/data_posture/policy/allowed_domains/default_profile/ttl_days/access to authorize MCP tool calls) + WEBHOOK_SECRET_MCP staged by provision-customer.sh for the handoff route
    note: >-
      Operator <-> Claude MCP connector (Phase 1, console-mediated). Consumed
      console-side, not translated into Machine config.yaml — validated by
      src/lib/operator/customer-yaml/sections-mcp-connector.ts. The only Machine
      touch is the per-customer WEBHOOK_SECRET_MCP (handoff route) + the
      webhook-router recognizing source="mcp". Issuance policy (ADR 0057 §3):
      policy=allowlist (default, fail-closed) | open (verified firm-domain JIT,
      requires allowed_domains + default_profile; auto-issue is slice 2e).
      ttl_days bounds every grant (1..90, never infinite). Fail-closed:
      absent/enabled:false => no user reaches the Operator through Claude. See
      docs/design/operator/03-mcp-server-exposure.md.
  relationship:
    status: implemented
    materializer: translate _persona_config (config.yaml relationship) + _soul_body ("Working relationships" section) + overlay runtime_read config_export
    note: >-
      ADR 0048 authored behavioral lane. Per-person standing working
      preferences, validated console-side by
      src/lib/operator/customer-yaml/sections-relationship.ts. Materialized into
      each persona SOUL.md so the Operator works the authored way, and surfaced
      read-only on the admin relationship view via the secret-safe
      `config_export?section=relationship` seam (allow-listed — never returns the
      whole config.yaml). Informational only (ADR 0048 §2c): preferences never
      grant capability; entitlements stay in scope/escalation, enforced by
      trust_ceiling.enforce(). Distinct from an output class's authored style
      property (ADR 0083 §2d): style is a class property, not a behavioral
      preference. (The voice_corrections table this note used to name was
      retired in #2091.)
  # ---- deliberately not wired (validated authoring affordances) ----
  addons:
    status: inert
    materializer: src/lib/operator/customer-yaml/sections-addons.ts (validation only)
    note: >-
      pack-addon constraints validated as an authoring affordance; no runtime
      materializer yet and no live customer authors addons (only _template).
      Not-yet-wired, surfaced for Captain/the drift audit to revisit — not a
      silent drop.
  practice_areas:
    status: inert
    materializer: src/lib/operator/customer-yaml/sections-identity.ts (validation only)
    note: >-
      law-vertical metadata used for human authoring + validation; SOUL.md
      currently renders `vertical`, not practice_areas. Not-yet-wired into
      runtime config/SOUL; surfaced for review rather than claimed materialized.

persona:
  slug:
    status: implemented
    materializer: translate_customer_yaml (profile dir name) + _persona_config
  name:
    status: implemented
    materializer: translate _persona_config (config persona.name) + SOUL.md
  title:
    status: implemented
    materializer: translate _persona_config (config persona.title) + SOUL.md
  status:
    status: implemented
    materializer: translate _persona_config (config persona.status)
  tone:
    status: implemented
    materializer: translate _persona_config (config persona.tone) + SOUL.md
  entitlements:
    status: implemented
    materializer: translate _persona_config (config entitlements.exposure) + hermes-smd-overlay hermes-smd-trust/enforce.py (runtime exposure enforcement; ADR 0056)
    note: persona-level exposure (per-action-class ceiling map) replacing the retired scalar trust_ceiling / scope+skill action_ceilings. Skill-level initiation (manual/scheduled/webhook) is authored inside skills[] and gates cron/webhook/manual start.
  skills:
    status: implemented
    materializer: translate _persona_config (config skills) + _install_persona_skills (bodies)
