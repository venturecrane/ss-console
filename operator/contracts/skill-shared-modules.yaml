# ============================================================================
# Shared Python modules: ONE source per module, and every place that carries a
# copy of it (skill folders, and the other processes' trees).
# ============================================================================
#
# WHY THIS EXISTS (2026-11-10). The scheduler stages one skill directory at a
# time and a stdlib-only pre_run.py cannot install a package, so a skill that
# uses a shared module needs the file beside its script on the seat. Until now
# nothing produced those copies: a person edited the source and pasted it into
# up to ten skill folders by hand, and nine sync tests caught a missed paste
# after the fact (36 copies of nine modules at the time; 23 copies of six since
# #3977 removed the case-manager routines that carried the rest).
#
# THE CROSS-PROCESS COPIES (2026-11-12, wave 1 item 1.3). The broker, the
# gateway (the overlay's `shared` package), the job runner and each connector
# run in separate virtualenvs and import nothing from one another, so a helper
# two of them need is a whole file in each tree. Those copies were held equal by
# seven per-pair parity tests and three overlay-pairs.json pins, each a
# different mechanism; `copies:` below declares them, and the same --check
# replaces all of them.
#
# THE RULE. Edit the module's `source`, then run
#     python3 operator/bin/gen-skill-shared.py
# which writes the source's bytes, unchanged, to operator/skills/<skill>/<copy_as>
# for every skill listed and to every path under `copies`. Never edit a copy.
# `--check` exits 1 naming each copy that differs from its source, each listed
# copy that is missing, and each copy in a skill folder that this file does not
# list; operator/bin/tests/test_skill_shared_generation.py runs it in CI. A
# byte-identical copy outside the skills tree that this file does not list is
# counted by the sprawl census (hand-kept-python-copies, which reads this file
# to leave the declared copies out) and the ratchet fails on it.
#
# THE COPIES ARE COMMITTED AND BYTE-IDENTICAL TO THE SOURCE, with no generated
# header: they are what the image (`COPY operator/skills/ /app/skills/`), the
# skills release (operator/bin/skills-manifest.py) and each process's install
# ship, and a header would be a byte change to every one of them. Step two of
# the plan moves the skill copying to packaging time and takes those copies out
# of git.
#
# WHERE THE SOURCES LIVE. Four sources are outside operator/skills (the templates
# and the workspace broker, which imports both ledgers itself). Two are the
# copy in deadline-miss-escalator (routing.py, broker_writer.py), because that file's own text names it as the
# canonical source and changing that text would change shipped bytes; step two
# moves them to a home outside the skills tree. A source inside a skill folder
# is never written by the generator. For a cross-process module the source is
# the copy its own text or its old parity test already named canonical.
#
# FIELDS
#   source   repo-relative path of the one file to edit
#   copy_as  file name inside each skill folder (the empty-seat gate is stamped
#            under the name pre_run.py; every other module keeps its own name);
#            only with `skills`
#   skills   skill folder names under operator/skills that carry a copy
#   copies   repo-relative paths outside operator/skills that carry a copy
#   (each module has `skills`, `copies`, or both)
# ============================================================================

modules:
  skill_helpers:
    source: operator/templates/skill_helpers.py
    copy_as: skill_helpers.py
    skills:
      - client-verification-tracker
      - deadline-miss-escalator
      - lien-ledger-tracker
      - medical-records-chaser
      - operator-help
      - post-intake-daily-list
      - records-order-chase
      - statute-watch

  pre_run_gate:
    source: operator/templates/pre_run_gate.py
    copy_as: pre_run.py
    skills:
      - daily-needs-you-digest
      - discovery-response-tracker
      - mediation-settlement-tracker
      - minors-compromise-packet
      - motion-calendar-tracker
      - service-confirmation-watcher
      - trial-binder-assembler

  escalation_ledger:
    source: operator/workspace_broker/escalation_ledger.py
    copy_as: escalation_ledger.py
    skills:
      - client-verification-tracker
      - daily-needs-you-digest
      - deadline-miss-escalator
      - lien-ledger-tracker
      - medical-records-chaser
    copies:
      - operator/hermes-smd-overlay/shared/escalation_ledger.py

  casework_ledger:
    source: operator/workspace_broker/casework_ledger.py
    copy_as: casework_ledger.py
    skills:
      - deadline-miss-escalator
    copies:
      - operator/hermes-smd-overlay/shared/casework_ledger.py

  routing:
    source: operator/skills/deadline-miss-escalator/routing.py
    copy_as: routing.py
    skills:
      - client-verification-tracker

  broker_writer:
    source: operator/skills/deadline-miss-escalator/broker_writer.py
    copy_as: broker_writer.py
    skills:
      - client-verification-tracker

  # The audit ledger's hash chain: the broker writes with it, the gateway's
  # export and verifier read with it (SEC-32).
  audit_chain:
    source: operator/workspace_broker/chain.py
    copies:
      - operator/hermes-smd-overlay/shared/audit_chain.py

  # The logic-in-code switch reader: one meaning in the gateway, the broker and
  # the Smokeball connector.
  logic_in_code:
    source: operator/hermes-smd-overlay/shared/logic_in_code.py
    copies:
      - operator/workspace_broker/logic_in_code.py
      - operator/connectors/smokeball/smokeball_connector/logic_in_code.py

  # The staff-mailbox read rule: the gateway (mail_spool_message) and the
  # msgraph-mail connector (list_staff_messages, read_staff_message) must refuse
  # the same mailboxes (ADR 0089 amendment 5a).
  staff_mailbox_rule:
    source: operator/hermes-smd-overlay/shared/staff_mailbox_rule.py
    copies:
      - operator/connectors/msgraph-mail/msgraph_mail_connector/staff_mailbox_rule.py

  # The wording-rule reader: the install letter (gateway) and the job lanes read
  # the installed wording.json the same way.
  wording_rules_store:
    source: operator/hermes-smd-overlay/shared/wording_rules_store.py
    copies:
      - operator/runners/jobs/jobs/wording_rules_store.py

  # The firm layout rule reader, shared by the gateway and the drafting lane.
  layout_store:
    source: operator/hermes-smd-overlay/shared/layout_store.py
    copies:
      - operator/runners/jobs/jobs/drafting/layout_store.py

  # The firm's attorney roster reader: the connector toolkit and the job runner.
  attorney_roster:
    source: operator/connectors/_sdk/operator_connector_sdk/library/roster.py
    copies:
      - operator/runners/jobs/jobs/attorneys/roster.py

  # The seat's slug and customer.yaml reader (wave 2, B1): which seat this is,
  # and the seat's YAML parsed, read the one way in every process. A caller
  # names what a missing value does (`on_missing`, no default); every call site
  # is held to its row in operator/contracts/seat-config-callers.json. No skill
  # folder carries it: a pre_run.py is staged alone into the profile's scripts/
  # dir, so a sibling module is not importable there by name.
  seat_config:
    source: operator/hermes-smd-overlay/shared/seat_config.py
    copies:
      - operator/workspace_broker/seat_config.py
      - operator/runners/jobs/jobs/seat_config.py
      - operator/connectors/smokeball/smokeball_connector/seat_config.py
      - operator/connectors/msgraph-mail/msgraph_mail_connector/seat_config.py
      - operator/bin/lib/seat_config.py
      - operator/adapter/seat_config.py
      - operator/rehearsal/seat_config.py

  # The broker socket client (wave 2, B1): one newline-framed JSON request, one
  # reply, UTF-8 on the wire. Every client of the broker sends through it.
  broker_socket:
    source: operator/hermes-smd-overlay/shared/broker_socket.py
    copies:
      - operator/workspace_broker/broker_socket.py
      - operator/runners/jobs/jobs/broker_socket.py
      - operator/connectors/smokeball/smokeball_connector/broker_socket.py
