# ============================================================================
# Runtime-control conformance registry — the single truth ledger of every
# safety/runtime control the Operator depends on, and whether it actually FIRES
# on a live turn (not merely whether the code exists).
#
# WHY THIS EXISTS. This venture keeps shipping the same defect: a control is
# built, tested, merged — and never wired into the live dispatch path on the
# Machine. Tests pass because they exercise the function in isolation; nothing
# proves it is invoked on a real turn. The motivating specimen:
# `safety-substrate/sticky_stop.py` was complete and fully tested (cost cap,
# tool-failure / refusal / time-budget circuit breakers) yet for two months had
# ZERO callers in ss-console and ZERO references in the overlay where dispatch
# runs; the circuit breaker named in PRD §7.5 did not exist at runtime. ADR 0062
# then vendored it into the overlay as shared/sticky_stop.py and wired the cost
# arm through shared/cost_breaker.py (see sticky_stop_cost_cap below). Since
# 2026-09-10 the two copies are a tracked pair in overlay-pairs.json, so the
# ss-console file can no longer drift silently from what seats run.
#
# WHAT THIS REGISTRY GUARANTEES (the "wires-nothing" subset). It does NOT wire
# any control. It makes a control's live status EXPLICIT and OWNED, and — via
# operator/bin/tests/test_runtime_control_conformance.py — makes a control
# impossible to ship SILENTLY absent or SILENTLY undocumented:
#   * completeness: every safety-critical hook declared in overlay-hook-surface.json
#     must map to a registry entry (catches an overlay-resident control nobody
#     listed);
#   * KNOWN_CONTROLS ⊆ registry (catches the sticky_stop class on day one);
#   * well-formedness: `enforced` ⇒ names a live_probe + wired_via; `unprobed`
#     and `inert` ⇒ carry owner + tracking + note (cannot rot undocumented).
#
# COMPONENT 3 NOW EXISTS (ss#2387, 2026-08-17), and this paragraph replaces the
# deferral that stood here. The negative-fire probe suite is
# operator/bin/control-probes.py, and its per-control specs are the sibling file
# operator/contracts/runtime-control-probes.yaml. Every probe name this registry
# cites (`live_probe`, `candidate_probe`) must resolve to an entry there, which
# is what stops a status from resting on a string.
#
# The suite STILL WIRES NOTHING, which is why an inert row stays inert: its probe
# asks whether anything on a dispatch path calls the arm, gets no, and records
# EXPECTED_FAIL. That is the honest reading of a control nobody calls, not a hole
# in the probe. The reverse is a finding: an inert row whose probe FIRES means
# this registry is wrong and the run goes red.
#
# WHAT IS STILL DEFERRED. Local probes run against the in-repo substrate and
# prove the substrate refuses; they cannot prove the live dispatch path invokes
# it. Every overlay-resident control is therefore probed only by a `seat` entry,
# and no seat driver is authored yet, so those probes HOLD (loud, exit 2) rather
# than reporting a status nobody measured. Authoring the drivers is the remaining
# half of ADR 0050 B3, and no status below moves on the strength of this file.
#
# RELATIONSHIP TO ADR 0050. ADR 0050 locks the task-execution taxonomy (7
# archetypes; execution classes N/C/R/D/A/O; the cross-cutting safety guard).
# This registry is an ORTHOGONAL axis — it inventories governance/safety CONTROLS
# and their live-wiring status, not skills or their execution strategy. Unwired
# controls reference the ADR 0050 backlog item that tracks their wiring rather
# than forking duplicate issues.
#
# STATUS VOCABULARY:
#   enforced  — wired into the live dispatch path AND has a named live_probe that
#               proves it fires. Two flavours today, and the difference matters
#               when reading an entry: AUTOMATED (the overlay gateway:startup
#               activation handler, which os._exit(1)s at boot if the control does
#               not fire) and MANUAL-OBSERVED (a named seat probe someone ran, with
#               a crane_verify id in the note). Manual-observed is a weaker claim —
#               it proves the control fired ONCE, not that a regression would be
#               caught — and an entry carrying it must say so rather than let a
#               reader assume the boot gate is watching.
#   unprobed  — wired into dispatch, but no negative-fire probe proves it fires on
#               a live turn. The #1285 risk surface (a hook can be registered yet
#               inert on live turns). Requires owner + tracking + note.
#   inert     — NOT wired into dispatch at all (the sticky_stop class). Requires
#               owner + tracking + note.
#
# FIELDS:
#   control          — stable id.
#   class            — dispatch-guard | emitter | circuit-breaker.
#   substrate_module — implementing code. ss-console paths are relative to
#                      operator/. Overlay-resident code is prefixed `overlay:`
#                      (path is in venturecrane/hermes-smd-overlay, not checked
#                      out here — the same cross-repo limit overlay-pairs.json and
#                      overlay-hook-surface.json document).
#   wired_via        — how the control is REACHED, in one of two forms:
#                        "<hook> / <overlay-plugin>"  — cross-checked against
#                          overlay-hook-surface.json.
#                        "tool / <tool_name>"  — for a control the agent reaches by
#                          CALLING a tool rather than by a hook firing around one.
#                          Cross-checked differently and not more weakly: a shipped
#                          skill or the drafting discipline must instruct the agent
#                          to call it. A hook fires whether or not anyone asked; a
#                          tool runs only if something in the agent's context says
#                          to, so a tool nobody instructs is inert in exactly the
#                          way this registry exists to expose.
#                      Empty ONLY for a root-side process outside dispatch entirely
#                      (see spec_applier), which has neither.
#   live_probe       — name of the negative-fire probe that PROVES it fires; must
#                      resolve to an entry in runtime-control-probes.yaml. Empty
#                      for unprobed/inert.
#   candidate_probe  — for unprobed/inert ONLY: the probe authored for this
#                      control that has not yet come back green. Deliberately a
#                      different field from live_probe, because naming a probe
#                      must never be mistakable for having passed one. Also
#                      resolves against runtime-control-probes.yaml.
#   risk_review      — for unprobed/inert ONLY: a dated, Captain-visible sentence
#                      on what is unproven and what it would cost. Dated because
#                      an undated risk note is indistinguishable from one nobody
#                      has looked at since it was written.
#   probe_surface    — staging | prod-boot. Where the probe is permitted to run.
#                      prod-boot is EARNED (a probe earns os._exit boot-gate
#                      privilege only after a staging flakiness bar). Empty for
#                      unprobed/inert.
#   status           — enforced | unprobed | inert.
#   owner            — named human accountable for the control.
#   tracking         — for unprobed/inert: the work item that will wire/probe it.
#                      `ADR-0050:Bx` (backlog item) or `#<issue>` or a URL.
#   note             — for unprobed/inert: WHY it is not proven-live (free text).
#
# ENFORCEMENT: operator/bin/tests/test_runtime_control_conformance.py (CI).
# ============================================================================

maintainer: SMDurgan

controls:
  # ---- enforced: wired + proven live by the existing activation self-checks ----
  trust_ceiling:
    control: trust_ceiling
    class: dispatch-guard
    substrate_module: overlay:plugins/hermes-smd-trust/enforce.py
    wired_via: 'pre_tool_call / hermes-smd-trust'
    live_probe: trust_blocks_banned_send
    probe_surface: prod-boot
    status: enforced
    owner: SMDurgan
    note: >-
      Proven live today by the overlay gateway:startup activation handler, which
      drives a real pre_tool_call with a permanently-banned send tool and
      os._exit(1) if it is not blocked. The B3 review formalizes this inline
      self-check as a named registry-driven probe.

  audit_emission:
    control: audit_emission
    class: emitter
    substrate_module: overlay:plugins/hermes-smd-audit/emit.py
    wired_via: 'post_tool_call / hermes-smd-audit'
    live_probe: audit_writes_row
    probe_surface: prod-boot
    status: enforced
    owner: SMDurgan
    note: >-
      Proven live today by the activation handler, which drives a real
      post_llm_call and asserts an audit_log row was written (row-count
      before/after) with os._exit(1) on failure. Formalized as a named probe in
      the B3 review.

  # ---- unprobed: wired into dispatch, but no negative-fire probe proves it ----
  inbound_trust_boundary:
    control: inbound_trust_boundary
    class: dispatch-guard
    substrate_module: overlay:plugins/hermes-smd-webhook-router/__init__.py
    wired_via: 'pre_gateway_dispatch / hermes-smd-webhook-router'
    live_probe: ''
    probe_surface: ''
    status: unprobed
    owner: SMDurgan
    tracking: ADR-0050:B3
    candidate_probe: seat_inbound_boundary_withholds
    risk_review: >-
      2026-08-17 (ss#2387): probe authored, driver NOT authored, so it holds. The
      exposure while it holds is that an inbound payload from an unverified
      sender could reach the autonomous path and nothing would say so until a
      client noticed the reply. Owner SMDurgan, tracked at ADR-0050:B3.
    note: >-
      Safety-critical hook (routes inbound webhook payloads + applies the inbound
      trust boundary, ADR 0027/0032). It IS registered, but no negative-fire probe
      proves the boundary actually withholds on a live turn — the #1285 shape
      (registered-but-inert-on-live-turns). A negative-fire probe is Component 3
      of the harness, folded into the B3 design review.

  voice_gate:
    control: voice_gate
    class: dispatch-guard
    substrate_module: overlay:plugins/hermes-smd-trust/voice_gate.py
    wired_via: 'pre_tool_call / hermes-smd-trust'
    live_probe: ''
    probe_surface: ''
    status: unprobed
    owner: SMDurgan
    tracking: '#2079'
    candidate_probe: seat_voice_gate_downgrades
    risk_review: >-
      2026-08-17 (ss#2387): probe authored, driver NOT authored, so it holds. The
      gate is fail-closed today, so the live exposure is the opposite of unsafe:
      every autonomous outside send is downgrading to draft for a reason nobody
      chose, and no probe would tell us the day that stops. ADR 0083 repoints it,
      and a driver authored against mechanism B would have to be rewritten with
      that change. Owner SMDurgan, tracked at #2079.
    note: >-
      ADR 0028's outbound voice gate. Registered here BEFORE it is rewritten,
      because its absence from this registry was itself an instance of the class
      this registry exists to expose: a live, fail-closed control on the outbound
      path that no ledger listed. It is wired (enforce.py invokes it on an
      autonomous outside external_send) but unprobed — nothing demonstrates it
      withholds on a live turn.
      Its current pass condition is bound to mechanism B: it requires the
      structural-diff transform to have run this turn, and binds only when
      `voice_library` is non-empty — authored on all eight customer.yaml files.
      Since no seat carries any transform samples, the gate is presently
      DOWNGRADING every autonomous outside send to draft on every one of them,
      fail-closed and correct but for a reason nobody chose. ADR 0083 repoints it
      at output-class conformance; that rewrite MUST land in the same change that
      removes mechanism B, or the marker it waits on becomes permanently absent
      and every voice-authored seat freezes at draft silently.

  spec_applier:
    control: spec_applier
    class: emitter
    substrate_module: overlay:spec_applier/applier.py
    # EMPTY BY NECESSITY, not by omission. `wired_via` names a hook in
    # overlay-hook-surface.json, and this control has none: it is a ROOT process
    # forked by entrypoint.sh, running outside the agent's dispatch path
    # entirely — the same shape as config_applier, which for the same reason
    # appears in no hook surface. Naming the fork site here would invent a hook
    # that does not exist and break the surface cross-check. What it delivers IS
    # reachable from a registered control: spec_read_mark, immediately below,
    # consults the tree this installs.
    wired_via: ''
    live_probe: ''
    probe_surface: ''
    status: unprobed
    owner: SMDurgan
    tracking: '#2084'
    candidate_probe: seat_spec_applier_refuses_bad_hash
    risk_review: >-
      2026-08-17 (ss#2387): probe authored, driver NOT authored, so it holds.
      Note the probe shape this control needs is fail-STATIC, not fail-closed:
      the pass condition includes that the previously installed tree keeps
      serving, so a refusal-only driver would miss half of it. Owner SMDurgan,
      tracked at #2084.
    note: >-
      ss ADR 0083. Pulls the portal-written vaults/<slug>/output-classes.json,
      verifies each body against its declared sha256, and installs a root-owned
      spec tree plus a ROOT-COMPUTED manifest at ${SMD_SPEC_DIR}. Fail-static: a
      malformed or hash-mismatched document installs nothing and the previously
      installed tree keeps serving, because "refuse the update" and "remove the
      spec" are different outcomes and only the first is ever right here — the
      second would silently convert an authored class into an unauthored one.
      UNPROBED, stated plainly: nothing yet demonstrates on a live seat that a
      published spec arrives, that a rejected one is refused, or that the tree
      survives a restart. Those are #2084's three runtime acceptance criteria and
      they are proven by observation on hermes-ashton-price, not by this entry.
      The structural half IS enforced at boot — spec_dir_ownership refuses to
      serve a tree writable by the agent uid — which is a different guarantee
      from "the poller works", and conflating them is what this registry exists
      to prevent.

  spec_read_mark:
    control: spec_read_mark
    class: dispatch-guard
    # Path corrected 2026-08-10: this said plugins/hermes-smd-trust/spec_gate.py,
    # but overlay#212 relocated the gate to shared/ (hyphenated plugin dirs are
    # not dotted module paths, so two plugins cannot import each other). The
    # conformance test only existence-checks `ss-console:`-prefixed modules, so
    # an `overlay:` path can rot unnoticed — it did, for nine days.
    substrate_module: overlay:shared/spec_gate.py
    wired_via: 'pre_tool_call / hermes-smd-trust'
    live_probe: seat_audit_spec_gate_triggered_rows
    probe_surface: staging
    status: enforced
    owner: SMDurgan
    tracking: '#2084'
    note: >-
      ss ADR 0083. The enforcement half of the spec loader. Producer is the trust
      plugin's EXISTING pre_tool_call (plugins/hermes-smd-trust/spec_read.py): a
      read_file under ${SMD_SPEC_DIR} whose bytes still hash to the ROOT-OWNED
      manifest marks shared.spec_status for that turn, cleared at every
      pre_llm_call. Consumer fires at the same site as the voice gate, on an
      allowed AUTONOMOUS send, and downgrades to draft when the class the send
      belongs to declares output_classes.<class>.voice_spec: expected and the
      spec was not read this turn. Verification is against the manifest and NEVER
      against the SKILL.md stamp: profiles/<slug>/skills is hermes-owned, so an
      agent could rewrite its own stamp and forge both the pointer and the hash —
      the stamp is delivery, the manifest is enforcement, and a gate that trusted
      the stamp would be self-certifying. NOW BOUND, and the "bound nowhere"
      note this entry carried until 2026-08-01 is retired: pilot-smokeball
      declares staff AND work_product at voice_spec: expected, live in the
      projection at vfy_01KYZK1WCKAT6RV57VJB8W29QF. ENFORCED as of 2026-08-10,
      and the `unprobed` this entry carried is retired by an observation nobody
      wanted: the gate fired on EVERY autonomous staff send on pilot-smokeball
      from 08-04 to 08-09 — SPEC_GATE_TRIGGERED rows, reason spec_not_read,
      output_class staff — because the seat declared a staff voice spec that was
      never installed (ss#2228, vfy_01KZP6JY5481272X5GZZDW5XT7). The control was
      real; what it did was wrong. AMENDED BEHAVIOUR (ss#2234, Captain ruling):
      a declared-but-never-installed spec is a broken control whose cost now
      depends on who is waiting — staff proceeds in the persona's own authored
      register, outbound routes to a human, work_product and record still
      refuse. Tamper and an unreadable manifest refuse everywhere. The alarm is
      no longer this gate's audit row (nobody reads those, which is how six days
      passed): shared/spec_control_check.py reports declared-vs-installed on the
      heartbeat and the fleet-alerts worker opens spec_control_broken.

  draft_delivery_gate:
    control: draft_delivery_gate
    class: dispatch-guard
    substrate_module: overlay:plugins/hermes-smd-drafting/__init__.py
    # A TOOL the agent calls, not a hook fired around one — so `wired_via` takes
    # the `tool /` form rather than naming a hook that does not exist. That form
    # is not an exemption from the surface cross-check: it swaps one check for
    # another, because a hook fires whether or not anyone asked while a tool runs
    # only if something in the agent's context says to. test_tool_wired_controls_
    # are_actually_instructed asserts a shipped skill or the drafting discipline
    # names it; a control nothing invokes is inert however good its code is.
    wired_via: 'tool / smd_deliver_draft'
    live_probe: seat_probe_refuses_unread_work_product
    probe_surface: staging
    status: enforced
    owner: SMDurgan
    tracking: '#2094'
    note: >-
      ss ADR 0083. The spec gate for the two classes nothing can derive. Its
      sibling spec_read_mark binds on external_send*, where the recipient is in
      the tool call and the trust decision already resolved it; work_product and
      record have no recipient, and probing settled that the runtime cannot
      infer one — pre_tool_call carries only tool_name/args/task_id/session_id/
      tool_call_id, content_ceiling has no runtime counterpart at all, and the
      one skill-name resolver is dead code documented "never an entitlement
      input" (vfy_01KYZF6CYFRQ9SJDWQF0FDNX7W). So the lane DECLARES its class by
      calling a tool that means it, rather than being guessed at from a generic
      write that create_memo also serves for chronology rows. Runs the same
      shared.spec_gate.check_spec_gate as its sibling, with output_class passed
      explicitly; an explicit class only selects WHICH authored declaration is
      consulted and can never manufacture one, which is what makes accepting it
      from a tool handler safe. ACCEPTED LIMIT, registered here rather than left
      to be discovered: a drafter that calls mcp_smokeball_create_memo directly
      delivers ungated. That is visible in the audit log and not prevented —
      the failure this catches is a model that forgot to read its spec, not an
      adversary routing around a control, and the adversary case (an
      agent-writable spec as a persistent injection channel) is closed by root
      ownership in #2084. ENFORCED, manual-observed 2026-08-01 on
      hermes-pilot-smokeball at SMD_OVERLAY_REF=1594f687
      (vfy_01KYZNTJAEST5HEVJATYFY9ED3): with work_product declared
      voice_spec: expected and SMD_SPEC_DIR root-owned and EMPTY, a work_product
      delivery on a turn with no read was REFUSED, carrying the
      internal-artifact wording rather than the send wording; the same call for
      an undeclared class was ALLOWED, which is the trust property observed live
      — an explicit output_class selects which declaration is consulted and
      cannot manufacture one. READ THE PROBE'S LIMITS BEFORE TRUSTING THE
      STATUS. It is MANUAL: someone ran seat-probe against the gateway's env, so
      it proves the control fired once, NOT that a regression would be caught.
      There is no boot gate on this one. It also ran outside a full agent turn,
      so the audit row did not emit — the broker refused the append because the
      caller was not the gateway process, and the gate logged exactly that while
      stating the downgrade still stands, which is the fail-closed-on-audit-
      failure path behaving correctly. A real turn emits the row. The other half
      of the feature, a draft delivered IN the declared voice, is still
      unobserved: it needs a spec in the vault, authored through the portal.

  identifier_gate:
    control: identifier_gate
    class: dispatch-guard
    substrate_module: overlay:plugins/hermes-smd-trust/outbound.py
    wired_via: 'pre_tool_call / hermes-smd-trust'
    live_probe: seat_probe_refuses_unread_identifier
    probe_surface: staging
    status: enforced
    owner: SMDurgan
    tracking: '#2171'
    note: >-
      The A1 identifier-integrity gate, REFUSING as of overlay#226 (report-only
      before that — Captain directive 2026-08-02: every seat blocking,
      pre-live). Block set is every IdKind except NAME, by exclusion; ambient
      dates (utc today/yesterday) verify against the system clock; the
      empty-register carve applies to the DRAFT gate only — the SEND gate
      blocks with an empty register, because an autonomous send composed with
      nothing read is exactly "cannot verify". Rollback lever:
      SMD_IDENTIFIER_GATE_MODE=report (operator-only env, consumes.yaml-
      declared, never client-authorable; unset or garbage = block; rows keep
      emitting in either mode — telemetry continuity). Rollback runbook:
      `fly secrets set SMD_IDENTIFIER_GATE_MODE=report -a hermes-<slug>` +
      restart (minutes) vs pin revert + reprovision (slow path). ENFORCED,
      manual-observed 2026-08-09 on BOTH product seats at
      SMD_OVERLAY_REF=ba6d116a: pilot-smokeball
      (vfy_01KZMK0Q0EHQ0M6AJQ8VBA795G) — fabricated A-number draft BLOCKED
      with the re-read refusal message, read-then-draft same identifier
      ALLOWED, env=report downgrade ALLOWED, send-gate-with-empty-register
      BLOCKED, and audit-failure-never-rescinds observed live (the broker
      refused the probe's non-gateway append; the block stood);
      smd-staging (vfy_01KZMR2MFRD51AV5MPA90A4YSR) — fabricate BLOCKED /
      pass-direction ALLOWED on the same pin. READ THE PROBE'S LIMITS: MANUAL
      probes drove the deployed plugin in the gateway env via seat-probe, so
      they prove the deployed code's decision at the seam, not that a
      regression would be caught (no boot gate), and the probe rows did not
      land in audit_log (broker provenance control — correct); organic
      gateway turns emit rows normally, with the new mode/blocked/
      block_bypass/date_distance metadata. Pre-flip blast radius
      (vfy_01KZKXFSC72HNT48EJD6MJAYDX): 40/40 post-extraction-fix rows were
      DATE-kind cron memo composition — the audited fabrication class, not an
      FP class. FP watch: date_distance buckets + block_bypass make the
      carve and the DATE class measurable post-flip.

  taint_gate:
    control: taint_gate
    class: dispatch-guard
    substrate_module: overlay:plugins/hermes-smd-trust/enforce.py
    wired_via: 'pre_tool_call / hermes-smd-trust'
    live_probe: ''
    probe_surface: ''
    status: unprobed
    owner: SMDurgan
    tracking: ADR-0050:B0
    candidate_probe: seat_taint_blocks_autonomous_send
    risk_review: >-
      2026-08-17 (ss#2387): probe authored, driver NOT authored, so it holds. The
      verified hole (untrusted content read through the code-execution channel)
      is closed in code and unproven at runtime; the residual delegate_task
      result-laundering path is not covered by the authored probe at all and
      needs design before it can be. Owner SMDurgan, tracked at ADR-0050:B0.
    note: >-
      Sticky SessionTaint gate (an untrusted-fed turn cannot autonomously
      send/destroy/exec). ADR 0050 B0's MAIN bypass is now CLOSED + LIVE: the
      verified hole was untrusted content read via the code-execution channel
      (execute_code/terminal/process/computer_use), which is not in the fenced-
      read allowlist, so reading injected content in code left the session
      untainted and an autonomous send allowed. overlay#105 taints that channel;
      shipped to customer-zero 2026-06-19 (OVERLAY_REF af20ecd, invariant_8
      activation PASS). (The original "delegate_task child runs untainted" framing
      here was WRONG — a tainted parent is already taint-gated from delegating;
      the real channel was execute_code.) RESIDUAL: delegate_task result-
      laundering (a child's untrusted read returning in its result) needs separate
      design — tracked, not closed. STATUS stays `unprobed`: the fix is live in
      code but no negative-fire probe proves the taint blocks on a real turn —
      that probe is Component 3, folded into the B3 review.

  # ---- the sticky-stop arms (the motivating class, now partly wired) ----
  # All four arms live in safety-substrate/sticky_stop.py, vendored into the
  # overlay as shared/sticky_stop.py (a tracked pair in overlay-pairs.json since
  # 2026-09-10). The cost arm is enforced through shared/cost_breaker.py; the
  # tool-failure and refusal arms are unprobed; the time-budget arm is inert.
  # Nothing in ss-console calls the module; the overlay is where it runs.
  sticky_stop_cost_cap:
    control: sticky_stop_cost_cap
    class: circuit-breaker
    substrate_module: safety-substrate/sticky_stop.py
    # Enforcement spans the job-worker thread + the webhook gate, but the
    # DOMINANT (interactive) path is metered at post_llm_call, which is the hook
    # named here for the hook-surface check. Full wiring is in the note.
    wired_via: 'post_llm_call / hermes-smd-audit'
    live_probe: cost_breaker_boot_probe
    probe_surface: prod-boot
    status: enforced
    owner: SMDurgan
    note: >-
      WIRED (ADR 0062): shared/cost_breaker.py enforces the job-path exact-cents
      cap at shared/job_segment.py (HARD_STOP dead-letters the job to
      needs_review); shared/interactive_cost_meter.py meters every interactive
      turn at post_llm_call (the dominant spend path, ADR 0062 §4) into the SAME
      ladder; the webhook-gate InboundWakeGuard parks verified inbound at
      HARD_STOP or past the authored inbound_daily_cap; the heartbeat carries
      sticky_stop_level; the Captain clear surface (POST /sticky-stop/clear +
      console admin clear-stop, ADR 0062 §6) resets it. $50/day
      (cost_daily_cents=5000) default, authored per seat via customer.yaml
      safety.sticky_stop; Machine-local sqlite persistence. PROBED:
      cost_breaker_boot_probe (overlay run_boot_probe, driven by the
      gateway:startup activation handler, overlay#133) proves on EVERY boot, in
      a throwaway db, that the ladder trips HARD_STOP and assert_allowed then
      refuses — the handler _die()s (os._exit(1), bypassing the hook registry's
      raise-swallowing) if the probe returns not-ok, so an inert breaker crash-
      loops the gateway rather than serving ungoverned. run_boot_probe is itself
      exception-proof (broad except -> return (False, reason)), so there is no
      path where the breaker is inert and the Machine still serves — the same
      fail-closed prod-boot standard as trust_ceiling and audit_emission.
      VERIFIED LIVE 2026-07-05: hermes-smd reprovisioned to OVERLAY_REF
      c85b0ddb (ss#1719) and booted healthy through the probe twice (deploy +
