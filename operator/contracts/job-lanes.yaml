# ============================================================================
# The job lanes: ONE declaration, generated into Python, TypeScript and shell.
# ============================================================================
#
# WHY THIS EXISTS (2026-11-12, wave 1 item 1.5). A job lane (a paid or queued
# job the jobs runner executes for a firm) was named in about forty files: the
# gateway's capability table, the broker's delivery-proof set, the runner's
# queue and pid tables, the fleet tools' firm-input tables, the console's
# heartbeat parser, the boot scripts. Each list was a hand copy, and several
# legitimately differ (the lanes with a request card, the lanes with firm
# inputs). Each difference is a named column below, not another hand list, so
# adding a lane is one entry here and lists cannot disagree.
#
# THE RULE. Edit this file, then run
#     python3 operator/bin/gen-job-lanes.py
# which writes, each with a GENERATED header:
#   operator/runners/jobs/jobs/job_lanes.py          (the jobs bundle)
#   operator/workspace_broker/job_lanes.py           (the broker)
#   operator/hermes-smd-overlay/shared/job_lanes.py  (the gateway)
#   operator/bin/lib/job_lanes.py                    (the laptop fleet tools)
#   src/lib/operator/job-lanes.generated.ts          (the console)
#   operator/templates/_job-lanes.generated.sh       (shell, bash 3.2 safe)
# One Python module per install tree because the trees cannot import one
# another on a seat (the same reason operator/contracts/seat-layout.yaml
# generates four). `--check` fails on a stale output;
# operator/bin/tests/test_job_lanes_generation.py runs it in CI.
#
# ORDER IS DECLARED. Every generated sequence keeps the order of `lanes:` below.
# It is the gateway's tool-registration order (shared/capabilities.py JOB_LANES,
# which hermes-smd-lanes walks to register each lane's tools), so changing it
# changes the order of the tools the model sees.
#
# COLUMNS (each lane; absent means "no" / "none")
#   skill            the skill whose being enabled authors the lane
#   queued           true: the runner takes its jobs from a queue under the
#                    run dir (lane-proof and the stop tool cover it), so it has
#   queue_dir          that queue,
#   jobs_dir           its job dirs (a finished job's envelope),
#   child_pid          and its child pid file. The chronology's predate the
#                      other lanes and carry no prefix.
#   wake_word        the word a job's completion wake uses ("<word> job <ULID>")
#   scheduled        a wake may be a scheduled run's (no request email)
#   request_card     the lane writes a request card row (shared/request_cards.py)
#   email_label      what a person calls the lane's work in a card email
#   audit_prefix     the audit action_type prefix the broker writes (work-health)
#   firm_inputs      file | dir: the lane's firm inputs in the vault, one file
#                    (<lane>-firm.yaml) or a directory (<lane>/<lane>-firm.yaml)
#   firm_module      the runner module whose validate() judges those inputs
#   broker_firm_copy the applier also writes <lane>-broker-firm.yaml for the broker
#
# firm_input_extras: firm inputs that are not job lanes (the attorney roster).
# ============================================================================

lanes:
  medchron:
    skill: medical-chronology-maintainer
    queued: true
    queue_dir: queue
    jobs_dir: jobs
    child_pid: child.pid
    wake_word: chronology
    request_card: true
    email_label: chronology
    audit_prefix: MEDCHRON
    firm_inputs: file
    firm_module: jobs.medchron.config

  demand:
