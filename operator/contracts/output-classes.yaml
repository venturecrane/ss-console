  paid-media-anomaly-watcher:
    internal:
      - { artifact: slack_digest, seam: slack, class: staff }
      - { artifact: client_note, seam: slack, class: staff }
    outbound: none # the client note is owner-triggered and owner-sent
  retainer-hours-reconciler:
    internal:
