# ============================================================================
# Negative-fire probe specs (ss#2387, Component 3 of the runtime-control
# harness). One entry per named probe; `control` points back at the row in
# runtime-controls.yaml that the probe speaks for.
#
# WHY THIS FILE EXISTS. runtime-controls.yaml already forbids a control from
# shipping silently absent or silently undocumented. What it could not do is
# make a STATUS falsifiable: `live_probe: trust_blocks_banned_send` was a name
# with nothing behind it, and "manual-observed" proves a control fired once, not
# that a regression would be caught. This file is the spec half of the probe
# suite; operator/bin/control-probes.py is the runner.
#
# THIS SUITE WIRES NOTHING. It is the same wires-nothing subset the registry
# declares. An inert control stays inert: its probe is expected to FAIL, the
# runner records EXPECTED_FAIL, and that is the honest reading of a control with
# no dispatch caller, not a gap in the probe. The failure mode this file is
# built to avoid is the opposite one: a probe that reports green because it
# never asked a question that could come back no.
#
# KINDS, and what each one licenses:
#   local  - runs here, offline, against the in-repo substrate module. Proves the
#            substrate REFUSES the planted violation. Does NOT prove the live
#            dispatch path invokes the substrate: that is the whole distinction
#            the registry exists to hold, and a local green must never be read as
#            a live green.
#   seat   - needs a live seat, because the implementing code is overlay-resident
#            and is only reachable through the running gateway. The runner
#            executes it only with `--seat <slug>`; with no driver authored it
#            reports HOLD, which is loud, and never a silent pass.
#   boot   - already executed on the seat by the overlay gateway:startup
#            activation handler on EVERY boot, which os._exit(1)s when the probe
#            returns not-ok. The runner cannot run these from here; it reports
#            HOLD with the observation command, because "somebody else's gate
#            watches this" is a claim a reader should be able to check.
#
# FIELDS:
#   probe          - stable id; must equal the map key, and must be the name the
#                    registry cites in `live_probe` or `candidate_probe`.
#   control        - the runtime-controls.yaml control this probe speaks for.
#   kind           - local | seat | boot.
#   violation      - the synthetic violation the probe plants, in one sentence.
#                    Written so a reader can tell whether the question could come
#                    back no.
#   expect         - refuse | flag | expected-fail. `expected-fail` says the
#                    control is declared inert, so the probe SHOULD come back
#                    not-fired; a fired result there is a finding about the
#                    registry, not a celebration.
#   runner         - local only: the implementation id in control-probes.py.
#   arm            - local caller-search probes only: which substrate arm.
#   seat_command   - seat only: argv passed to operator/bin/seat-probe.sh. An
#                    empty list means NO DRIVER IS AUTHORED YET, and the runner
#                    holds rather than inventing one.
#   expect_pattern - seat only: regex the driver output must match to count as
#                    fired.
#   observe        - boot only: the command a human runs to see the boot gate's
#                    verdict on a real seat.
#   proves         - what a green result licenses, stated narrowly.
#   limits         - what a green result does NOT license.
#
# ENFORCEMENT: operator/bin/tests/test_runtime_control_conformance.py pins the
# linkage (an enforced row must name a probe that exists here; every control
# must be named by at least one probe) and operator/bin/tests/test_control_probes.py
# pins that the runner can come back red.
# ============================================================================

maintainer: SMDurgan

probes:
  # ---- local: run here, offline, against the in-repo substrate --------------
  substrate_cost_ladder_refuses:
    probe: substrate_cost_ladder_refuses
    control: sticky_stop_cost_cap
    kind: local
    violation: >-
      Meter spend past 200% of the authored daily cap through record_cost_cents,
      then ask assert_allowed for permission to act.
    expect: refuse
    runner: sticky_stop_cost_ladder
    proves: >-
      The vendored ladder still climbs to HARD_STOP on the authored cap and
      assert_allowed still raises StickyStopError there. A neutered breaker
      (the shape that would let a seat serve ungoverned) is caught here, in CI,
      on the commit that neutered it.
    limits: >-
      Says nothing about the live seat. The live half is cost_breaker_boot_probe,
      which runs in the overlay against the overlay's own twin.

  substrate_pause_pin_refuses:
    probe: substrate_pause_pin_refuses
    control: operator_pause
    kind: local
    violation: >-
      Pin the persisted ladder at HARD_STOP the way the portal pause does, then
      ask assert_allowed for permission to run a plain read.
    expect: refuse
    runner: sticky_stop_pause_pin
    proves: >-
      A pinned HARD_STOP row is refused by the same assert_allowed the tool wall
      calls, so the pause and the cost trip really do ride one ladder.
    limits: >-
      Local only. The live pause path (portal to console proxy to gate) is
      operator_pause_negative_fire, and no wake path on a paused seat has yet
      reached the tool wall for it to refuse.

  tool_failure_arm_has_no_dispatch_caller:
    probe: tool_failure_arm_has_no_dispatch_caller
    control: sticky_stop_tool_failure
    kind: local
    arm: record_tool_failure
    violation: >-
      Drive the consecutive-failure ladder to HARD_STOP, then search the tree for
      any non-test caller that would drive it on a real turn.
    expect: expected-fail
    runner: sticky_stop_arm_unwired
    proves: >-
      Nothing. That is the point: the ladder is healthy and nobody calls it, so
      the probe comes back not-fired and the registry's `inert` is confirmed
      rather than asserted. If a caller ever appears, this flips to
      UNEXPECTED_PASS and the registry row is wrong.
    limits: >-
      The caller search covers ss-console only. A wiring that lands in the
      overlay flips the registry row, not this probe; the same cross-repo limit
      overlay-pairs.json documents.

  refusal_cascade_arm_has_no_dispatch_caller:
    probe: refusal_cascade_arm_has_no_dispatch_caller
    control: sticky_stop_refusal_cascade
    kind: local
    arm: record_refusal
    violation: >-
      Drive the refusal-cascade ladder to HARD_STOP, then search the tree for any
      non-test caller that would drive it on a real turn.
    expect: expected-fail
    runner: sticky_stop_arm_unwired
    proves: >-
      Confirms `inert` rather than asserting it, and turns the day a caller
      appears into a red run instead of a silent status drift.
    limits: >-
      ss-console only, as above.

  time_budget_arm_has_no_dispatch_caller:
    probe: time_budget_arm_has_no_dispatch_caller
    control: sticky_stop_time_budget
    kind: local
    arm: record_runtime_seconds
    violation: >-
      Report a single run past the 3600s wall-clock budget, then search the tree
      for any non-test caller that would report it on a real turn.
    expect: expected-fail
    runner: sticky_stop_arm_unwired
    proves: >-
      Confirms `inert` rather than asserting it.
    limits: >-
      ss-console only, as above.

  # ---- boot: already probed on every gateway boot, by the overlay -----------
  trust_blocks_banned_send:
    probe: trust_blocks_banned_send
    control: trust_ceiling
    kind: boot
    violation: >-
      Drive a real pre_tool_call with a permanently banned send tool during the
      gateway:startup activation handler.
    expect: refuse
    observe: 'fly logs -a hermes-<slug> | grep -i activation'
    proves: >-
      On the seat, on every boot, that the trust ceiling refuses a banned send;
      the handler os._exit(1)s when it does not, so an ungoverned gateway
      crash-loops instead of serving.
    limits: >-
      Runs in the overlay, not from here. This runner reports it as HOLD with the
      observation command rather than claiming somebody else's green.

  audit_writes_row:
    probe: audit_writes_row
    control: audit_emission
    kind: boot
    violation: >-
      Drive a real post_llm_call during activation and compare audit_log row
      counts before and after.
    expect: flag
    observe: 'fly logs -a hermes-<slug> | grep -i activation'
    proves: >-
      On the seat, on every boot, that the audit emitter actually writes; the
      handler os._exit(1)s when the row count does not move.
    limits: >-
      Overlay-side. Reported here as HOLD, never as this suite's green.

  cost_breaker_boot_probe:
    probe: cost_breaker_boot_probe
    control: sticky_stop_cost_cap
    kind: boot
    violation: >-
      In a throwaway db at boot, climb the cost ladder to HARD_STOP and call
      assert_allowed.
    expect: refuse
    observe: 'fly logs -a hermes-<slug> | grep -i "boot probe"'
    proves: >-
      That the breaker on the SEAT is live at boot, which the local ladder probe
      cannot say.
    limits: >-
      Overlay-side (overlay run_boot_probe, overlay#133). Reported here as HOLD.

  # ---- seat: overlay-resident, reachable only through a running gateway -----
  seat_audit_spec_gate_triggered_rows:
    probe: seat_audit_spec_gate_triggered_rows
    control: spec_read_mark
    kind: seat
    violation: >-
      On a seat declaring a voice_spec for the output class, attempt an
      autonomous send on a turn that never read the spec, and require a
      SPEC_GATE_TRIGGERED row plus a downgrade to draft.
    expect: flag
    seat_command: []
    expect_pattern: ''
    proves: >-
      Nothing yet. No driver is authored, so the runner HOLDS.
    limits: >-
      The status the registry carries for this control today rests on an
      observation of production rows (ss#2228), not on a repeatable probe.

  seat_probe_refuses_unread_work_product:
    probe: seat_probe_refuses_unread_work_product
    control: draft_delivery_gate
    kind: seat
    violation: >-
      Call smd_deliver_draft with output_class=work_product on a turn with no
      spec read, and require a refusal carrying the internal-artifact wording.
    expect: refuse
    seat_command: []
    expect_pattern: ''
    proves: >-
      Nothing yet. No driver is authored, so the runner HOLDS.
    limits: >-
      The registry's enforced status here is MANUAL-OBSERVED
      (vfy_01KYZNTJAEST5HEVJATYFY9ED3): it proves the control fired once, not
      that a regression would be caught.

  seat_probe_refuses_unread_identifier:
    probe: seat_probe_refuses_unread_identifier
    control: identifier_gate
    kind: seat
    violation: >-
      Compose a draft carrying a fabricated matter number that was never read
      this turn, and require the re-read refusal.
    expect: refuse
    seat_command: []
    expect_pattern: ''
    proves: >-
      Nothing yet. No driver is authored, so the runner HOLDS.
    limits: >-
      The registry's enforced status here is MANUAL-OBSERVED on two seats
      (vfy_01KZMK0Q0EHQ0M6AJQ8VBA795G, vfy_01KZMR2MFRD51AV5MPA90A4YSR).

  operator_pause_negative_fire:
    probe: operator_pause_negative_fire
    control: operator_pause
    kind: seat
    violation: >-
      Pause the seat through the portal path, then drive a turn and require the
      gate to refuse it, then clear and require recovery.
    expect: refuse
    seat_command: []
    expect_pattern: ''
    proves: >-
      Nothing yet. No driver is authored, so the runner HOLDS.
    limits: >-
      Pausing a seat is an act with a client-visible effect, so this probe is
      staging-only and must never be scheduled against a production seat.

  seat_inbound_boundary_withholds:
    probe: seat_inbound_boundary_withholds
    control: inbound_trust_boundary
    kind: seat
    violation: >-
      Deliver an inbound webhook payload carrying instruction-shaped content from
      an unverified sender, and require the boundary to withhold it from the
      autonomous path.
    expect: refuse
    seat_command: []
    expect_pattern: ''
    proves: >-
      Nothing yet. No driver is authored, so the runner HOLDS, and the registry
      row stays `unprobed`.
    limits: >-
      Overlay-resident (hermes-smd-webhook-router); no in-repo twin can stand in
      for it.

  seat_voice_gate_downgrades:
    probe: seat_voice_gate_downgrades
    control: voice_gate
    kind: seat
    violation: >-
      Attempt an autonomous outside external_send on a seat with a non-empty
      voice_library and no transform run this turn, and require the downgrade to
      draft.
    expect: flag
    seat_command: []
    expect_pattern: ''
    proves: >-
      Nothing yet. No driver is authored, so the runner HOLDS.
    limits: >-
      The gate is being repointed at output-class conformance by ADR 0083; a
      probe authored against mechanism B would have to be rewritten with it.

  seat_spec_applier_refuses_bad_hash:
    probe: seat_spec_applier_refuses_bad_hash
    control: spec_applier
    kind: seat
    violation: >-
      Publish an output-class document whose body does not match its declared
      sha256, and require the applier to install nothing while the previously
      installed tree keeps serving.
    expect: refuse
    seat_command: []
    expect_pattern: ''
    proves: >-
      Nothing yet. No driver is authored, so the runner HOLDS.
    limits: >-
      Fail-static, not fail-closed: the pass condition includes that the OLD tree
      survives, which a refusal-only probe would miss.

  seat_taint_blocks_autonomous_send:
    probe: seat_taint_blocks_autonomous_send
    control: taint_gate
    kind: seat
    violation: >-
      Read untrusted content through the code-execution channel, then attempt an
      autonomous send on the same session, and require the taint gate to refuse.
    expect: refuse
    seat_command: []
    expect_pattern: ''
    proves: >-
      Nothing yet. No driver is authored, so the runner HOLDS.
    limits: >-
      Covers the closed channel only. The residual delegate_task
      result-laundering path needs its own design before it can be probed.

  seat_review_suspends_past_threshold:
    probe: seat_review_suspends_past_threshold
    control: read_volume_gate
    kind: seat
    violation: >-
      Drive an opposing-response review on the pilot seat with a fixture set
      whose distinct-document pages exceed settings.review_threshold_pages, and
      require the crossing read to be REFUSED (audit reason READ_VOLUME_GATE)
      with the surface-only note directive; drive an under-threshold set and
      require the review to complete with zero gate rows; remove the setting
      and require the same over-set to proceed; set
      SMD_READ_VOLUME_GATE_MODE=report and require exactly one allowed report
      row and no block; drive the SPINE path (email -> matter-inbox-router
      executing the review procedure, marked by the SKILL.md read) and require
      the gate to fire there too.
    expect: flag
    seat_command: []
    expect_pattern: ''
    proves: >-
      PROVEN MANUALLY 2026-08-28 night on pilot-smokeball at overlay 29eac2c7
      (driver: hermes -p operator cron one-shots + fixture PDFs on seed
      matters): OVER refused at the crossing with the surface-note directive
      (vfy_01M15KHR2XVQB6S57W33D2AVZF), UNDER completed with zero gate rows
      (vfy_01M15KTZFHKMYTJD16DGJ9TTB2), REPORT proceeded unblocked
      (vfy_01M15QGMS4YPHKK0KWSBP2GK4K; report-row gap = overlay#332). Manual
      probes prove the deployed code's decision at the seam, not that a
      regression would be caught - no automated driver exists yet.
    limits: >-
      The placement and both-ways falsifiers are pinned by overlay
      tests/test_read_volume_gate_placement.py; this probe is about the
      behavior on a provisioned seat with the live config chain, which no
      unit test can stand in for. The spine-path case is the load-bearing one
      (a webhook-only rehearsal proves a route the client seat does not use).
  seat_entitlement_lowered_downgrades:
    probe: seat_entitlement_lowered_downgrades
    control: entitlement_dial
    kind: seat
    violation: >-
      As a portal principal, lower a send-class routine, run it, and require a
      draft instead of a send; then raise it back and require the send; then
      restart the Machine and require the level to hold.
    expect: flag
    seat_command: []
    expect_pattern: ''
    proves: >-
      Nothing yet. No driver is authored, so the runner HOLDS, and the registry
      row stays `unprobed`.
    limits: >-
      The write-clamp and read-clamp arms are pinned by overlay tests; this probe
      is about the client-visible effect, which no test can stand in for.

  # ---- routine 11 runner gates (ADR 0087, ss#2611; driver ss#2614) ----
  # `medchron probe <gate>` on the seat (operator/runners/medchron/medchron/
  # probes.py): a throwaway synthetic matter, the planted violation, the gate
  # module, one REFUSED line. The registry rows stay `unprobed` until the
  # probe has run green on the reprovisioned seat and the verify id is on the row.
  runner_claim_audit_refuses_unsupported_claim:
    probe: runner_claim_audit_refuses_unsupported_claim
    control: medchron_claim_audit
    kind: seat
    violation: >-
      Submit a chronology build whose composed document carries one planted
      claim (a dated treatment entry) that no cited page supports, and require
      the audit loop to mark it unsupported, fail repair, and refuse delivery
      while it stands.
    expect: refuse
    seat_command: ['/opt/medchron/.venv/bin/medchron', 'probe', 'claim_audit']
    expect_pattern: '^REFUSED claim_audit'
    proves: >-
      On a provisioned seat: the installed runner package, the same one the
      daemon runs jobs with, refuses the planted violation through the gate
      module the registry names (ss#2614). Offline and $0; the seat driver
      runs it as the hermes uid, so a green here is the live package, not
      a laptop checkout.
    limits: >-
      The audit's page-render comparison is exercised on every delivered
      package, but a run that passes proves only that its own claims held; this
      probe is about a planted violation being caught on a provisioned seat,
      which no delivery can stand in for.
  runner_extractive_gate_refuses_characterization:
    probe: runner_extractive_gate_refuses_characterization
    control: medchron_extractive_gate
    kind: seat
    violation: >-
      Plant a causation and a valuation sentence in a composed chronology and a
      vendor order form in an exhibit, and require the extractive sweep to
      refuse the sentences and the strip to remove the form before delivery.
    expect: refuse
    seat_command: ['/opt/medchron/.venv/bin/medchron', 'probe', 'extractive']
    expect_pattern: '^REFUSED extractive'
    proves: >-
      On a provisioned seat: the installed runner package, the same one the
      daemon runs jobs with, refuses the planted violation through the gate
      module the registry names (ss#2614). Offline and $0; the seat driver
      runs it as the hermes uid, so a green here is the live package, not
      a laptop checkout.
    limits: >-
      The agreement's section 2.3(c) cap is a content property; a green here
      proves the planted shapes are caught, not that every characterization
      shape is.
  runner_cross_client_gate_refuses_foreign_page:
    probe: runner_cross_client_gate_refuses_foreign_page
    control: medchron_cross_client_gate
    kind: seat
    violation: >-
      On a two-unit matter, plant a record naming the other client and not the
      unit's own, and require the identity check to move it out of the unit and
      disclose the move, and the billing chart to quarantine its charges.
    expect: refuse
    seat_command: ['/opt/medchron/.venv/bin/medchron', 'probe', 'cross_client']
    expect_pattern: '^REFUSED cross_client'
    proves: >-
      On a provisioned seat: the installed runner package, the same one the
      daemon runs jobs with, refuses the planted violation through the gate
      module the registry names (ss#2614). Offline and $0; the seat driver
      runs it as the hermes uid, so a green here is the live package, not
      a laptop checkout.
    limits: >-
      Identity is judged by name and date-of-birth counts in the record's own
      text; a foreign page with neither is outside what this gate can see and
      is the audit's problem, not this probe's.
  runner_provenance_gate_halts_unexplained_file:
    probe: runner_provenance_gate_halts_unexplained_file
    control: medchron_provenance_gate
    kind: seat
    violation: >-
      Pull one record into the run that no unit owns, that is not a byte
      duplicate, not name-excluded, and not an explained orphan, and require
      the coverage gate to halt delivery and name the file.
    expect: flag
    seat_command: ['/opt/medchron/.venv/bin/medchron', 'probe', 'provenance']
    expect_pattern: '^REFUSED provenance'
    proves: >-
      On a provisioned seat: the installed runner package, the same one the
      daemon runs jobs with, refuses the planted violation through the gate
      module the registry names (ss#2614). Offline and $0; the seat driver
      runs it as the hermes uid, so a green here is the live package, not
      a laptop checkout.
    limits: >-
      The gate explains files by name pattern as well as ownership, and a real
      record with a vendor-shaped name can be wrongly explained; that is a
      known limit of the explained list, not something this probe measures.
