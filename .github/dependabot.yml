# Keeps the GitHub Actions pinned to commit SHAs current. Workflows pin every
# `uses:` to a full-length commit SHA (supply-chain hardening; enforced by the
# Semgrep github-actions-mutable-action-tag rule in security.yml). Dependabot
# bumps the SHA and the trailing version comment when a new release ships, so
# the pins stay both immutable and maintained. Dependabot PRs flow through
# .github/workflows/dependabot-auto-merge.yml.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - '*'
    commit-message:
      prefix: chore(actions)

  # npm dependency currency. Previously there was NO npm ecosystem entry, so
  # `security.yml`'s `npm audit` caught known CVEs but nothing surfaced routine
  # version drift (2026-06-30 code review). Grouped + weekly, flowing through
  # .github/workflows/dependabot-auto-merge.yml. Majors (e.g. astro 7,
  # typescript 6) are separated so they get manual review given the SSR/Workers
  # surface; patch/minor group together for low-friction upkeep.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
    # Our own packages on the private GitHub Packages registry. We cut and
    # adopt their versions intentionally as part of coordinated changes —
    # Dependabot is for external currency/security, not our internal releases,
    # and it holds no credential for the private scope (the root npm job fails
    # `private_source_authentication_failure` trying to resolve them). Managed
    # by us, not Dependabot.
    ignore:
      - dependency-name: '@venturecrane/*'
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: npm
    directory: /workers/cost-anomaly
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
    # @cloudflare/workers-types majors must move with wrangler's major
    # (wrangler@4 peer-depends on workers-types@^4), so a standalone
    # workers-types major PR is unmergeable. Bump the two together when the
    # wrangler major lands (that PR is not ignored and will surface for review).
    ignore:
      - dependency-name: '@cloudflare/workers-types'
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: npm
    directory: /workers/cost-telemetry
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
    # @cloudflare/workers-types majors must move with wrangler's major
    # (wrangler@4 peer-depends on workers-types@^4), so a standalone
    # workers-types major PR is unmergeable. Bump the two together when the
    # wrangler major lands (that PR is not ignored and will surface for review).
    ignore:
      - dependency-name: '@cloudflare/workers-types'
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: npm
    directory: /workers/fleet-alerts
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: chore(deps)

  # The seat image's lock-pinned npm installs (operator/npm/<name>/, one
  # directory per tool the Dockerfile installs with `npm ci`; clio-mcp since
  # the 2026-09-25 code review). The Dockerfile pins the top-level version in
  # package.json, so a major is a deliberate edit there; Dependabot keeps the
  # transitive closure current.
  - package-ecosystem: npm
    directory: /operator/npm/clio-mcp
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: chore(deps)

  # The seat image's Python. Until 2026-09-11 no pip ecosystem existed, so the
  # Python that runs on every customer Machine had neither currency nor
  # security bumps surfacing anywhere (2026-09-10 code review, Dependencies
  # HIGH, third review running). operator/requirements/*.txt are the
  # hash-locked files the Dockerfile installs from (compiled by
  # operator/requirements/compile.sh); Dependabot bumps a pin and its hashes
  # together. The pyproject entries keep the declared ranges current; a range
  # bump alone changes nothing on a seat until compile.sh re-resolves it, and
  # bin/tests/test_requirements_pins.py fails when a declared dependency has
  # no pin. Majors separated for manual review, as with npm.
  #
  # ONE OWNER PER FILE SET. The first entry owns operator/requirements/*.txt.
  # The second entry owns the pyproject ranges, and it must not see the
  # requirements files: Dependabot's pip scanner reads a `requirements/`
  # child of every directory it is given, so with /operator in its list the
  # second entry opened a byte-identical twin of every hash-lock PR (#2897
  # and #2898, 2026-09-25 code review, Dependencies 4). `exclude-paths`
  # (repo-root relative) keeps /operator's pyproject covered and hands the
  # .txt files to the entry above alone.
  - package-ecosystem: pip
    directory: /operator/requirements
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      pip-minor-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: pip
    directories:
      - /operator
      - /operator/connectors/_sdk
      - /operator/connectors/_reference
      - /operator/connectors/msgraph-mail
      - /operator/connectors/smokeball
      - /operator/runners/medchron
    exclude-paths:
      - 'operator/requirements/**'
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      pip-minor-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: chore(deps)
