# UI drift audit — per-venture CI gate for the enterprise design system.
#
# Synced from `crane-console/docs/design-system/adoption/audit-workflow.yml.template`
# on 2026-04-25 as part of Stream C5 PR A. SS uses Astro, so the path filter
# includes `**/*.astro` in addition to `.tsx` / `.jsx` / `.css`.
#
# Threshold configuration lives at the repo root in `.ui-drift.json`.
# Initial thresholds (PR A baseline): hex/rgb violations gated to zero;
# raw_tailwind_color_classes_max set with headroom while the codemod (PR B)
# is in flight.

name: ui-drift-audit

on:
  pull_request:
    paths:
      - '**/*.tsx'
      - '**/*.jsx'
      - '**/*.astro'
      - '**/*.css'
      - '.ui-drift.json'
      - '.github/workflows/ui-drift-audit.yml'
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

# Cancel a superseded run when a newer commit lands on the SAME PR branch
# (47% of runs were obsolete on completion, measured 2026-07-27). The
# expression guard evaluates false for `push: main`, so main builds are never
# cancelled by a following merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sync canonical skills from crane-console
        # The audit script lives in crane-console/.agents/skills/ui-drift-audit/.
        # Locally, the launcher (crane-console/packages/crane-mcp/src/cli/launch-lib.ts:1185
        # syncVentureSkills) mirrors it on every `crane <venture>` launch. CI has no
        # launcher, so we sparse-clone canon and stage the script into the expected path.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: venturecrane/crane-console
          sparse-checkout: |
            .agents/skills/ui-drift-audit
          sparse-checkout-cone-mode: false
          path: .crane-canon

      - name: Stage ui-drift-audit script
        run: |
          mkdir -p .agents/skills
          cp -R .crane-canon/.agents/skills/ui-drift-audit .agents/skills/ui-drift-audit
          rm -rf .crane-canon

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '>=3.11'

      - name: Run UI drift audit
        id: audit
        run: |
          set +e
          STATUS_WORDS=""
          if [ -f .ui-drift.json ]; then
            STATUS_WORDS=$(jq -r '.status_words // [] | join(",")' .ui-drift.json)
          fi
          if [ -n "$STATUS_WORDS" ]; then
            python3 .agents/skills/ui-drift-audit/audit.py \
              --format json \
              --status-words "$STATUS_WORDS" \
              --out audit.json
          else
            python3 .agents/skills/ui-drift-audit/audit.py \
              --format json \
              --out audit.json
          fi
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Build PR comment body
        if: github.event_name == 'pull_request'
        id: comment
        run: |
          python3 - <<'PY' > comment.md
          import json
          d = json.load(open("audit.json"))
          t = d["totals"]
          breaches = d.get("threshold_breaches", [])
          lines = []
          status = "FAIL" if breaches else "PASS"
          lines.append(f"### UI drift audit -- {status}")
          lines.append("")
          lines.append(f"- Files audited: {t['files']}")
          lines.append(f"- Raw hex/rgb in JSX: {t['raw_hex_rgb_in_jsx']}")
          lines.append(f"- Raw hex/rgb in inline style: {t['raw_hex_rgb_in_inline_style']}")
          lines.append(f"- Raw Tailwind color classes: {t['raw_tailwind_color_classes']}")
          lines.append(f"- Raw violation candidates: {t['raw_violations']}")
          if breaches:
            lines.append("")
            lines.append("**Threshold breaches**")
            for b in breaches:
              lines.append(f"- `{b['metric']}`: {b['actual']} > {b['max']}")
          else:
            lines.append("")
            lines.append("All thresholds passed.")
          lines.append("")
          lines.append("<sub>Generated by `ui-drift-audit` -- see `.ui-drift.json` to tune thresholds.</sub>")
          print("\n".join(lines))
          PY

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3
        with:
          header: ui-drift-audit
          path: comment.md

      - name: Upload audit JSON
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-drift-audit
          path: audit.json
          if-no-files-found: error

      - name: Enforce threshold gate
        if: steps.audit.outputs.exit_code != '0'
        run: |
          echo "ui-drift-audit threshold gate failed (audit.py exit_code=${{ steps.audit.outputs.exit_code }})"
          exit 1
