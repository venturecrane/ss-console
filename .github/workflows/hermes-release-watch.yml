# Hermes upstream release-watch (ADR 0024 — the lightweight "stay current" signal).
#
# WHY: the fleet drifted 7 weeks / 4 minor versions behind Hermes because the
# cadence was manual ("Captain notices on Discord"). ADR 0024's full CI->GHCR
# golden-image + candidate-build pipeline is over-engineering for a handful of
# SMD-own seats; the right-sized fix is a habit, not a factory. This job is that
# habit: it opens a tracking issue when NousResearch/hermes-agent ships a tag
# different from the one the fleet is pinned to, so the pin can never silently
# rot again. Promotion stays a deliberate, staged human decision (see
# docs/runbooks/operator/hermes-v0.18-upgrade-plan.md). Build the pipeline the
# day seat count actually demands it, not before.
name: hermes-release-watch

on:
  schedule:
    # Weekly, Monday 14:17 UTC (off the :00 mark). Hermes ships ~weekly.
    - cron: '17 14 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare upstream latest vs blessed fleet pin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Blessed fleet pin = the Dockerfile HERMES_UPSTREAM_TAG default
          # (the standing default that new seats provision at).
          BLESSED_TAG="$(grep -oE 'ARG HERMES_UPSTREAM_TAG=[^ ]+' operator/templates/Dockerfile | head -1 | cut -d= -f2)"
          [ -n "$BLESSED_TAG" ] || { echo "could not read blessed HERMES_UPSTREAM_TAG from Dockerfile" >&2; exit 1; }

          # Latest non-prerelease upstream release tag.
          #
          # Read it with retries, then from a SECOND endpoint, before giving up.
          # Run #6 (2026-08-17) died on one bad second: a single `gh api` call came
          # back empty, the job exited 1, and a weekly signal became a critical
          # alert for a GitHub hiccup. The identical call returns v2026.8.18 today.
          #
          # This still fails loudly when upstream is genuinely unreadable — a
          # renamed repo, a revoked token, a changed response shape — because that
          # is the failure the watcher exists to catch: a watcher that quietly
          # exits 0 on an unreadable upstream lets the pin rot invisibly, which is
          # the exact drift ADR 0024 wrote this job to prevent (and the shape of
          # ss#2441, a check that never ran and never said so). What changes is
          # that a transient blip no longer counts as unreadable, and that a real
          # failure now names WHICH read failed and what it returned.
          read_latest_tag() {
            local endpoint="$1" filter="$2" attempt out
            for attempt in 1 2 3; do
              # `|| true`: a non-zero gh must fall through to the retry, not abort
              # the step under `set -e` from inside a command substitution.
              out="$(gh api "$endpoint" --jq "$filter" 2>&1 || true)"
              case "$out" in
                v[0-9]*) printf '%s\n' "$out"; return 0 ;;
              esac
              echo "attempt $attempt on $endpoint returned: ${out:-<empty>}" >&2
              [ "$attempt" -lt 3 ] && sleep $((attempt * 5))
            done
            return 1
          }

          LATEST_TAG="$(read_latest_tag \
            'repos/NousResearch/hermes-agent/releases' \
            '[.[] | select(.prerelease==false)][0].tag_name' || true)"

          if [ -z "$LATEST_TAG" ]; then
            # Different endpoint, same signal. Releases and tags fail independently.
            echo "releases endpoint unreadable after 3 attempts; falling back to tags" >&2
            LATEST_TAG="$(read_latest_tag \
              'repos/NousResearch/hermes-agent/tags' \
              '.[0].name' || true)"
          fi

          [ -n "$LATEST_TAG" ] || {
            echo "could not read latest upstream release tag from releases OR tags after 3 attempts each — see the per-attempt output above" >&2
            exit 1
          }

          echo "blessed=$BLESSED_TAG latest=$LATEST_TAG"

          if [ "$LATEST_TAG" = "$BLESSED_TAG" ]; then
            echo "Fleet is current with upstream ($BLESSED_TAG). No action."
            exit 0
          fi

          # Different tag upstream. Open a tracking issue unless one already
          # exists for this exact latest tag (idempotent — no weekly duplicates).
          EXISTING="$(gh issue list --state open --label hermes-release-watch --search "$LATEST_TAG in:title" --json number --jq 'length')"
          if [ "${EXISTING:-0}" != "0" ]; then
            echo "Tracking issue for $LATEST_TAG already open. No action."
            exit 0
          fi

          # Ensure the label exists (idempotent).
          gh label create hermes-release-watch --color 1D76DB --description "Upstream Hermes release the fleet is behind" 2>/dev/null || true

          REL_URL="https://github.com/NousResearch/hermes-agent/releases/tag/$LATEST_TAG"
          BODY_FILE="$(mktemp)"
          printf '%s\n' \
            "Upstream **$LATEST_TAG** has shipped; the SMD Operator fleet is blessed at **$BLESSED_TAG**." \
            "" \
            "This is a signal, not an auto-upgrade. Evaluate and promote deliberately per the staged runbook \`docs/runbooks/operator/hermes-v0.18-upgrade-plan.md\` (hook-surface diff, build, boot-smoke, staged rollout, bless)." \
            "" \
            "- Release notes: $REL_URL" \
            "- All tags: https://github.com/NousResearch/hermes-agent/tags" \
            "" \
            "Close this issue once the fleet is promoted (or a deliberate hold is recorded)." \
            > "$BODY_FILE"

          gh issue create \
            --title "Hermes upstream $LATEST_TAG available (fleet blessed at $BLESSED_TAG)" \
            --label hermes-release-watch \
            --body-file "$BODY_FILE"
          echo "Opened tracking issue for $LATEST_TAG."
