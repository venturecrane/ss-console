# Reconcile every customer_configs D1 row against the customer.yaml main carries.
#
# WHY (ss#2292). The merge-triggered sync in deploy.yml diffs one push range. A
# range that is never processed — failed deploy, skipped job, force-push,
# rewritten history — is never revisited, because no later push's range contains
# it. On 2026-08-11 the smd-staging row had said `format_spec: none` for eleven
# days while main and the live seat both said `expected`, and nothing was
# watching, because nothing compared every row to git.
#
# Scheduled AND at the deploy tail, on purpose: the schedule is what catches a
# range that was dropped weeks ago, and the deploy-tail run is what stops a
# freshly-failed sync from waiting a day to be noticed.
#
# HOLDS vs FINDS, same discipline as unaudited-send-reconcile: exit 1 means the
# control could not evaluate (shallow clone, D1 unreadable, a re-projection that
# would not land) and fails the run on its own. Exit 2 means it evaluated and
# found something — drift, or a git_sha main no longer contains — and opens an
# issue. A control that pages on its own blips gets muted within a week.
#
# TWO PROJECTIONS, ONE CONTROL (ss#2305). The `reconcile` job covers D1, which
# the PORTAL reads; `reconcile-r2` covers the R2 object, which the SEAT BOOTS
# FROM. They are separate jobs rather than a separate workflow on purpose: the
# defect is identical (one push-range trigger in deploy.yml drives both
# projections, and an unprocessed range is never revisited), the cadence and the
# exit contract are identical, and a human asking "is what main authored what is
# live?" should find one answer in one run rather than have to know there are
# two workflows. Separate JOBS, though, not one job: they share no code — D1
# compares a stamped git_sha, R2 compares bytes — and a D1 outage must not stop
# the seat-config check from running.

name: customer-config-reconcile

on:
  schedule:
    # 09:41 UTC daily — off the hour and off :00/:30 so it does not land with
    # every other scheduled job.
    - cron: '41 9 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Detect and report only; write nothing to D1 or R2 (any value = on)'
        required: false
  # The reconcilers are exercised by tests/config-reconcile.test.ts and
  # tests/r2-config-reconcile.test.ts; run them on a PR that touches any side so
  # a broken control cannot merge green.
  pull_request:
    paths:
      - 'scripts/ci-reconcile-customer-configs.sh'
      - 'scripts/ci-reconcile-r2-customer-configs.sh'
      - 'scripts/ci-sync-customer-configs.sh'
      - 'scripts/ci-publish-customer-configs.sh'
      - 'tests/config-reconcile.test.ts'
      - 'tests/r2-config-reconcile.test.ts'
      - '.github/workflows/customer-config-reconcile.yml'

permissions:
  contents: read
  # Findings open an issue rather than annotating a log nobody reads.
  issues: write
  # Required so npm ci can fetch @venturecrane/crane-test-harness from
  # GitHub Packages via the workflow's GITHUB_TOKEN.
  packages: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, non-negotiable: the reconciler resolves per-file
          # commits and tests ancestry, and it refuses to run on a shallow clone
          # rather than emit a confidently wrong answer.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@venturecrane'

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci

      # The unit tests gate the scheduled run: a reconciler whose detection is
      # broken reports either nothing or everything, and both are worse than no
      # report at all.
      - name: Test the reconciler
        run: npx vitest run tests/config-reconcile.test.ts

      # On pull_request there are no secrets and no live D1 — the tests above
      # are the whole job.
      - name: Reconcile every row against main
        if: github.event_name != 'pull_request'
        id: reconcile
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Via env, never interpolated into the script body: a workflow_dispatch
          # input is user-supplied and would otherwise be a shell-injection seam.
          RECONCILE_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -u
          # Redirect rather than pipe: `$?` after `| tee` reports TEE's status,
          # not the script's, and this control would then never fire.
          #
          # `|| STATUS=$?` is load-bearing, not style (ss#2307). GitHub runs this
          # body under `bash -e`, so an unguarded non-zero exit aborts the step
          # HERE — before the report is printed and before `status` reaches
          # GITHUB_OUTPUT — which silently skips the issue-opening step below.
          # The findings path is the one path that exits non-zero, so the control
          # was mute in exactly the case it exists for. Putting the call in a
          # `||` list makes its failure handled, which is what suspends `-e`.
          STATUS=0
          bash scripts/ci-reconcile-customer-configs.sh > reconcile.txt 2>&1 || STATUS=$?
          cat reconcile.txt
          echo "status=${STATUS}" >> "$GITHUB_OUTPUT"
          # Exit 2 is a finding, handled by the next step. Anything else that is
          # not 0 is the control failing, and must fail the run.
          if [ "${STATUS}" -ne 0 ] && [ "${STATUS}" -ne 2 ]; then exit "${STATUS}"; fi

      - name: Open an issue when a row drifted or lost its provenance
        if: github.event_name != 'pull_request' && steps.reconcile.outputs.status == '2'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Same discipline as above: github context reaches the script only
          # through env, never through `${{ }}` inside the body.
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "A customer_configs row did not match the customer.yaml main carries."
            echo
            echo "DRIFT means the row's git_sha was not the commit HEAD names for"
            echo "that file. The reconciler re-projected it, and is reporting anyway:"
            echo "the portal served a posture the seat did not enforce until it did,"
            echo "and how long that lasted is the thing worth knowing."
            echo
            echo "ORPHAN means the row's git_sha is not an ancestor of main at all."
            echo "Main's history was rewritten out from under the provenance stamp;"
            echo "re-projecting fixes the row but not the question of why."
            echo
            echo '```'
            cat reconcile.txt
            echo '```'
            echo
            echo "Reconciler: \`scripts/ci-reconcile-customer-configs.sh\` (ss#2292)."
            echo "Run: ${RUN_URL}"
          } > body.md
          gh issue create \
            --repo "${REPO}" \
            --title "customer_configs projection drift $(date -u +%Y-%m-%d)" \
            --label "prio:P1" --label "type:bug" \
            --body-file body.md

  # ss#2305. Same defect, the other projection — and the one with the higher
  # stakes: a stale D1 row means the portal SHOWS the wrong posture, a stale R2
  # object means the seat ENFORCES it.
  reconcile-r2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: a finding names the commit and date that authored the
          # bytes R2 should be holding, and in a shallow slice `git log -1` names
          # the newest commit in the slice instead. The reconciler refuses to run
          # shallow rather than report a confidently wrong age.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@venturecrane'

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci

      # Same gate as the D1 job: a reconciler whose detection is broken reports
      # either nothing or everything, and both are worse than no report at all.
      - name: Test the R2 reconciler
        run: npx vitest run tests/r2-config-reconcile.test.ts

      # On pull_request there are no secrets and no live R2 — the tests above
      # are the whole job.
      - name: Reconcile every seat config against main
        if: github.event_name != 'pull_request'
        id: reconcile
        env:
          # No R2_* secrets: the S3 credentials are derived from these two inside
          # the script, exactly as the publisher derives them.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Via env, never interpolated into the script body: a workflow_dispatch
          # input is user-supplied and would otherwise be a shell-injection seam.
          R2_RECONCILE_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -u
          # `|| STATUS=$?` is load-bearing, not style (ss#2307). GitHub runs this
          # body under `bash -e`, so an unguarded non-zero exit aborts the step
          # HERE — before the report is printed and before `status` reaches
          # GITHUB_OUTPUT — which silently skips the issue-opening step below.
          # The findings path is the one path that exits non-zero, so the control
          # would be mute in exactly the case it exists for.
          STATUS=0
          bash scripts/ci-reconcile-r2-customer-configs.sh > reconcile-r2.txt 2>&1 || STATUS=$?
          cat reconcile-r2.txt
          echo "status=${STATUS}" >> "$GITHUB_OUTPUT"
          # Exit 2 is a finding, handled by the next step. Anything else that is
          # not 0 is the control failing, and must fail the run.
          if [ "${STATUS}" -ne 0 ] && [ "${STATUS}" -ne 2 ]; then exit "${STATUS}"; fi

      - name: Open an issue when a seat config drifted in R2
        if: github.event_name != 'pull_request' && steps.reconcile.outputs.status == '2'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "An R2 seat config did not match the customer.yaml main carries."
            echo
            echo "DRIFT means the object at \`vaults/<slug>/customer.yaml\` was not"
            echo "byte-identical to what HEAD authored. The reconciler republished it"
            echo "and is reporting anyway: the seat BOOTED FROM the other bytes until"
            echo "it did, and how long that lasted is the thing worth knowing."
            echo
            echo "The seat adopts the republished object on its next restart;"
            echo "live-writable fields apply sooner via the ADR 0044 poller."
            echo
            echo '```'
            cat reconcile-r2.txt
            echo '```'
            echo
            echo "Reconciler: \`scripts/ci-reconcile-r2-customer-configs.sh\` (ss#2305)."
            echo "Run: ${RUN_URL}"
          } > body.md
          gh issue create \
            --repo "${REPO}" \
            --title "R2 seat config drift $(date -u +%Y-%m-%d)" \
            --label "prio:P1" --label "type:bug" \
            --body-file body.md
