# The release controller (ADR 0096): seat image releases roll with no laptop.
#
# WHAT ONE RUN DOES. `fleet release latest --tick` takes the fleet lease, reads
# every seat's rollout of the newest image release from D1, and advances AT
# MOST ONE ring: ring N+1 starts only when every seat of ring N has been done
# on the release for that ring's bake_minutes (operator/fleet/rings.yaml) with
# no open selftest_failing or image_drift alarm. A seat is verified by its own
# heartbeat self-test; there is no ssh boot smoke here, so no verdict is a
# tooling error that halts and pages. Holds are re-read before every seat. A
# seat running a client job waits (the busy gate) and a later run picks it up.
# Code: operator/bin/lib/fleet/tick.py. The laptop `fleet release` stays as the
# manual fallback (docs/handbook/deployment-release.md).
#
# SKILLS RELEASES TOO (2026-10-28). The same `latest` run then steps the newest
# skills release CI published (deploy.yml publish-skills) with the same rings,
# bake, holds, standing halt and lease. A skills release is a pointer write and a
# heartbeat read-back, no restart and no busy gate, and it goes to a seat only
# once that seat's image was built from the skills' commit or a later one, so
# skills follow the image ring by ring; a seat whose image is older waits, it
# does not halt. Before this, only a person running `fleet release --skills`
# rolled skills, and five published candidates reached no seat. A run with an
# explicit image release id steps that image only.
#
# WHAT IT NEVER DOES. --force-mid-job (a running client job always wins) and
# --accept-lane-inputs (a lane schema change is a person's call: the seat is
# refused at preflight, the run halts, and someone re-stages). The conformance
# test pins both (operator/bin/tests/test_ci_coverage_conformance.py).
#
# CREDENTIALS. Only from the protected `fleet-release` environment, readable by
# this workflow on main: one Fly deploy token per seat app
# (FLY_DEPLOY_TOKEN__<SLUG>) and one for the hermes-fleet registry app
# (FLY_REGISTRY_TOKEN). No org-wide token exists (ADR 0054). The fleet CLI puts
# the right pair on each call (operator/bin/lib/fleet/fly.py FlyTokens). R2 is
# derived from the Cloudflare token (scripts/lib/r2-creds.sh); verify-ledger
# rows go to crane-context with CRANE_RELAY_KEY.
#
# URGENT ONE-SEAT RELEASE. Run it by hand (Actions > release-tick > Run workflow,
# which works from a phone) and pick a seat: the release goes to that seat alone,
# now, with no ring order and no bake. It keeps every other safeguard: the seat's
# own self-test judges it, a failure rolls the seat back, holds are honored, and a
# running client job is waited for (up to 30 minutes), never interrupted. It runs
# in its own concurrency lane per seat, so it never queues behind a tick; the seat
# lease keeps it and a tick from deploying the same seat at once. The seat is then
# done on that release, so the tick skips it. Usual sequence for an urgent fix:
# merge, wait for Deploy to build the image (about 6 minutes), run with the seat.
#
# EXIT CODES. 0 progress, 5 waiting (bake, lease held, nothing to do) and 6 a
# standing halt that already paged are green runs; 1 (this run halted the
# release), 3 and 4 fail the run.

name: release-tick

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_run:
    workflows: [Deploy]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: 'Image release id, or latest'
        required: false
        default: latest
      seat:
        description: 'Urgent: release to this one seat now (none = the normal ring-by-ring step)'
        type: choice
        required: false
        default: none
        # One option per seat in operator/fleet/rings.yaml; the conformance test
        # fails when they drift.
        options: [none, smd-staging, pilot-smokeball, scott, brokery, captain-mark, ashton-price]
      dry_run:
        description: 'Plan only: deploy and record nothing'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  packages: read

# Ticks serialize in one lane. An urgent one-seat run gets a lane per seat, so it
# never waits behind a tick that is baking or waiting out a busy seat.
concurrency:
  group: ${{ (inputs.seat && inputs.seat != 'none') && format('release-seat-{0}', inputs.seat) || 'release-tick' }}
  cancel-in-progress: false

jobs:
  # FLEET_RELEASE_ENABLED is set only after the fleet-release environment exists
  # with its main-only branch policy and all seven secrets (ADR 0096). The job
  # `if:` is evaluated before the environment is entered, so a disabled run never
  # touches it, and never makes GitHub auto-create it without branch protection.
  tick:
    name: Advance the image and skills releases one step
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment: fleet-release
    if: >-
      vars.FLEET_RELEASE_ENABLED == 'true' && vars.DEPLOY_ENABLED == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    env:
      RELEASE: ${{ inputs.release || 'latest' }}
      DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
      SEAT: ${{ inputs.seat || 'none' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # Full history: `latest` is the newest image release whose commit is
          # an ancestor of main (`git merge-base --is-ancestor`). A shallow clone
          # holds only main's head, so once main moves past the image's commit
          # the check exits 128 and the tick halts as a tooling error
          # (run 40362697118, 2026-10-26).
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@venturecrane'

      # wrangler, for D1 (fleet_releases, fleet_rollouts, fleet_holds, the lease).
      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Install PyYAML
        run: python3 -m pip install --quiet 'pyyaml==6.0.3'

      # operator/bin/lib/render-fly-toml.sh reads the seat's machine size with
      # `uv run --with pyyaml`; without uv every seat's render fails and the tick
      # halts as tooling_error before deploying anything (the first live tick,
      # 2026-10-26, run 40355171775). Same pinned action the substrate jobs use.
      - name: Set up uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1

      - name: Install flyctl
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/superfly/flyctl/releases/download/v0.4.115/flyctl_0.4.115_Linux_x86_64.tar.gz \
            | tar -xz -C /usr/local/bin flyctl
          ln -sf flyctl /usr/local/bin/fly

      - name: Tick
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CRANE_RELAY_KEY: ${{ secrets.CRANE_RELAY_KEY }}
          FLY_REGISTRY_TOKEN: ${{ secrets.FLY_REGISTRY_TOKEN }}
          # One line per seat in operator/fleet/rings.yaml; the conformance
          # test fails when a ringed seat has no line here.
          FLY_DEPLOY_TOKEN__SMD_STAGING: ${{ secrets.FLY_DEPLOY_TOKEN__SMD_STAGING }}
          FLY_DEPLOY_TOKEN__PILOT_SMOKEBALL: ${{ secrets.FLY_DEPLOY_TOKEN__PILOT_SMOKEBALL }}
          FLY_DEPLOY_TOKEN__SCOTT: ${{ secrets.FLY_DEPLOY_TOKEN__SCOTT }}
          FLY_DEPLOY_TOKEN__BROKERY: ${{ secrets.FLY_DEPLOY_TOKEN__BROKERY }}
          FLY_DEPLOY_TOKEN__CAPTAIN_MARK: ${{ secrets.FLY_DEPLOY_TOKEN__CAPTAIN_MARK }}
          FLY_DEPLOY_TOKEN__ASHTON_PRICE: ${{ secrets.FLY_DEPLOY_TOKEN__ASHTON_PRICE }}
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source scripts/lib/r2-creds.sh
          derive_r2_creds
          export R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_ENDPOINT_URL
          # A cancelled run signals this shell, not its child; a foreground fleet
          # never hears it and is SIGKILLed with its seat lease still in D1 for
          # the 2 h TTL (2026-10-30: A&P, and every seat behind it, stalled).
          # Run fleet in the background and pass the signal on, so its lease
          # context managers release before the runner's kill.
          run_fleet() {
            operator/bin/fleet "$@" &
            local pid=$! rc
            trap 'kill -TERM "$pid" 2>/dev/null' INT TERM
            wait "$pid"; rc=$?
            # wait returns early when a trapped signal arrives; collect the real exit.
            while kill -0 "$pid" 2>/dev/null; do wait "$pid"; rc=$?; done
            trap - INT TERM
            return "$rc"
          }
          if [ "$SEAT" != "none" ]; then
            # Urgent one-seat release: the same rollout a tick runs for that seat,
            # judged by the seat's self-test with no ssh fallback, and a running
            # client job waited for up to 30 minutes.
            args=(release "$RELEASE" --only "$SEAT" --verify selftest --no-ssh-fallback --max-idle-wait 1800)
            if [ -n "$DRY_RUN" ]; then args+=(--dry-run); fi
            set +e
            run_fleet "${args[@]}"
            rc=$?
            set -e
            case "$rc" in
              0)
                if [ -n "$DRY_RUN" ]; then
                  echo "::notice::urgent release (dry run): nothing deployed to $SEAT; the log shows what would run"
                else
                  echo "::notice::urgent release: $SEAT is on $RELEASE and passed its self-test"
                fi ;;
              4) echo "::error::urgent release: refused before anything ran (another rollout holds $SEAT, or the release is unknown); see the log" ;;
              *) echo "::error::urgent release: exit $rc; $SEAT is not on $RELEASE (1 = the seat failed, was refused or rolled back, is still busy after the idle wait, or is held; 3 = a tooling error decided nothing); see the log" ;;
            esac
            exit "$rc"
          fi
          args=(release "$RELEASE" --tick --max-idle-wait 600)
          if [ -n "$DRY_RUN" ]; then args+=(--dry-run); fi
          set +e
          run_fleet "${args[@]}"
          rc=$?
          set -e
          case "$rc" in
            0) echo "::notice::release-tick: progress" ;;
            5) echo "::notice::release-tick: waiting (bake running, lease held, or nothing to do)"; rc=0 ;;
            6) echo "::warning::release-tick: the release is halted and already paged; a person must act (fleet status)"; rc=0 ;;
            *) echo "::error::release-tick: exit $rc (1 = this run halted the release; see the log above)" ;;
          esac
          exit "$rc"

  # No environment and no secrets: says why a run did nothing.
  disabled:
    name: Release controller not enabled
    runs-on: ubuntu-latest
    if: vars.FLEET_RELEASE_ENABLED != 'true'
    steps:
      - name: Release controller not enabled
        run: echo "FLEET_RELEASE_ENABLED is not 'true'; the release controller is off (ADR 0096, docs/handbook/deployment-release.md)."
