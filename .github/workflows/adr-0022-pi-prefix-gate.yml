name: ADR 0022 — block law-pi- regressions

# Per ADR 0022 Stream 4 plan §"CI grep gate (post-merge enforcement)":
# locks the PI migration so the law-pi- prefix doesn't reappear under
# active source paths. ADR documents (docs/adr/) are exempt — they
# describe the migration's historical state.
#
# If a legitimate need to reintroduce the prefix arises (e.g. a new addon
# that happens to share the name), update this workflow to whitelist the
# specific path rather than removing the gate.

on:
  pull_request:
    paths:
      - 'operator/**'
      - 'docs/**'
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/adr-0022-pi-prefix-gate.yml'

permissions:
  contents: read
  pull-requests: read

# Cancel a superseded run when a newer commit lands on the same PR branch
# (47% of runs were obsolete on completion, measured 2026-07-27). This
# workflow is PR-only, so an unguarded cancel is safe.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Block law-pi- prefix in active paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Plain grep, no package install. The gate once installed ripgrep via
      # apt, and `apt-get update` on a hosted runner refreshes every
      # third-party repo the image ships with; on 2026-09-09 Google's
      # Chrome apt mirror served a corrupt index and the gate failed twice
      # on a branch with nothing to find. A fixed-string recursive grep is
      # the same search with no network dependency.
      - name: Scan for law-pi- prefix in active paths
        run: |
          set -uo pipefail
          # ADR files are exempt — they describe the historical state.
          # Active paths: src/, tests/, operator/skills/, operator/bundles/,
          # operator/fixtures/ (sans the moved law-firm/pi/ subtree which
          # no longer exists), docs/specs/, docs/runbooks/, docs/pm/.
          # Only directories that exist are scanned; a missing directory is
          # not a finding.
          paths=()
          for p in src tests scripts \
              operator/skills operator/bundles operator/fixtures \
              operator/grading operator/templates operator/customers \
              operator/adapter operator/bin operator/tests operator/verticals \
              docs/specs docs/runbooks docs/pm; do
            [ -d "$p" ] && paths+=("$p")
          done
          hits=$(grep -rlF 'law-pi-' "${paths[@]}" 2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "::error::law-pi- prefix found in active paths — ADR 0022 Stream 4 migration is locked."
            echo "Files containing the prefix:"
            echo "$hits"
            echo ""
            echo "If reintroducing the prefix is intentional (rare), update the"
            echo "whitelist in .github/workflows/adr-0022-pi-prefix-gate.yml."
            echo "Otherwise, rename per ADR 0022 §'Properties of the vertical model'."
            exit 1
          fi
          echo "✓ No law-pi- prefix in active paths."
