name: Verify

on:
  push:
    branches: [main]
  # Run on EVERY pull request regardless of base branch. A `branches: [main]`
  # filter here (removed 2026-06-08) matched on the PR's *base*, so a stacked
  # PR whose base was a feature branch silently skipped this entire suite and
  # merged on lightweight gates only. Running on all PRs makes stacked and
  # shallow PRs equally safe; re-adding a base filter reopens that hole.
  pull_request:

# Cancel a superseded run when a newer commit lands on the SAME PR branch.
# Measured 2026-07-27: 47% of runs on this repo were already obsolete when they
# finished, because nothing cancelled them. The expression guard is load-bearing
# — it evaluates false for `push: main`, so a merge-queue run or a main build is
# NEVER cancelled by a following merge. Only PR iterations cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Typecheck, Lint, Format, Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required so npm ci can fetch @venturecrane/crane-test-harness from
      # GitHub Packages via the workflow's GITHUB_TOKEN.
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@venturecrane'

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck Workers
        run: npm run typecheck:workers

      - name: Format check
        run: npm run format:check

      # `npm run lint` carries `--max-warnings 13`, the 2026-08-09 baseline.
      # The type-aware no-unsafe-* rules are warn-tier pending the Zod boundary
      # rollout; the ceiling stops that tier from growing while it waits. The
      # count depends on the Typecheck step above having run `astro sync`;
      # do not move Lint before it. See eslint.config.js.
      - name: Lint
        run: npm run lint

      # Dead-export gate (knip). Config + triage rationale in knip.jsonc.
      - name: Dead code
        run: npm run deadcode

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # 2026-06-12 code review: this step was missing for worker test suites
      # ran locally via `npm run verify` but never in CI. Runs before the
      # per-worker `npm ci` steps below; the vitest binary resolves from the
      # root node_modules through npm's ancestor .bin PATH walk (the same
      # mechanism the Typecheck Workers step relies on).
      - name: Test Workers
        run: npm run test:workers

      # The root build writes `.wrangler/deploy/config.json` pointing at the
      # adapter-generated `dist/server/wrangler.json`. Leaving it in the tree
      # makes sub-worker `wrangler deploy` invocations ambiguous because
      # wrangler discovers both the sub-worker's own `wrangler.toml` and the
      # root's deploy config. Remove it before the sub-worker steps.
      - name: Clean root wrangler state
        run: rm -rf .wrangler

      # The two cost workers have their own wrangler configs + live consumers
      # (admin Operator cost views); dry-run build them so a config break
      # surfaces in CI rather than at deploy.
      - name: Build Cost Anomaly Worker
        run: cd workers/cost-anomaly && npm ci && npx wrangler deploy --dry-run --outdir=dist

      - name: Build Cost Telemetry Worker
        run: cd workers/cost-telemetry && npm ci && npx wrangler deploy --dry-run --outdir=dist
