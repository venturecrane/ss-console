# Republish the seat specs after a release lands on a seat (2026-11-16).
#
# WHY. A seat's signed spec (ADR 0094 amendment) is compiled against what the
# seat runs: its image, its skills release and its jobs bundle. Deploy's
# publish-customer-configs job publishes it on a push to main, compiled against
# the image the seat runs AT THAT MOMENT, which for a schema-changing release
# is still the older image (the publish is refused or pins the older schemas).
# The release tick then lands the new image minutes later, and nothing
# republished the spec until some later push: on 2026-11-04 a client seat and
# the pilot reported "spec unverified" for hours after a release.
#
# WHAT STARTS IT. release-tick.yml, after any run that decided a seat
# (operator/bin/lib/fleet/landed.py names them). Nothing else; by hand from
# Actions > seat-spec-republish > Run workflow when a spec needs it.
#
# WHAT IT DOES. The same publisher Deploy runs, over an empty push range at
# main's head, so every seat is CONVERGED: a spec that already matches what
# this commit compiles against the seat's current image is left as it is, one
# that differs is signed and published, and a refusal is a warning (the nightly
# reconciler pages it). It writes nothing a push to main would not write.
#
# THE KEY. The signing key is a secret of the protected `seat-spec`
# environment, gated on vars.SEAT_SPEC_ENABLED exactly as Deploy's publish job
# is (tests/deploy-seat-spec-gate.test.ts pins both).

name: seat-spec-republish

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

# One at a time; a newer request waiting replaces an older one, which is right:
# each run converges every seat at main's head.
concurrency:
  group: seat-spec-republish
  cancel-in-progress: false

jobs:
  republish:
    name: Republish seat specs against what each seat now runs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    environment: ${{ vars.SEAT_SPEC_ENABLED == 'true' && 'seat-spec' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@venturecrane'

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci

      - name: Republish seat specs to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FLEET_IMAGE_LOOKUP: '1'
          # PKCS#8 PEM, read by scripts/compile-seat-spec.ts; never echoed.
          SEAT_SPEC_SIGNING_KEY: ${{ vars.SEAT_SPEC_ENABLED == 'true' && secrets.SEAT_SPEC_SIGNING_KEY || '' }}
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          # An empty range: no slug counts as changed, every seat converges.
          BEFORE_SHA="$head" AFTER_SHA="$head" bash scripts/ci-publish-customer-configs.sh
