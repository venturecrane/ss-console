# Operator safety substrate CI.
#
# Closes the gap the harness-pivot review flagged: the Python safety-substrate
# invariants (trust-ceiling enforcement incl. the ADR 0025 exposure rules, the
# citation/no-fabrication invariants, sticky-stop, isolation) and the adapter
# tests (audit log, inbound trust boundary, namespace assertion) were NOT run
# in CI — only locally. This workflow gates them on every PR that touches the
# substrate, so a trust-gate regression cannot merge green.
#
# Two runners, because the suite is intentionally dual-mode:
#   * run()-style invariants (test_invariant_*.py with a `def run()` +
#     __main__ that exits non-zero on failure) are executed directly;
#   * pytest-style tests (adapter/tests, the pytest invariants, the inbound
#     boundary test) are collected by pytest.

name: operator-substrate

on:
  # No `paths:` filter, on purpose. operator-substrate is a REQUIRED check on
  # main (2026-09-09 code review, top action item 1). A path-filtered workflow
  # reports nothing on the PRs it skips, and a required check that never
  # reports strands the PR at "Expected". So the workflow runs on every PR and
  # the `changes` step below decides whether the suites need to run, from the
  # list in .github/operator-substrate-paths.txt. That list is the old filter,
  # verbatim, and bin/tests/test_ci_coverage_conformance.py pins it to the test
  # inventory exactly as it pinned the old `paths:` block, plus one new
  # invariant: this trigger must never grow a path filter again.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel a superseded run when a newer commit lands on the SAME PR branch
# (47% of runs were obsolete on completion, measured 2026-07-27). The
# expression guard evaluates false for `push: main`, so main builds are never
# cancelled by a following merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  substrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # The detect step diffs base...head; both need to be in the clone.
          fetch-depth: 0

      # Decides whether anything under .github/operator-substrate-paths.txt
      # changed. Fails closed: no base sha (push to main) or a diff error both
      # mean "run everything". Every later step is gated on this output, and
      # the job itself always completes, which is what makes it requirable.
      - name: Detect substrate-relevant changes
        id: changes
        run: >-
          python3 operator/bin/substrate-paths-changed.py
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Set up Python
        if: steps.changes.outputs.relevant == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '>=3.11'

      - name: Install pytest
        if: steps.changes.outputs.relevant == 'true'
        # PyYAML is needed by the workspace-broker tests (the broker reads
        # authored customer.yaml to validate impersonation subject + send-as).
        # cryptography is needed by the evidence-packet signing tests (#2122):
        # they round-trip a real Ed25519 detached signature over a real built
        # packet. Without it those tests skip, and a signature that does not
        # verify would be discovered by a client's carrier instead of by CI.
        # ruff lints the tree against operator/ruff.toml (see that file's header
        # for why the rule selection is narrow and why it is a gate, not a
        # baseline).
        # pyright (pinned) runs in basic mode under operator/pyproject.toml and is
        # ratcheted by bin/pyright-ratchet.py; the pip package fetches its own node.
        # ruff is pinned too. RUF100 (unused-noqa) follows each version's BLE001
        # exemptions: 0.16 exempts a handler that logs with exc_info, 0.15 does
        # not, and an unpinned install turned a locally green tree red at one
        # site on 2026-09-10. Bump deliberately: `uvx ruff@<new> check .` and
        # `format --check .` locally first, then move this pin and the note in
        # ruff.toml together.
        run: python3 -m pip install --quiet pytest pyyaml cryptography ruff==0.15.17 pyright==1.1.406

      # The safe half of packaging (operator/pyproject.toml header): the tree is
      # installed as packages so imports resolve the way they will once the
      # seat image installs it too. The sys.path shims stay until that
      # reprovision-proven follow-up.
      - name: Install the operator tree as packages
        if: steps.changes.outputs.relevant == 'true'
        run: python3 -m pip install --quiet -e ./operator

      - name: Run ruff
        if: steps.changes.outputs.relevant == 'true'
        # Selection is exactly the set that reports zero across the tree, so this
        # blocks new violations outright. It also makes 106 of the 261 `# noqa`
        # annotations already in the tree mean something — before operator/ruff.toml
        # existed, no Python linter ran here at all and every one was inert.
        working-directory: operator
        run: ruff check .

      # RUF100 (in ruff.toml) deletes suppressions for rules ruff does not
      # enable; this is the other half: every surviving noqa says what it
      # protects. Same shape as the nosemgrep gate in security.yml.
      - name: Every noqa carries a reason
        if: steps.changes.outputs.relevant == 'true'
        working-directory: operator
        run: python3 bin/noqa-reasons.py

      # pyright, ratcheted: contracts/operator-pyright-baseline.json records
      # errors per file; any file that grows fails, and improvement asks for a
      # regenerate so the number only moves down. `|| true` because pyright
      # exits 1 on any error and the ratchet, not the raw exit, is the gate.
      - name: pyright (ratcheted)
        if: steps.changes.outputs.relevant == 'true'
        working-directory: operator
        run: |
          set -euo pipefail
          pyright --outputjson > /tmp/pyright.json || true
          python3 bin/pyright-ratchet.py /tmp/pyright.json

      # shellcheck never ran anywhere before 2026-09-10; five `shellcheck
      # disable` directives sat in workflow run: blocks, which no linter reads.
      # The generated env-array file is excluded (no shebang by design).
      - name: shellcheck (operator shell)
        if: steps.changes.outputs.relevant == 'true'
        run: |
          set -euo pipefail
          git ls-files 'operator/**/*.sh' 'operator/*.sh' \
            | grep -v '_env-arrays.generated.sh' \
            | xargs shellcheck --severity=warning

      - name: Run run()-style safety invariants
        if: steps.changes.outputs.relevant == 'true'
        working-directory: operator
        run: |
          set -euo pipefail
          shopt -s nullglob
          fail=0
          for f in safety-substrate/tests/test_invariant_*.py; do
            # Only the pure run()-style files (top-level def run(), no pytest
            # import); pytest-style invariants are covered by the pytest step.
            if grep -q '^def run()' "$f" && ! grep -q 'import pytest' "$f"; then
              echo "== invariant: $f =="
              if ! python3 "$f"; then
                echo "FAILED: $f"
                fail=1
              fi
            fi
          done
          exit $fail

      - name: Run pytest suites (adapter + evidence + invariants + bin + skills + templates + migrations)
        if: steps.changes.outputs.relevant == 'true'
        working-directory: operator
        # #1688: full-directory invocation, replacing the prior hand-named
        # bin/tests list. That list's exclusion rationale ("some of bin/tests
        # needs substrate deps not installed here") went stale after pyyaml
        # joined the install step: five suites — including the skill-frontmatter
        # gate and the seat-timezone regression test — ran nowhere in CI, and
        # skills/, templates/tests, and operator/tests ran nowhere at all.
        # Everything below passes in a bare pytest+pyyaml venv (validated
        # 2026-07-04, 636 tests). connectors/ stays out: it runs in its own
        # per-connector venv conformance step further down.
        # bin/tests/test_ci_coverage_conformance.py asserts this invocation
        # covers every test_*.py under operator/ (connectors excepted).
        run: python3 -m pytest adapter/tests adapter/evidence/tests adapter/voice/tests safety-substrate/tests bin/tests rehearsal/tests workspace_broker/tests templates/tests templates/drafting/tests tests skills -q

      # SEC-32: overlay-RUNTIME side of the adapter <-> overlay drift gate.
      #
      # The vitest gate (tests/operator-overlay-pairs.test.ts) runs in the
      # hermetic `verify` workflow and can only hash the dormant ss-console-side
      # `operator/adapter/*` copies. That left a hole: a neutered RUNTIME file
      # (e.g. a no-op audit emitter in the overlay) shipped green because the
      # adapter copy was untouched and its hash still matched.
      #
      # This step closes it. The overlay is a PUBLIC repo pinned at the
      # manifest's overlayRef (which the vitest gate asserts equals the
      # Dockerfile ARG OVERLAY_REF). Here — where network is available — we
      # fetch it at that ref and assert every runtime twin's sha256 equals the
      # manifest's overlaySha256. A runtime change with no matching manifest
      # bump FAILS. Fail-closed: mismatch/missing/malformed -> exit 1; a genuine
      # fetch failure -> exit 2 (env), and the workflow still fails.
      - name: Verify overlay runtime hashes (SEC-32 drift gate)
        if: steps.changes.outputs.relevant == 'true'
        run: python3 operator/bin/verify-overlay-pairs.py

      # Author-built MCP connector conformance. The bare pytest env above
      # deliberately installs only pytest+pyyaml; the connector conformance suite
      # spawns a real stdio MCP server and speaks the protocol, so it needs the
      # `mcp` SDK and the connector itself installed. We build each connector's
      # OWN venv here — exactly as operator/templates/Dockerfile does — so CI
      # tests the real shipped artifact (the venv + `<name>-mcp` console-script),
      # not a source-tree import. Per-connector venv = the same isolation the
      # image gets.
      - name: Set up uv (connector venvs)
        if: steps.changes.outputs.relevant == 'true'
        uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.1

      - name: Author-built connector conformance
        if: steps.changes.outputs.relevant == 'true'
        working-directory: operator/connectors
        run: |
          set -euo pipefail
          # SDK unit tests once, in their own venv.
          uv venv /tmp/sdkv
          uv pip install --python /tmp/sdkv/bin/python ./_sdk pytest
          /tmp/sdkv/bin/python -m pytest _sdk/tests -q
          # Each connector: isolated venv with the shared SDK + itself, run its
          # tests with the console-script on PATH so the live stdio round-trip
          # exercises the real `<name>-mcp` entry point.
          for cdir in */; do
            name="${cdir%/}"
            [ "$name" = "_sdk" ] && continue
            [ -f "${cdir}pyproject.toml" ] || continue
            echo "== conformance: ${name} =="
            venv="/tmp/connv-${name}"
            uv venv "$venv"
            uv pip install --python "$venv/bin/python" ./_sdk "$cdir" pytest
            PATH="$venv/bin:$PATH" "$venv/bin/python" -m pytest "${cdir}tests" -q
          done

      # ss#2613: the medchron runner is installed exactly as the seat image will
      # install it (the explicit three-path form: sdk, connector, runner), and
      # its tests run against that artifact. Not the bare env: the runner's
      # seat access imports the connector's client.
      - name: medchron runner tests (own venv)
        if: steps.changes.outputs.relevant == 'true'
        working-directory: operator
        run: |
          set -euo pipefail
          uv venv /tmp/medchronv
          uv pip install --python /tmp/medchronv/bin/python ./connectors/_sdk ./connectors/smokeball ./runners/medchron pytest
          /tmp/medchronv/bin/python -m pytest -c runners/medchron/pyproject.toml runners/medchron/tests -q

      - name: No substrate paths changed
        if: steps.changes.outputs.relevant != 'true'
        run: >-
          echo "No file under .github/operator-substrate-paths.txt changed;
          the substrate suites did not need to run. This job still reports so
          the required check is satisfied."
