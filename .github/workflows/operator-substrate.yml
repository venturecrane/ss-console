# Operator safety substrate CI.
#
# Closes the gap the harness-pivot review flagged: the Python safety_substrate
# invariants (trust-ceiling enforcement incl. the ADR 0025 exposure rules, the
# citation/no-fabrication invariants, sticky-stop, isolation) and the adapter
# tests (audit log, trust-gate injection, namespace assertion) were NOT run
# in CI — only locally. This workflow gates them on every PR that touches the
# substrate, so a trust-gate regression cannot merge green.
#
# Two runners, because the suite is intentionally dual-mode:
#   * run()-style invariants (test_invariant_*.py with a `def run()` +
#     __main__ that exits non-zero on failure) are executed directly;
#   * pytest-style tests (adapter/tests, the pytest invariants) are
#     collected by pytest.

name: operator-substrate

on:
  # No `paths:` filter, on purpose. operator-substrate is a REQUIRED check on
  # main (2026-09-09 code review, top action item 1). A path-filtered workflow
  # reports nothing on the PRs it skips, and a required check that never
  # reports strands the PR at "Expected". So the workflow runs on every PR and
  # the `changes` step below decides whether the suites need to run, from the
  # list in .github/operator-substrate-paths.txt. That list is the old filter,
  # verbatim, and bin/tests/test_ci_coverage_conformance.py pins it to the test
  # inventory exactly as it pinned the old `paths:` block, plus one new
  # invariant: this trigger must never grow a path filter again.
  pull_request:
  # The merge queue (2026-10-21): "substrate" is required there too. A queue
  # run carries no PR base sha, so the detect step fails closed and runs every
  # suite, which is right for the last gate before main.
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  # A Hermes promotion is proven here before the Dockerfile pin moves: run the
  # workflow by hand with a candidate sha and the `overlay-e2e` job drives the
  # overlay through that Hermes instead of the pinned one. With no base sha the
  # detect step fails closed, so every job runs.
  workflow_dispatch:
    inputs:
      hermes_sha:
        description: 'Candidate Hermes commit (40-hex) for overlay-e2e; blank = the Dockerfile pin'
        required: false
        default: ''

permissions:
  contents: read

# Cancel a superseded run when a newer commit lands on the SAME PR branch
# (47% of runs were obsolete on completion, measured 2026-07-27). The
# expression guard evaluates false for `push: main`, so main builds are never
# cancelled by a following merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  substrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The detect step diffs base...head; both need to be in the clone.
          fetch-depth: 0

      # Decides whether anything under .github/operator-substrate-paths.txt
      # changed. Fails closed: no base sha (push to main) or a diff error both
      # mean "run everything". Every later step is gated on this output, and
      # the job itself always completes, which is what makes it requirable.
      - name: Detect substrate-relevant changes
        id: changes
        run: >-
          python3 operator/bin/substrate-paths-changed.py
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Set up Python
        if: steps.changes.outputs.relevant == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '>=3.11'

      - name: Install pytest
        if: steps.changes.outputs.relevant == 'true'
        # PyYAML is needed by the workspace-broker tests (the broker reads
        # authored customer.yaml to validate impersonation subject + send-as).
        # cryptography is needed by the evidence-packet signing tests (#2122):
        # they round-trip a real Ed25519 detached signature over a real built
        # packet. Without it those tests skip, and a signature that does not
        # verify would be discovered by a client's carrier instead of by CI.
        # ruff lints the tree against operator/ruff.toml (see that file's header
        # for why the rule selection is narrow and why it is a gate, not a
        # baseline).
        # pyright (pinned) runs in basic mode under operator/pyproject.toml and is
        # ratcheted by bin/pyright-ratchet.py; the pip package fetches its own node.
        # ruff is pinned too. RUF100 (unused-noqa) follows each version's BLE001
        # exemptions: 0.16 exempts a handler that logs with exc_info, 0.15 does
        # not, and an unpinned install turned a locally green tree red at one
        # site on 2026-09-10. Bump deliberately: `uvx ruff@<new> check .` and
        # `format --check .` locally first, then move this pin and the note in
        # ruff.toml together. openpyxl is pinned to the connector venv's version
        # (3.1.5): statute-watch builds its workbook there, and its tests build
        # and scan one.
        run: python3 -m pip install --quiet pytest pyyaml cryptography openpyxl==3.1.5 ruff==0.15.17 pyright==1.1.406

      # The safe half of packaging (operator/pyproject.toml header): the tree is
      # installed as packages so imports resolve the way they will once the
      # seat image installs it too. The sys.path shims stay until that
      # reprovision-proven follow-up.
      - name: Install the operator tree as packages
        if: steps.changes.outputs.relevant == 'true'
        run: python3 -m pip install --quiet -e ./operator

      - name: Run ruff
        if: steps.changes.outputs.relevant == 'true'
        # Selection is exactly the set that reports zero across the tree, so this
        # blocks new violations outright. It also makes 106 of the 261 `# noqa`
        # annotations already in the tree mean something — before operator/ruff.toml
        # existed, no Python linter ran here at all and every one was inert.
        working-directory: operator
        run: ruff check .

      # One formatter for the Python half, the way prettier is for the
      # TypeScript half (ruff.toml [format], line-length 120). Fix locally with
      # `cd operator && ruff format .`.
      - name: ruff format --check
        if: steps.changes.outputs.relevant == 'true'
        working-directory: operator
        run: ruff format --check .

      # RUF100 (in ruff.toml) deletes suppressions for rules ruff does not
      # enable; this is the other half: every surviving noqa says what it
      # protects. Same shape as the nosemgrep gate in security.yml.
      - name: Every noqa carries a reason
        if: steps.changes.outputs.relevant == 'true'
        working-directory: operator
        run: python3 bin/noqa-reasons.py

      # pyright, ratcheted: contracts/operator-pyright-baseline.json records
      # errors per file; any file that grows fails, and improvement asks for a
      # regenerate so the number only moves down. `|| true` because pyright
      # exits 1 on any error and the ratchet, not the raw exit, is the gate.
      - name: pyright (ratcheted)
        if: steps.changes.outputs.relevant == 'true'
        working-directory: operator
        run: |
          set -euo pipefail
          pyright --outputjson > /tmp/pyright.json || true
          python3 bin/pyright-ratchet.py /tmp/pyright.json

      # shellcheck never ran anywhere before 2026-09-10; five `shellcheck
      # disable` directives sat in workflow run: blocks, which no linter reads.
      # The generated env-array file is excluded (no shebang by design).
      - name: shellcheck (operator shell)
        if: steps.changes.outputs.relevant == 'true'
        run: |
          set -euo pipefail
          git ls-files 'operator/**/*.sh' 'operator/*.sh' \
            | grep -v '_env-arrays.generated.sh' \
            | xargs shellcheck --severity=warning

      - name: Run run()-style safety invariants
        if: steps.changes.outputs.relevant == 'true'
        working-directory: operator
        run: |
          set -euo pipefail
          shopt -s nullglob
          fail=0
          for f in safety_substrate/tests/test_invariant_*.py; do
            # Only the pure run()-style files (top-level def run(), no pytest
            # import); pytest-style invariants are covered by the pytest step.
            if grep -q '^def run()' "$f" && ! grep -q 'import pytest' "$f"; then
              echo "== invariant: $f =="
              if ! python3 "$f"; then
                echo "FAILED: $f"
                fail=1
              fi
            fi
          done
          exit $fail

      - name: Run pytest suites (adapter + evidence + invariants + bin + skills + templates + migrations)
        if: steps.changes.outputs.relevant == 'true'
        working-directory: operator
        # #1688: full-directory invocation, replacing the prior hand-named
        # bin/tests list. That list's exclusion rationale ("some of bin/tests
        # needs substrate deps not installed here") went stale after pyyaml
        # joined the install step: five suites — including the skill-frontmatter
        # gate and the seat-timezone regression test — ran nowhere in CI, and
        # skills/, templates/tests, and operator/tests ran nowhere at all.
        # Everything below passes in a bare pytest+pyyaml venv (validated
        # 2026-07-04, 636 tests). connectors/ stays out: it runs in its own
        # per-connector venv conformance step further down.
        # bin/tests/test_ci_coverage_conformance.py asserts this invocation
        # covers every test_*.py under operator/ (connectors excepted).
        run: python3 -m pytest adapter/tests adapter/evidence/tests adapter/voice/tests safety_substrate/tests bin/tests rehearsal/tests workspace_broker/tests templates/tests templates/drafting/tests tests skills -q

      # (The SEC-32 "fetch the overlay at its pin and hash the runtime twins" step
      # that stood here until 2026-10-22 is gone with the pin: the overlay is
      # operator/hermes-smd-overlay in this tree, and the hermetic vitest gate
      # tests/operator-overlay-pairs.test.ts hashes both twins in place.)

      # Author-built MCP connector conformance. The bare pytest env above
      # deliberately installs only pytest+pyyaml; the connector conformance suite
      # spawns a real stdio MCP server and speaks the protocol, so it needs the
      # `mcp` SDK and the connector itself installed. We build each connector's
      # OWN venv here — exactly as operator/templates/Dockerfile does — so CI
      # tests the real shipped artifact (the venv + `<name>-mcp` console-script),
      # not a source-tree import. Per-connector venv = the same isolation the
      # image gets.
      - name: Set up uv (connector venvs)
        if: steps.changes.outputs.relevant == 'true'
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      # Every hash-locked requirements file installs, the way the image
      # installs it: the seat interpreter, --no-config, --require-hashes. That
      # is 3.13 (Debian 13's python3) for every venv but the Hermes one, and
      # 3.14 for the two files installed into the Hermes venv, which runs on
      # /opt/python3.14 since the Hermes v0.22.5 promotion (#3564).
      # Until 2026-09-25 no CI job installed these files at all; the venvs
      # below resolved each pyproject's ranges instead. So a pin set that could
      # never install was green: four Dependabot PRs moved pydantic-core past
      # the exact version pydantic==2.13.5 requires (#2760, which broke every
      # seat build until #2787, then #2812, #2897, #2932), and the failure
      # surfaced only at a reprovision. Fails closed: a file that does not
      # resolve fails the job. hermes-overlay.txt and hermes-security.txt are
      # --no-deps because their closure is the Hermes venv's (the image runs
      # hermes_pip_check.py, a `uv pip check`, there).
      - name: Every hash-locked requirements file installs
        if: steps.changes.outputs.relevant == 'true'
        working-directory: operator/requirements
        run: |
          set -euo pipefail
          uv venv --python 3.13 /tmp/reqcheck
          uv venv --python 3.14 /tmp/reqcheck314
          checked=0
          for f in *.txt; do
            deps=()
            py=/tmp/reqcheck/bin/python
            case "$f" in hermes-overlay.txt|hermes-security.txt) deps=(--no-deps); py=/tmp/reqcheck314/bin/python ;; esac
            echo "== ${f} =="
            uv pip install --python "$py" --dry-run --no-config --require-hashes ${deps[@]+"${deps[@]}"} -r "$f"
            checked=$((checked + 1))
          done
          [ "$checked" -gt 0 ] || { echo "::error::no requirements files found"; exit 1; }

      - name: Author-built connector conformance
        if: steps.changes.outputs.relevant == 'true'
        working-directory: operator/connectors
        run: |
          set -euo pipefail
          # SDK unit tests once, in their own venv.
          uv venv /tmp/sdkv
          uv pip install --python /tmp/sdkv/bin/python ./_sdk pytest
          /tmp/sdkv/bin/python -m pytest _sdk/tests -q
          # Each connector: its own venv built exactly as the image builds it
          # (seat interpreter, its hash-locked requirements file, then the SDK
          # and the connector --no-deps), so the tests run against the pinned
          # versions a seat runs, not whatever the ranges resolve to today. The
          # console-script is on PATH so the live stdio round-trip exercises the
          # real `<name>-mcp` entry point.
          for cdir in */; do
            name="${cdir%/}"
            [ "$name" = "_sdk" ] && continue
            [ -f "${cdir}pyproject.toml" ] || continue
            echo "== conformance: ${name} =="
            venv="/tmp/connv-${name}"
            uv venv --python 3.13 "$venv"
            uv pip install --python "$venv/bin/python" --no-config --require-hashes -r "../requirements/connector-${name}.txt"
            uv pip install --python "$venv/bin/python" --no-deps ./_sdk "$cdir"
            uv pip install --python "$venv/bin/python" pytest
            PATH="$venv/bin:$PATH" "$venv/bin/python" -m pytest "${cdir}tests" -q
          done

      # ss#2613: the medchron runner is installed exactly as the seat image
      # installs it (its hash-locked file, then sdk, connector, runner
      # --no-deps), and its tests run against that artifact. Not the bare env:
      # the runner's seat access imports the connector's client.
      - name: medchron runner tests (own venv)
        if: steps.changes.outputs.relevant == 'true'
        working-directory: operator
        run: |
          set -euo pipefail
          uv venv --python 3.13 /tmp/medchronv
          uv pip install --python /tmp/medchronv/bin/python --no-config --require-hashes -r requirements/medchron.txt
          uv pip install --python /tmp/medchronv/bin/python --no-deps ./connectors/_sdk ./connectors/smokeball ./runners/medchron
          uv pip install --python /tmp/medchronv/bin/python pytest
          /tmp/medchronv/bin/python -m pytest -c runners/medchron/pyproject.toml runners/medchron/tests -q

      - name: No substrate paths changed
        if: steps.changes.outputs.relevant != 'true'
        run: >-
          echo "No file under .github/operator-substrate-paths.txt changed;
          the substrate suites did not need to run. This job still reports so
          the required check is satisfied."

  # The seat runtime's own suite (operator/hermes-smd-overlay, ADR 0095). Until
  # 2026-10-22 this ran as the standalone overlay repo's CI (Python 3.11, Hermes
  # fetched from a retired fork); it is a separate job here so it runs in
  # parallel with `substrate` and so its ~2.5 minutes do not stretch the
  # substrate wall clock. Same gating shape as `substrate`: the detect step
  # decides, every suite step is gated on it, and the job always reports, which
  # is what makes it requirable (`overlay` is in the main ruleset's required
  # checks since 2026-10-23; bin/tests/test_ci_coverage_conformance.py pins the shape).
  overlay:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect substrate-relevant changes
        id: changes
        run: >-
          python3 operator/bin/substrate-paths-changed.py
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Set up uv
        if: steps.changes.outputs.relevant == 'true'
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      # The interpreter the overlay runs on in the seat: the Hermes venv's,
      # 3.14 since the Hermes v0.22.5 promotion (#3564; 3.13 before it, the
      # 3.11 the standalone repo tested on before that). ruff is pinned to the
      # same version as the substrate job.
      - name: Install the overlay with its dev extras
        if: steps.changes.outputs.relevant == 'true'
        run: |
          set -euo pipefail
          uv venv --python 3.14 /tmp/overlayv
          # ruamel.yaml and psutil: the tests that import the pinned Hermes
          # source (HERMES_AGENT_SRC, below) need them since v0.22.5, which
          # reads YAML through ruamel (hermes_yaml.py) and imports psutil from
          # tools/file_tools.py. Versions are the ones v0.22.5's uv.lock pins.
          uv pip install --python /tmp/overlayv/bin/python -e "./operator/hermes-smd-overlay[dev]" ruff==0.15.17 \
            ruamel.yaml==0.18.16 psutil==7.2.2

      - name: ruff check + format (overlay)
        if: steps.changes.outputs.relevant == 'true'
        working-directory: operator/hermes-smd-overlay
        run: |
          set -euo pipefail
          /tmp/overlayv/bin/ruff check .
          /tmp/overlayv/bin/ruff format --check .

      # The title-model falsifier (tests/test_title_generation_model.py) builds
      # the seat's title request with the REAL Hermes Anthropic adapter, so it
      # needs the fleet's pinned Hermes source: the sha the image installs,
      # read from the Dockerfile so the two cannot drift, fetched shallow from
      # upstream (a non-tip sha is reachable by fetch though not by ls-remote).
      - name: Check out pinned Hermes (read-only, outside the workspace)
        if: steps.changes.outputs.relevant == 'true'
        run: |
          set -euo pipefail
          sha="$(sed -n 's/^ARG HERMES_UPSTREAM_SHA=\([0-9a-f]\{40\}\)$/\1/p' operator/templates/Dockerfile)"
          [ -n "$sha" ] || { echo "::error::no 40-hex ARG HERMES_UPSTREAM_SHA in operator/templates/Dockerfile"; exit 1; }
          git init -q "$RUNNER_TEMP/hermes-agent"
          git -C "$RUNNER_TEMP/hermes-agent" fetch -q --depth 1 https://github.com/NousResearch/hermes-agent.git "$sha"
          git -C "$RUNNER_TEMP/hermes-agent" checkout -q FETCH_HEAD
          echo "HERMES_AGENT_SRC=$RUNNER_TEMP/hermes-agent" >> "$GITHUB_ENV"

      - name: Overlay pytest
        if: steps.changes.outputs.relevant == 'true'
        working-directory: operator/hermes-smd-overlay
        run: /tmp/overlayv/bin/python -m pytest -q

      # A dependency the overlay declares must have its hash-locked pin in
      # operator/requirements/hermes-overlay.txt before it merges, or the image
      # build's `uv pip check` is the first thing that notices. compile.sh
      # derives that file from the overlay's pyproject and Hermes' lock; a diff
      # here means the pins were not regenerated.
      - name: hermes-overlay.txt and hermes-security.txt are current (compile.sh no-diff)
        if: steps.changes.outputs.relevant == 'true'
        run: |
          set -euo pipefail
          operator/requirements/compile.sh
          git diff --exit-code -- operator/requirements/hermes-overlay.txt operator/requirements/hermes-security.txt

      - name: No substrate paths changed
        if: steps.changes.outputs.relevant != 'true'
        run: >-
          echo "No file under .github/operator-substrate-paths.txt changed;
          the overlay suite did not need to run. This job still reports so
          the required check is satisfied."

  # The real-dispatch harness (operator/hermes-smd-overlay/tests_e2e, ss W3).
  # The `overlay` job tests the seat runtime's parts; this one runs them
  # together: a temp seat translated from the hosted template by the real
  # bootstrap, the overlay discovered by Hermes' own plugin loader, and one
  # model tool call per overlay tool dispatched by Hermes' own registry, with a
  # scripted model (a local Anthropic Messages server, plus the patched OpenAI
  # client) and a stub broker. It is what catches a handler Hermes cannot call
  # (SMD-OPERATOR-1B, 2026-08-13) and a hook-order defect before merge, and it
  # is the instrument for a Hermes promotion: `workflow_dispatch` with
  # `hermes_sha` runs it at a candidate. Same gating shape as `overlay`;
  # bin/tests/test_ci_coverage_conformance.py pins it. Budget: under 5 minutes.
  overlay-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect substrate-relevant changes
        id: changes
        run: >-
          python3 operator/bin/substrate-paths-changed.py
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha || github.sha }}"

      # The sha the image installs, read from the Dockerfile so the two cannot
      # drift; a dispatch may override it with a candidate, which must be a
      # full 40-hex commit (a branch name would make the run unrepeatable).
      - name: Resolve the Hermes sha
        id: pin
        if: steps.changes.outputs.relevant == 'true'
        env:
          CANDIDATE: ${{ github.event.inputs.hermes_sha }}
        run: |
          set -euo pipefail
          pinned="$(sed -n 's/^ARG HERMES_UPSTREAM_SHA=\([0-9a-f]\{40\}\)$/\1/p' operator/templates/Dockerfile)"
          [ -n "$pinned" ] || { echo "::error::no 40-hex ARG HERMES_UPSTREAM_SHA in operator/templates/Dockerfile"; exit 1; }
          if [ -n "${CANDIDATE:-}" ]; then
            printf '%s' "$CANDIDATE" | grep -Eqx '[0-9a-f]{40}' \
              || { echo "::error::hermes_sha must be a 40-hex commit"; exit 1; }
            sha="$CANDIDATE"; source="workflow_dispatch candidate"
          else
            sha="$pinned"; source="operator/templates/Dockerfile ARG HERMES_UPSTREAM_SHA"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "source=$source" >> "$GITHUB_OUTPUT"
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"

      # uv's cache, keyed on the Hermes sha and the seat interpreter: Hermes'
      # dependency closure is what is slow to resolve, and it moves only with
      # the sha. Not pruned, so the built wheels survive between runs.
      - name: Set up uv (cache hermes-deps-<sha>-py3.14)
        if: steps.changes.outputs.relevant == 'true'
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-suffix: hermes-deps-${{ steps.pin.outputs.sha }}-py3.14
          cache-dependency-glob: operator/hermes-smd-overlay/pyproject.toml
          prune-cache: false

      - name: Check out Hermes at the resolved sha (outside the workspace)
        if: steps.changes.outputs.relevant == 'true'
        env:
          SHA: ${{ steps.pin.outputs.sha }}
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/hermes-agent"
          git -C "$RUNNER_TEMP/hermes-agent" fetch -q --depth 1 https://github.com/NousResearch/hermes-agent.git "$SHA"
          git -C "$RUNNER_TEMP/hermes-agent" checkout -q FETCH_HEAD
          echo "HERMES_AGENT_SRC=$RUNNER_TEMP/hermes-agent" >> "$GITHUB_ENV"

      - name: Install Hermes [mcp,anthropic] and the overlay [e2e] on the seat interpreter
        if: steps.changes.outputs.relevant == 'true'
        run: |
          set -euo pipefail
          uv venv --python 3.14 /tmp/e2ev
          # Since v0.22 Hermes' lock overrides exact pins its own dependencies
          # declare (browser-harness pins pillow==12.3.0, the lock resolves
          # 13.0.0). `uv pip install` re-resolves and does not read the
          # project's [tool.uv] overrides, so they are passed back from the
          # lock's [manifest], as Hermes' own installer does (pm/pip_check.py).
          python3 -I operator/requirements/hermes_pip_check.py --lock-overrides \
            "${HERMES_AGENT_SRC}/uv.lock" > /tmp/hermes-lock-overrides.txt
          uv pip install --python /tmp/e2ev/bin/python --overrides /tmp/hermes-lock-overrides.txt \
            -e "${HERMES_AGENT_SRC}[mcp,anthropic]"
          uv pip install --python /tmp/e2ev/bin/python -e "./operator/hermes-smd-overlay[e2e]"

      - name: Real-dispatch harness (pytest tests_e2e)
        if: steps.changes.outputs.relevant == 'true'
        working-directory: operator/hermes-smd-overlay
        env:
          E2E_SUMMARY_PATH: ${{ runner.temp }}/e2e-summary.json
        run: /tmp/e2ev/bin/python -m pytest tests_e2e -x -q --timeout=240

      # Always, when the harness ran: a promotion PR cites what this run covered
      # and, as plainly, what it did not.
      - name: Harness scope summary
        if: always() && steps.changes.outputs.relevant == 'true'
        env:
          E2E_SUMMARY_PATH: ${{ runner.temp }}/e2e-summary.json
          HERMES_SHA: ${{ steps.pin.outputs.sha }}
          HERMES_SOURCE: ${{ steps.pin.outputs.source }}
          HERMES_PINNED: ${{ steps.pin.outputs.pinned }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          lines = [
              "## overlay-e2e scope",
              "",
              f"- Hermes: `{os.environ.get('HERMES_SHA') or 'unresolved'}` "
              f"({os.environ.get('HERMES_SOURCE') or 'unknown'}; the image pins "
              f"`{os.environ.get('HERMES_PINNED') or 'unknown'}`)",
          ]
          path = Path(os.environ["E2E_SUMMARY_PATH"])
          if not path.exists():
              lines.append("- The harness wrote no summary: it failed before its session ended.")
          else:
              s = json.loads(path.read_text())
              lines += [
                  f"- Overlay tools registered through Hermes' loader: {s['registered_overlay_tools']}",
                  f"- Overlay tools dispatched by Hermes' registry: {s['dispatched_overlay_tools']}",
                  "- Refused before dispatch by design (dispatch NOT exercised): "
                  + ", ".join(s["gated_not_dispatched"]),
                  "- pre_tool_call order: " + " > ".join(s["pre_tool_call_order"]),
                  "- Overlay hooks fired: " + ", ".join(s["overlay_hooks_fired"]),
                  "- Overlay hooks NOT exercised: " + (", ".join(s["overlay_hooks_not_fired"]) or "none"),
                  "- Surfaces NOT exercised:",
              ]
              lines += [f"  - {item}" for item in s["surfaces_not_exercised"]]
          text = "\n".join(lines) + "\n"
          print(text)
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write(text)
          PY

      - name: No substrate paths changed
        if: steps.changes.outputs.relevant != 'true'
        run: >-
          echo "No file under .github/operator-substrate-paths.txt changed;
          the real-dispatch harness did not need to run. This job still
          reports so the required check is satisfied."
