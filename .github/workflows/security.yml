name: Security

on:
  push:
    branches: [main]
  # Run on EVERY pull request regardless of base branch. A `branches: [main]`
  # filter here (removed 2026-06-08) matched on the PR's *base*, so a stacked
  # PR whose base was a feature branch skipped Semgrep, Secret Detection, and
  # npm-audit entirely and merged with no security signal. Running on all PRs
  # closes that hole; re-adding a base filter reopens it.
  pull_request:
  schedule:
    # Daily at 13:00 UTC (06:00 Phoenix) so new advisories surface before the workday
    - cron: '0 13 * * *'
  workflow_dispatch:

# Cancel a superseded run when a newer commit lands on the SAME PR branch.
# Measured 2026-07-27: 47% of runs were already obsolete when they finished.
# This workflow fans out to parallel jobs, each billed separately, so a
# superseded run wastes several minutes rather than one. The expression guard
# is load-bearing: it is false for `push: main`, the daily `schedule`, and
# `workflow_dispatch`, so the scheduled advisory sweep and every main build run
# to completion. Only PR iterations cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Plan v3.1 §H-3: explicit minimum permissions. Workflow only needs to
# read the repository contents; it does not write commits, comments, or
# artifacts. Explicit permissions block supersedes the repo default and
# protects against accidental write-capable tokens leaking into the
# authenticated curl calls below.
permissions:
  contents: read
  # Required so npm ci can fetch @venturecrane/crane-test-harness from
  # GitHub Packages via the workflow's GITHUB_TOKEN.
  packages: read

jobs:
  audit:
    name: npm audit (high+)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@venturecrane'

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci

      # Fail on any high/critical advisory that is NOT in the time-boxed
      # allowlist at .github/audit-allowlist.json. The allowlist exists so an
      # advisory whose only fix is blocked by the .npmrc supply-chain cooldown
      # (min-release-age) does not freeze all merges to main via the required
      # Security Summary gate. Each entry is triaged non-reachable and expires
      # on a date; past that date the gate re-fails, forcing the tracked fix.
      # Covers the root project plus every workers/* package.
      - name: Audit (fail on non-allowlisted high or critical)
        run: |
          set -euo pipefail
          dirs=(.)
          for dir in workers/*/; do
            [ -f "${dir}package.json" ] && dirs+=("${dir%/}")
          done
          node scripts/audit-allowlist.mjs "${dirs[@]}"

      # Folded in from the former standalone `nosemgrep-audit` job
      # (2026-07-27 CI-cost pass): it needed only a checkout and greps, so a
      # dedicated runner cost a full billed minute per run for seconds of work.
      # Step names keep the failure signal specific in the UI.
      - name: Require substantive justification on every nosemgrep
        # Every `// nosemgrep` annotation must be followed by ` — ` or `: ` and
        # at least 20 characters of justification prose. Without this audit,
        # the gate degrades over time as agents silently silence findings by
        # appending a bare `// nosemgrep` comment.
        run: |
          set -e
          bad=$(grep -rnP --include='*.ts' --include='*.js' \
            '//[[:space:]]*nosemgrep(:[^[:space:]]+)?[[:space:]]*(?:[—:][[:space:]]*.{0,19})?[[:space:]]*$' \
            . \
            --exclude-dir=node_modules --exclude-dir=dist || true)
          if [ -n "$bad" ]; then
            echo "nosemgrep annotations require ≥20 chars of justification after ' — ' or ': ':"
            echo "$bad"
            exit 1
          fi
          block=$(grep -rnzP --include='*.ts' --include='*.js' \
            '/\*[^*]*nosemgrep[^*]*\*/' \
            . \
            --exclude-dir=node_modules --exclude-dir=dist || true)
          if [ -n "$block" ]; then
            echo "Block-comment nosemgrep not supported; use inline // nosemgrep:"
            echo "$block"
            exit 1
          fi
          disabled=$(grep -rn --include='*.ts' --include='*.js' 'semgrep-disable' . --exclude-dir=node_modules --exclude-dir=dist || true)
          if [ -n "$disabled" ]; then
            echo "'semgrep-disable' is banned; use rule-specific nosemgrep:"
            echo "$disabled"
            exit 1
          fi

  gitleaks:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Plan §C.5 fleet-lint #1: never hardcode the gitleaks version. The
      # previous template pinned to gitleaks_8.21.2 which broke the entire
      # fleet's security pipeline. We can't use gitleaks/gitleaks-action@v2
      # because it requires a paid license for org repos. Install pattern
      # below queries the GitHub releases API for the latest tag, so the
      # version stays current automatically. Config lives in .gitleaks.toml.
      #
      # Plan v3.1 §H-3: the api.github.com curl MUST pass GITHUB_TOKEN via
      # the Authorization header. Unauthenticated API calls share a 60/hour
      # rate limit per GitHub Actions runner IP, and on busy days (or in
      # orgs with many concurrent workflows) the rate limit is consumed
      # before our call arrives, causing a 403 and a flaky Secret Detection
      # failure. With authentication the rate limit is 5000/hr per token,
      # more than sufficient. Fleet-lint rule #11 enforces this pattern.
      - name: Install Gitleaks (latest release)
        env:
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Both the API query and the tarball download go to GitHub
          # infrastructure that occasionally returns a transient 5xx. Without
          # a retry, a single blip fails the entire Secret Detection gate:
          # on 2026-07-22/23 a 500 on the tarball download reddened the
          # nightly across the fleet even though the release asset was intact.
          # retry() gives up to 4 attempts with exponential backoff (2/4/8s)
          # so the gate is resilient to transient infrastructure errors while
          # still failing fast on a genuinely persistent problem.
          retry() {
            local attempt=1 max=4 delay=2
            until "$@"; do
              if [ "$attempt" -ge "$max" ]; then
                echo "::error::Command failed after ${max} attempts: $*"
                return 1
              fi
              echo "Attempt ${attempt}/${max} failed; retrying in ${delay}s..."
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }

          # Fetch the release metadata to a file (not through a pipe) so a
          # failed attempt leaves no partial output for the parser to read.
          retry curl -fsSL \
            -H "Authorization: Bearer $GH_API_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -o gitleaks-release.json \
            https://api.github.com/repos/gitleaks/gitleaks/releases/latest
          GITLEAKS_VERSION=$(grep '"tag_name"' gitleaks-release.json | head -1 | sed -E 's/.*"v?([^"]+)".*/\1/')
          rm -f gitleaks-release.json
          echo "Installing gitleaks v${GITLEAKS_VERSION}"

          # The release tarball download does NOT need authentication (it's
          # a public release asset served by github.com, not api.github.com)
          # but we pass the header anyway for symmetry in case GitHub
          # applies stricter rate limits to release downloads in the future.
          # Download to a file first so a mid-stream transient failure can be
          # retried cleanly instead of corrupting the tar extraction.
          retry curl -fsSL \
            -H "Authorization: Bearer $GH_API_TOKEN" \
            -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          rm -f gitleaks.tar.gz
          chmod +x gitleaks

      - name: Run Gitleaks
        run: |
          echo "## Secret Detection" >> $GITHUB_STEP_SUMMARY
          if ./gitleaks detect --source . --verbose --no-git --config .gitleaks.toml 2>&1 | tee gitleaks-output.txt; then
            echo "No secrets detected." >> $GITHUB_STEP_SUMMARY
          else
            echo "### Secrets Found" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat gitleaks-output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

  semgrep:
    name: Static Analysis (Semgrep)
    runs-on: ubuntu-latest
    container:
      # Pinned container tag. Dependabot watches returntocorp/semgrep in
      # .github/dependabot.yml so pin bumps land as PRs (auto-merged by
      # .github/workflows/dependabot-auto-merge.yml when safe).
      image: returntocorp/semgrep:1.157.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Diff-aware scanning (--baseline-commit) resolves a merge-base, so
          # it needs full history. The default shallow clone can't reach it.
          fetch-depth: 0
      - name: Determine baseline commit
        id: baseline
        # Diff-aware gating: only findings NEW since the baseline block a
        # merge. On PRs the baseline is the merge-base with the target
        # branch; on pushes it is the commit the branch pointed at before the
        # push. Scheduled and manual runs get NO baseline and remain a full
        # audit (unchanged) — the daily cron still surfaces pre-existing debt.
        # Motivation: the p/* rule packs are fetched live from the registry,
        # so a pack update can reclassify long-standing code as blocking and
        # freeze all merges on unrelated PRs. Baselining scopes the merge gate
        # to what each change actually introduces.
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          # The container runs git as root over a workspace owned by the
          # runner UID; without this, git refuses with "dubious ownership".
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          baseline=""
          case "$EVENT_NAME" in
            pull_request)
              baseline=$(git merge-base HEAD "$PR_BASE_SHA" 2>/dev/null || true)
              ;;
            push)
              case "$PUSH_BEFORE" in
                '' | 0000000000000000000000000000000000000000) ;;
                *) baseline=$(git merge-base HEAD "$PUSH_BEFORE" 2>/dev/null || true) ;;
              esac
              ;;
          esac
          echo "commit=$baseline" >> "$GITHUB_OUTPUT"
          if [ -n "$baseline" ]; then
            echo "Diff-aware baseline: $baseline (only findings new since this commit block)."
          else
            echo "No baseline — full audit (schedule/dispatch or first push)."
          fi
      - name: Run Semgrep
        # POSIX-compatible shell script — the returntocorp/semgrep container
        # uses Alpine ash, not bash, so ${PIPESTATUS[n]} is unavailable.
        # We redirect to a file, capture $? directly, then cat for both the
        # CI log and (on failure) $GITHUB_STEP_SUMMARY.
        env:
          BASELINE_COMMIT: ${{ steps.baseline.outputs.commit }}
        run: |
          echo "## Static Analysis (Semgrep)" >> "$GITHUB_STEP_SUMMARY"
          # `--error` fails on findings. `--strict` was tried but exits 3 on
          # the ~0.4% of files in this repo that Semgrep can't fully parse
          # (yaml/ts variants) — unrelated to security findings. Pack-load
          # failures still surface loudly in the log without --strict.
          run_semgrep() {
            semgrep scan "$@" \
              --metrics=off \
              --config=p/typescript \
              --config=p/javascript \
              --config=p/security-audit \
              --config=p/owasp-top-ten \
              --exclude=node_modules --exclude=dist --exclude='**/*.test.ts' \
              > semgrep-output.txt 2>&1
          }
          set +e
          if [ -n "$BASELINE_COMMIT" ]; then
            run_semgrep --error --baseline-commit "$BASELINE_COMMIT"
          else
            run_semgrep --error
          fi
          rc=$?
          set -e
          cat semgrep-output.txt
          if [ "$rc" -ne 0 ]; then
            {
              echo '### Findings'
              echo '```'
              cat semgrep-output.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$rc"
          fi

  summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [audit, gitleaks, semgrep]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "## Security Check Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.audit.result }}" == "success" ]; then
            echo "- npm audit: PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "- npm audit: FAILED" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.gitleaks.result }}" == "success" ]; then
            echo "- Secret Detection: PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Secret Detection: FAILED" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.semgrep.result }}" == "success" ]; then
            echo "- Static Analysis (Semgrep): PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Static Analysis (Semgrep): FAILED" >> $GITHUB_STEP_SUMMARY
          fi

          # Fail if any check failed
          if [ "${{ needs.audit.result }}" != "success" ] || \
             [ "${{ needs.gitleaks.result }}" != "success" ] || \
             [ "${{ needs.semgrep.result }}" != "success" ]; then
            echo ""
            echo "One or more security checks failed."
            exit 1
          fi
