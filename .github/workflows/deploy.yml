name: Deploy

on:
  push:
    branches: [main]

jobs:
  # D1 migrations first, as their own job. Every other job waits on this one,
  # and the seat artifacts (skills, image, bundle) and the two projections wait
  # on nothing more: they need the migrated schema, never the web build, so a
  # skill edit no longer waits behind the Cloudflare deploy.
  migrate:
    name: Apply D1 migrations
    runs-on: ubuntu-latest
    # Only run when Cloudflare secrets are configured
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    permissions:
      contents: read
      # Required so npm ci can fetch @venturecrane/crane-test-harness from
      # GitHub Packages via the workflow's GITHUB_TOKEN.
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@venturecrane'

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci

      # Migrations must be backward-compatible with the currently deployed
      # application. Apply them before publishing code that depends on them.
      - name: Run D1 migrations
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply ss-console-db --remote

  deploy:
    name: Build & Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    needs: migrate
    # Only deploy when Cloudflare secrets are configured
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    permissions:
      contents: read
      deployments: write
      # Required so npm ci can fetch @venturecrane/crane-test-harness from
      # GitHub Packages via the workflow's GITHUB_TOKEN.
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@venturecrane'

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci

      - name: Build
        run: npm run build

      # Dry-run catches wrangler config / binding errors before they hit prod.
      - name: Wrangler deploy (dry-run)
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --dry-run

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      # Secrets persist across `wrangler deploy` on Workers — no post-deploy
      # sync step needed. Rotate one key at a time, value piped from Infisical
      # (docs/handbook/secrets-access.md, "Rotation procedure"). Never bulk-export
      # /ss into `wrangler secret bulk`: it re-sets every key under the path,
      # including ones retired from the Worker.

      # The root `wrangler deploy` writes `.wrangler/deploy/config.json`
      # pointing at the adapter-generated `dist/server/wrangler.json`.
      # Sub-worker deploys discover it when searching upward and fail with
      # "Found both a user configuration file and a deploy configuration
      # file." Remove before subsequent sub-worker steps.
      - name: Clean root wrangler state
        run: rm -rf .wrangler

      # The two cost workers feed the admin Operator cost views. They deploy
      # here so code changes ship to CI verification + production together.
      - name: Install Cost Anomaly Worker deps
        run: cd workers/cost-anomaly && npm ci

      - name: Deploy Cost Anomaly Worker
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/cost-anomaly
          command: deploy

      - name: Install Cost Telemetry Worker deps
        run: cd workers/cost-telemetry && npm ci

      - name: Deploy Cost Telemetry Worker
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/cost-telemetry
          command: deploy

      # Fleet alerts (#1709): the heartbeat-red / HARD_STOP pager closing
      # ADR 0064's honesty-banner gap. Secrets (RESEND_API_KEY,
      # FLEET_ALERTS_BEARER) persist across deploys on Workers.
      - name: Install Fleet Alerts Worker deps
        run: cd workers/fleet-alerts && npm ci

      - name: Deploy Fleet Alerts Worker
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/fleet-alerts
          command: deploy

  # git → D1 projection auto-sync (#1308, ADR 0012 §5). Every merged
  # customer.yaml change re-projects to the live customer_configs read replica
  # so the portal can never silently serve a stale config again (the mechanism
  # behind the recurring "removed in git but still shows live" failure).
  # First-ever projection of a NEW customer stays Captain-gated (the script
  # skips unseeded slugs with a warning).
  sync-customer-configs:
    name: Sync customer.yaml → D1 projection
    runs-on: ubuntu-latest
    # D1 only (the projection rows): the migrated schema, not the web build.
    needs: migrate
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the sync job diffs the push range and stamps rows
          # with per-file commit SHAs (ADR 0012 provenance).
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@venturecrane'

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci

      - name: Project changed customer configs to D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: bash scripts/ci-sync-customer-configs.sh

  # git → R2 projection auto-publish (ss #2082). The D1 sync above feeds the
  # PORTAL; this feeds the SEAT. They are deliberately separate jobs: the two
  # projections have different credentials, different failure modes, and one
  # flaking must not stop the other from landing. A wrangler hiccup on the D1
  # side should never be the reason a merged persona register fails to reach a
  # running Machine.
  publish-customer-configs:
    name: Publish customer.yaml + signed seat spec → R2 (seat source of truth)
    runs-on: ubuntu-latest
    # R2, plus D1 reads for each seat's image: the migrated schema, not the web build.
    needs: migrate
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    # The seat-spec signing key (Ed25519, ADR 0094 amendment) is a secret of the
    # protected `seat-spec` environment and of nothing else, so only this job,
    # on main, can sign. The reference is gated on vars.SEAT_SPEC_ENABLED:
    # GitHub auto-creates a referenced environment on first run with NO branch
    # protection, so until the protected environment exists and the variable is
    # set, this job names no environment, reads no key, and publishes
    # customer.yaml exactly as before (the spec is skipped with a warning).
    # tests/deploy-seat-spec-gate.test.ts pins the gate.
    environment: ${{ vars.SEAT_SPEC_ENABLED == 'true' && 'seat-spec' || '' }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the publisher diffs the push range.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@venturecrane'

      # The publisher validates every config with the canonical TS validator
      # before it touches the seat's source of truth, so it needs the deps.
      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci

      - name: Publish customer configs and seat specs to R2
        env:
          # No R2_* secrets: the R2 S3 credentials are derived from these two
          # inside the script. R2's S3 API accepts a Cloudflare API token
          # directly, so minting and storing a second credential would add
          # exposure without adding capability.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          # Resolve each seat's CURRENT image (heartbeat image_ref -> the
          # fleet release's manifest) through wrangler; off by default so a
          # local run needs no D1.
          FLEET_IMAGE_LOOKUP: '1'
          # PKCS#8 PEM, read by scripts/compile-seat-spec.ts; never echoed.
          SEAT_SPEC_SIGNING_KEY: ${{ vars.SEAT_SPEC_ENABLED == 'true' && secrets.SEAT_SPEC_SIGNING_KEY || '' }}
        run: bash scripts/ci-publish-customer-configs.sh

  # Skills as a release artifact (fleet release, 2026-10-19). A merge touching
  # operator/skills/** publishes a CANDIDATE skills release to R2: the
  # content-addressed objects plus fleet/skills/<version>.json (files, retired
  # names, each skill's needs from the image). It never writes a seat's
  # pointer. The release controller (release-tick.yml) walks it through the
  # rings. This job starts a tick the moment the candidate is published (its last
  # step), a tick that advanced a ring starts the next one, a cron every 5
  # minutes is the backstop, and this workflow's completion still starts one. Each
  # seat takes it once that seat's image was built from this commit or a later
  # one, so skills follow the image this same merge builds. `operator/bin/fleet
  # release --skills <version>` is the by-hand path. Same CF-token-derived R2 credentials as
  # publish-customer-configs (no new secret); the D1 record goes through the
  # same wrangler path sync-customer-configs uses.
  publish-skills:
    name: Publish candidate skills release → R2
    runs-on: ubuntu-latest
    # The schema, not the web build: skills reach seats without waiting on wrangler.
    needs: migrate
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    permissions:
      contents: read
      packages: read
      # gh workflow run release-tick.yml (Start the release tick).
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the publisher diffs the push range.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@venturecrane'

      # wrangler, for the fleet_releases record. The manifest builder itself is
      # stdlib python3 (the runner's own).
      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci

      - name: Publish the skills release candidate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: bash scripts/ci-publish-skills.sh

      # Start the release tick now, not when every job of this run has ended.
      # Skipped when a tick is already queued: the concurrency lane keeps one
      # running and one pending, so a second dispatch would only replace the
      # pending one and leave a cancelled run behind.
      - name: Start the release tick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A run waiting on the concurrency lane reports `pending`, a run not yet
          # picked up reports `queued`; either one already covers this change.
          waiting=$(
            gh run list --repo "$GITHUB_REPOSITORY" --workflow release-tick.yml --status queued --json databaseId --jq '.[0].databaseId'
            gh run list --repo "$GITHUB_REPOSITORY" --workflow release-tick.yml --status pending --json databaseId --jq '.[0].databaseId'
          )
          if [ -z "$waiting" ]; then
            gh workflow run release-tick.yml --repo "$GITHUB_REPOSITORY" --ref main
          else
            echo "a tick is already queued"
          fi

  # The seat image, built on merge (ADR 0096). No laptop: `fleet build` runs here
  # at the merged commit and records the release in D1; release-tick.yml then
  # rolls it through the rings after each ring's bake. It builds only when the
  # tree differs from the newest recorded image release under a path the image
  # can carry (substrate-paths-changed.py --image: .github/operator-substrate-paths.txt
  # minus its .github/ lines, which change CI, not the image, minus
  # .github/operator-artifact-paths.txt, which ship as versioned artifacts:
  # operator/skills/** since ADR 0100 W3). Diffing against the last BUILT commit, not
  # the push's own range, is what keeps a substrate merge from being lost when a
  # docs merge lands before its build runs. The build-source guard refuses a
  # commit main has already moved past (exit 4): a clean skip, because the newer
  # merge's own run builds the newer tree.
  build-seat-image:
    name: Build the seat image (fleet build)
    runs-on: ubuntu-latest
    # The schema, not the web build (the fleet_releases record is D1).
    needs: migrate
    # FLEET_RELEASE_ENABLED is set only once the fleet-release environment exists
    # with its main-only branch policy and its secrets (ADR 0096). Evaluated
    # before the environment is entered, so a disabled run never creates it.
    if: ${{ vars.DEPLOY_ENABLED == 'true' && vars.FLEET_RELEASE_ENABLED == 'true' }}
    environment: fleet-release
    timeout-minutes: 90
    concurrency:
      group: build-seat-image
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
      # gh workflow run release-tick.yml (Start the release tick).
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the guard compares HEAD with origin/main, and the
          # detect step diffs against the last built commit.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@venturecrane'

      # wrangler, for D1 (the last build, and the fleet_releases record).
      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install PyYAML
        run: python3 -m pip install --quiet 'pyyaml==6.0.3'

      - name: Install flyctl
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/superfly/flyctl/releases/download/v0.4.115/flyctl_0.4.115_Linux_x86_64.tar.gz \
            | tar -xz -C /usr/local/bin flyctl
          ln -sf flyctl /usr/local/bin/fly

      - name: Detect image-relevant changes since the last build
        id: changes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # Fails closed: no readable last build (empty base) means build.
          base=$(operator/bin/fleet releases --json --limit 20 2>/dev/null \
            | python3 -c 'import json,sys; rows=json.load(sys.stdin); print(next((r["ss_console_sha"] for r in rows if r.get("kind")=="image" and r.get("ss_console_sha")), ""))' \
            || true)
          echo "last built commit: ${base:-none}"
          # --image: the image path list, from the one definition the release
          # controller's ordering rule (base(S)) also reads.
          python3 operator/bin/substrate-paths-changed.py \
            --base "$base" --head "$GITHUB_SHA" --paths .github/operator-substrate-paths.txt --image

      - name: fleet build
        if: steps.changes.outputs.relevant == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FLY_REGISTRY_TOKEN: ${{ secrets.FLY_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          # shellcheck source=/dev/null
          source scripts/lib/r2-creds.sh
          derive_r2_creds
          export R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_ENDPOINT_URL
          set +e
          operator/bin/fleet build --notes "merge ${GITHUB_SHA::8} (CI)"
          rc=$?
          set -e
          if [ "$rc" -eq 4 ]; then
            git fetch origin main --quiet
            if [ "$(git rev-list --count HEAD..origin/main)" != "0" ]; then
              echo "::notice::main moved past ${GITHUB_SHA::8} before this build; the newer merge builds the newer tree"
              exit 0
            fi
          fi
          exit "$rc"

      # Start the release tick now, not when every job of this run has ended.
      # Skipped when a tick is already queued: the concurrency lane keeps one
      # running and one pending, so a second dispatch would only replace the
      # pending one and leave a cancelled run behind.
      - name: Start the release tick
        if: steps.changes.outputs.relevant == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A run waiting on the concurrency lane reports `pending`, a run not yet
          # picked up reports `queued`; either one already covers this change.
          waiting=$(
            gh run list --repo "$GITHUB_REPOSITORY" --workflow release-tick.yml --status queued --json databaseId --jq '.[0].databaseId'
            gh run list --repo "$GITHUB_REPOSITORY" --workflow release-tick.yml --status pending --json databaseId --jq '.[0].databaseId'
          )
          if [ -z "$waiting" ]; then
            gh workflow run release-tick.yml --repo "$GITHUB_REPOSITORY" --ref main
          else
            echo "a tick is already queued"
          fi

      - name: No image paths changed
        if: steps.changes.outputs.relevant != 'true'
        run: echo "No image-relevant change since the last built commit; nothing to build."

  # The jobs bundle (ADR 0100 W3): the job runner and the Smokeball connector
  # venvs, built on merge INSIDE the core seat image at their /opt paths by the
  # same script the Dockerfile runs (operator/templates/jobs-runtime.sh), and
  # published to R2 as a candidate (scripts/ci-publish-bundle.sh). The release
  # controller then rolls it only to the seats whose customer.yaml authors a job
  # lane. After build-seat-image, so a merge that built an image builds its
  # bundle in that image; otherwise the newest completed image built from main.
  # It publishes only when .github/operator-bundle-paths.txt moved since the
  # commit the newest recorded bundle was built from (empty = publish).
  publish-bundle:
    name: Publish candidate jobs bundle → R2
    runs-on: ubuntu-latest
    needs: [migrate, build-seat-image]
    # !cancelled(): build-seat-image skips when no image path moved, and a bundle
    # path can still have moved. The migrate job must have succeeded.
    if: ${{ !cancelled() && needs.migrate.result == 'success' && vars.DEPLOY_ENABLED == 'true' && vars.FLEET_RELEASE_ENABLED == 'true' }}
    environment: fleet-release
    timeout-minutes: 60
    concurrency:
      group: publish-bundle
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the detect step diffs against the last bundle's commit,
          # and bundle-base asks whether an image was built from main.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@venturecrane'

      # wrangler, for D1 (the last bundle, the base image, the fleet_releases record).
      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install PyYAML
        run: python3 -m pip install --quiet 'pyyaml==6.0.3'

      - name: Detect bundle-relevant changes since the last bundle
        id: changes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # Fails closed: no readable last bundle (empty base) means publish.
          base=$(operator/bin/fleet releases --json --limit 60 2>/dev/null \
            | python3 -c 'import json,sys; rows=json.load(sys.stdin); print(next((r["ss_console_sha"] for r in rows if r.get("kind")=="bundle" and r.get("ss_console_sha")), ""))' \
            || true)
          echo "last bundle commit: ${base:-none}"
          python3 operator/bin/substrate-paths-changed.py \
            --base "$base" --head "$GITHUB_SHA" --paths .github/operator-bundle-paths.txt

      - name: Build and publish the jobs bundle
        if: steps.changes.outputs.relevant == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FLY_REGISTRY_TOKEN: ${{ secrets.FLY_REGISTRY_TOKEN }}
          AFTER_SHA: ${{ github.sha }}
        run: bash scripts/ci-publish-bundle.sh

      - name: No bundle paths changed
        if: steps.changes.outputs.relevant != 'true'
        run: echo "No bundle-relevant change since the last published bundle; nothing to publish."
