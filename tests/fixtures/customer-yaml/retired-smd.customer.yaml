schema_version: 1

# SMD Services customer Operator.
#
# AUTHORED by the aie-onboard skill (2026-05-31) from the REAL onboarding interview
# at operator/customers/smd/onboarding-interview-2026-05-31.md. This REPLACES the
# prior config, which was seeded from a test fixture (aie-onboard test-cases.md Case 1)
# and carried the wrong identity (venturecrane.com) for a long time.
#
# Every value below traces to a stated interview answer. Capabilities the substrate
# cannot yet honor are NOT encoded here — they live as open-items in onboarding-plan.md.
# Crane is provisioned as a customer Workspace employee. Google authority is a
# customer-owned service account with domain-wide delegation impersonating the
# Operator's Workspace user. A separate capability broker holds the credential;
# the gateway receives only short-lived grants for classified operations.
#
# Not provisioned, not committed by the skill. Captain reviews before either.

# ---- IDENTITY ----
customer_id: smd
customer_name: 'SMDurgan, LLC'

# ---- SEAT DESCRIPTOR ----
# What this seat IS. Kind and product only; lifecycle state is DERIVED from
# probes of the running system and is deliberately absent here — a state field
# is a claim an agent can write, and a claim an agent can write is one that rots.
# Works ON the venture, not in a customer's business.
seat:
  kind: internal
  product: operator

vertical: mixed # interview §Runtime; enum has no consulting/services value (#1141)
fly_region: lax # "We're in Phoenix" → closest Fly region

# ---- RUNTIME ----
# Two-tier model (ADR 0049). The interview asked for tiered models (routine vs
# sensitive); the schema now supports it natively. `model` is the lighter main
# that runs the conversation and every in-line skill (inbox-triage, drafting);
# `escalation_model` is the heavier tier a delegate_task call escalates to, wired
# into Hermes' native `delegation` block by translate.py. Escalation fires only
# because this seat authors `code_execution: autonomous` below (delegate_task is a
# CODE_EXECUTION action) AND the skill delegates before reading untrusted content
# (the taint gate withholds escalation post-read). Customer-zero cost test: the
# high-frequency hourly triage runs cheaply on Sonnet, genuinely heavy reasoning
# escalates to Opus. NOTE: principal-mail drafting runs in-loop on the Sonnet main,
# not Opus — the interview's sensitive-tier intent is traded for the cost test.
model: claude-sonnet-4-6
escalation_model: claude-opus-4-8
# Hermes v0.18.0 → v0.20.4 promotion (Step 4: Crane, SMD-own production seat,
# last of the SMD-own four before the A&P checkpoint, ss#2444).
# Rollback pin: v2026.7.1@7c1a029553d87c43ecff8a3821336bc95872213b. See docs/runbooks/operator/hermes-v0.20-upgrade-plan.md.
hermes_ref: v2026.8.18@e624e9fde561e1add9388384012b295fde669ade

machine:
  size: shared-cpu-1x
  memory_mb: 1024

# ---- GOOGLE WORKSPACE AUTHORITY ----
# Customer-owned Google Cloud service account with domain-wide delegation.
# GOOGLE_SERVICE_ACCOUNT_JSON is a Fly secret containing base64-encoded service
# account JSON. Only the separate Workspace broker process can decode or read it.
google_auth:
  mode: dwd
  subject: crane@smd.services
  scopes:
    - https://www.googleapis.com/auth/gmail.modify
    - https://www.googleapis.com/auth/calendar.events
    - https://www.googleapis.com/auth/drive
    - https://www.googleapis.com/auth/documents
    - https://www.googleapis.com/auth/spreadsheets
  # ---- MANAGED MAILBOX (executive-assistant access) ----
  # Crane manages the principal/team mailbox IN ADDITION to its own crane@ box,
  # the way an EA works a principal's inbox alongside their own. The DWD service
  # account impersonates smdurgan@smdurgan.com — the PRIMARY mailbox, where the
  # scott@/team@ aliases deliver (Google rejects impersonating an alias). The
  # broker fail-closes any impersonation subject or From not authored here.
  #
  # send_as is the Gmail "Send mail as" allowlist for the From header. Wave A is
  # DRAFT-ONLY: no Gmail send tool is wired, inbox-triage creates reply drafts
  # for Captain to send, and the principal-identity SEND ban below still holds
  # (a draft is not a send). Authoring autonomous send-as-principal is Wave B,
  # behind its own ADR + the audit/rate-limit/kill-switch controls.
  managed_mailboxes:
    - address: smdurgan@smdurgan.com
      send_as:
        - scott@smd.services
        - team@smd.services
        - smdurgan@smdurgan.com

# ---- HUMANS WITH PORTAL ACCESS ----
users:
  - email: scott@smd.services
    role: principal
    full_name: Scott Durgan
    # Real writing samples are an onboarding open-item; until then Layer 2 falls
    # back to general.
    voice_profile_id: scott

# ---- PERSONAS ----
# "I want to call the assistant Crane ... a Chief of Staff, not a secretary."
personas:
  - slug: crane
    status: active
    name: Crane
    title: Chief of Staff
    # "plainspoken and direct — executive-summary first ... keep it short."
    tone:
      - plainspoken
      - direct
      - executive-summary
      - concise
    # Inbox triage plus on-demand broker-mediated Workspace reads and writes.
    entitlements:
      exposure:
        internal_write: draft_for_review
        external_send: autonomous
        code_execution: autonomous
    skills:
      - name: inbox-triage
        version: pending
        initiation:
          manual: true
          scheduled: false
          webhook: false
        enabled: true
      - name: workspace
        version: pending
        initiation:
          manual: true
          scheduled: false
          webhook: false
        enabled: true
      # Handles inbound email to crane@smd.services. Intended trigger is the Gmail
      # push webhook (see gmail_push note below) — currently NOT wired, so this
      # skill does not fire until the watch is rebuilt as a broker operation.
      # initiation/exposure note — Crane's own identity, not Scott's. Wave A
      # writes Gmail drafts only; no Gmail send tool is authored for this skill.
      - name: email-reply
        version: pending
        initiation:
          manual: true
          scheduled: false
          webhook: false
        enabled: true
    # Native Google/Himalaya skills remain disabled because this customer uses
    # broker-mediated first-class tools and the customer-owned DWD credential.
    skills_disabled:
      - google-workspace
      - himalaya
    # inbox-triage cron disabled — wrong mailbox, dead-drop output, token burn.
    # Run on-demand only until args + delivery path are verified.
    # ALL CRON DISABLED 2026-06-18 (Captain directive): not in a position to have
    # any scheduled firing yet.
    # (health-monitor was RIPPED 2026-07-24: deterministic work-liveness alerting
    # in ss-fleet-alerts replaced the agentic poller, whose cron was never
    # materialized and whose ALERT_REQUIRED output had no delivery path.)

# ---- MCP CONNECTOR (Operator ⇄ Claude, Phase 1) ----
# Lets authored users reach this Operator from inside their own Claude
# (claude.ai / Claude Desktop) via the console-hosted MCP endpoint at
# https://smd.services/api/operator/smd/mcp. Console-side only — no Machine surface.
# Fail-closed: enabled:false (or an absent block) means no one connects; each
# access[] entry binds a users[] email to an active persona slug.
# See docs/design/operator/03-mcp-server-exposure.md.
mcp_connector:
  enabled: true
  # 'open' = the authored user reaches the Operator with no extra data fence
  # beyond the entitlement ceilings already in this config (Phase 1 posture).
  data_posture: open
  access:
    # Scott reaches Crane from his own Claude. This email MUST match both a
    # users[] entry above. clerk_subjects are the stable identities from the
    # Clerk accounts Scott may use for Claude; their emails may differ.
    - email: scott@smd.services
      profile: crane
      clerk_subjects:
        - user_3EEs0aMBRgu6PRxBa4g5YhHjggD
        - user_3E1RPGrTMxkSqciXMTyybUNSJWu

# ---- CONNECTORS ----
# Google Workspace (Gmail / Calendar / Drive) rides first-class tools mediated by
# the ADR 0045 Workspace broker — NOT the connector mechanism. The broker holds the
# DWD service-account credential (see google_auth: below) and exposes the governed
# workspace_* tools; the agent never holds the Google credential and there is no CLI
# to shell out to. No other external system is wired via the connector mechanism for
# this seat (Telegram is its own block), so the connector map is empty.
connectors: {}

# ---- TELEGRAM CHANNEL (ADR 0033) ----
# Crane is reachable on Telegram via Hermes' native polling adapter (getUpdates).
# No webhook/public surface. The bot TOKEN is the Fly
# secret TELEGRAM_BOT_TOKEN, which auto-enables the polling platform.
# The image must be built with the Dockerfile `--extra messaging` (python-telegram-bot);
# `--extra all` omits it.
#
# The ALLOWLIST below is the AUTHORED SOURCE OF TRUTH (not a loose Fly secret): the
# overlay translate.py _materialize_telegram_platform materializes it into the profile
# config.yaml `telegram:` block, which Hermes maps to TELEGRAM_ALLOWED_USERS.
# MANDATORY and fail-closed: the pinned Hermes ref allows ALL users when the allowlist
# is empty (telegram.py: `if not allowed_csv: return True`); the materializer raises on
# an empty allow_from, and the bootstrap guard (ensure-telegram-allowlist.py) refuses to
# launch if the token is set without a resolvable allowlist. Proven live 2026-06-01.
# ---- CUSTODY EXCEPTIONS (ADR 0044 Decision 8 / ADR 0045 §7, #1841) ----
# Crane authors `code_execution: autonomous` (delegate_task escalate-up per ADR
# 0049; health self-check). The custody guard therefore requires every
# gateway-held credential surface to be broker-mediated OR explicitly accepted
# here. Crane's only gateway surfaces are IDENTITY CHANNELS — its own Telegram
# bot and its own AgentMail inbox (the persona send_as identity). Their blast
# radius is the seat impersonating ITSELF, never reading a client's system of
# record, so they are exception-eligible (client-data connectors never are).
# Rationale + per-connector verdicts: operator/contracts/connector-custody-dispositions.md.
custody_exceptions:
  - telegram
  - agentmail

telegram:
  enabled: true
  # Permitted Telegram numeric user id(s). DM-only. 7367659986 = Scott Durgan.
  allow_from:
    - '7367659986'
  # 1:1 DM assistant: reply to every DM from an allowed user (no @mention needed).
  require_mention: false

# ---- GMAIL PUSH CHANNEL (DEFERRED — not wired) ----
# Inbound Gmail push delivery is intentionally absent. The prior gmail_push block was
# never materialized at runtime: no boot step established the Gmail watch, and its
# implementing CLI (crane_gmail_watch.py) authenticated via the legacy
# /opt/data/oauth/google.json path that the ADR 0045 broker cutover removed. So the
# email-reply skill was never actually push-triggered. Rebuilding the watch as a
# governed Workspace-broker operation is a tracked follow-up; restoring this block
# without that rebuild would re-declare a dead trigger. The validator
# (sections-gmail-push.ts) still accepts the block shape for the future rebuild.

# ---- SCOPE ----
scope:
  email_folders_visible:
    - Inbox
  email_folders_blind: []
  email_keyword_blocks: []
  domain_blocks: []
  # Autonomous external sends act only on direction from trusted senders
  # (interview: smdurgan.com / smd.services). Untrusted/spoofed senders are
  # triaged only.
  trusted_sender_domains:
    - smdurgan.com
    - smd.services
  # Allow list for email-reply skill: senders whose mail to crane@smd.services
  # may produce a Gmail draft. Fail-closed: absent or empty list = no drafts.
  # Add client addresses here when an engagement begins.
  inbound_allow_from:
    - smdurgan@smdurgan.com
    - scott@smd.services
  # ---- TRUST CEILINGS (per-action, ADR 0025) ----
  # External send remains authored for non-Workspace demo surfaces. Wave A Gmail
  # skills write drafts only; no principal Workspace send tool is exposed.
  # code_execution: autonomous enables the ADR 0049 escalate-up path (delegate_task
  # is a CODE_EXECUTION action, fail-closed unless authored). Re-opened on the
  # customer-zero dogfood seat for the two-tier cost test; the sticky taint gate
  # still withholds subagent-spawning on any turn that has read untrusted content.
escalation:
  red_flag_recipients:
    - team@smd.services
  failure_recipients:
    - team@smd.services

# ---- VOICE LIBRARY ----
# Actual R2 layout: vaults/smd/voice/cohort/{cohort-id}/{ulid}.json
# (written by voice-ingest-corpus.py; read by samples.retrieve_relevant_samples).
# The runtime derives the prefix from the customer slug — this block is metadata only.
voice_library:
  samples_path: 'r2://vaults/smd/voice/cohort/'
  cohorts:
    - id: general
      label: General

# ---- MEMORY (per-customer isolation invariants; must match customer_id) ----
# Phase 1 runs on Hermes' flat-file memory core (MEMORY.md/USER.md). Inferred memory
# (Honcho) is deferred to Phase 2 — see ADR 0016 (revised 2026-05-30).
memory:
  d1_namespace: smd
  r2_vault_path: 'vaults/smd/'
  vectorize_index: 'hermes-smd-vault'

# ---- RELATIONSHIP (authored behavioral lane, ADR 0048) ----
# How each person here likes Crane to work with them. INFORMATIONAL ONLY: these
# shape how Crane drafts and helps and NEVER grant capability — entitlements live
# in scope/escalation and are enforced by trust_ceiling regardless of this text.
# Distinct from the style lane (an output class's authored voice/format
# property, ADR 0083): behavioral working preferences, not draft phrasing.
#
# Seeded from Scott's standing working preferences (documented working feedback);
# authored content, human-reviewed — not inferred or fabricated. Refine as the
# working relationship develops. Materialized into Crane's SOUL.md by the overlay
# and surfaced read-only on the admin relationship view.
relationship:
  people:
    - id: scott-durgan
      name: Scott Durgan
      role: Principal
      prefers:
        - 'Lead with the material change and its consequence; skip process and bookkeeping narration'
        - 'Decide what the context already determines; reserve questions for genuinely ambiguous calls'
        - 'Move fast with low ceremony; engage as a peer, surface real risk once, then proceed'
      avoid:
        - 'Inventing time or effort estimates for work that has not been scoped'
        - 'Relitigating a decision that has already been made'
